<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 260" width="1280" height="260" role="img" aria-label="Research pipeline: decompile, capture, diff, verify, ship"><style>.s{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}.fl{stroke-dasharray:6 8;animation:fl 1.4s linear infinite}@keyframes fl{to{stroke-dashoffset:-28}}.dot{animation:dot 6s linear infinite}@keyframes dot{from{transform:translateX(0)}to{transform:translateX(980px)}}.st{animation:st 6s ease-in-out infinite}@keyframes st{0%,100%{opacity:.55}12%{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><clipPath id="rc"><rect width="1280" height="260" rx="18"/></clipPath></defs><g clip-path="url(#rc)"><rect width="1280" height="260" fill="#050a18"/><line x1="150" y1="76" x2="1130" y2="76" stroke="#4da3ff" stroke-opacity=".6" stroke-width="2" class="fl"/><circle cx="150" cy="76" r="6" fill="#22d3ee" class="dot"/><g class="st" style="animation-delay:0.0s"><circle cx="150" cy="76" r="30" fill="#0a1430" stroke="#2c5aa8" stroke-width="2"/><text x="150" y="82" text-anchor="middle" class="m" font-size="18" font-weight="700" fill="#22d3ee">01</text><text x="150" y="140" text-anchor="middle" class="m" font-size="15" font-weight="700" fill="#eaf2ff" letter-spacing="2">DECOMPILE</text><text x="150" y="170" text-anchor="middle" class="s" font-size="14" fill="#8aa0c8">Vendor Android app read with jadx.</text><text x="150" y="192" text-anchor="middle" class="s" font-size="14" fill="#8aa0c8">Names intact, nothing obfuscated.</text></g><g class="st" style="animation-delay:1.2s"><circle cx="395" cy="76" r="30" fill="#0a1430" stroke="#2c5aa8" stroke-width="2"/><text x="395" y="82" text-anchor="middle" class="m" font-size="18" font-weight="700" fill="#22d3ee">02</text><text x="395" y="140" text-anchor="middle" class="m" font-size="15" font-weight="700" fill="#eaf2ff" letter-spacing="2">CAPTURE</text><text x="395" y="170" text-anchor="middle" class="s" font-size="14" fill="#8aa0c8">Bluetooth log from a phone while one</text><text x="395" y="192" text-anchor="middle" class="s" font-size="14" fill="#8aa0c8">setting changes in the official app.</text></g><g class="st" style="animation-delay:2.4s"><circle cx="640" cy="76" r="30" fill="#0a1430" stroke="#2c5aa8" stroke-width="2"/><text x="640" y="82" text-anchor="middle" class="m" font-size="18" font-weight="700" fill="#22d3ee">03</text><text x="640" y="140" text-anchor="middle" class="m" font-size="15" font-weight="700" fill="#eaf2ff" letter-spacing="2">DIFF</text><text x="640" y="170" text-anchor="middle" class="s" font-size="14" fill="#8aa0c8">x20 state save, change one thing,</text><text x="640" y="192" text-anchor="middle" class="s" font-size="14" fill="#8aa0c8">x20 state diff: which bytes moved.</text></g><g class="st" style="animation-delay:3.6s"><circle cx="885" cy="76" r="30" fill="#0a1430" stroke="#2c5aa8" stroke-width="2"/><text x="885" y="82" text-anchor="middle" class="m" font-size="18" font-weight="700" fill="#22d3ee">04</text><text x="885" y="140" text-anchor="middle" class="m" font-size="15" font-weight="700" fill="#eaf2ff" letter-spacing="2">VERIFY</text><text x="885" y="170" text-anchor="middle" class="s" font-size="14" fill="#8aa0c8">Read it back from real hardware.</text><text x="885" y="192" text-anchor="middle" class="s" font-size="14" fill="#8aa0c8">Unread models stay read-only preview.</text></g><g class="st" style="animation-delay:4.8s"><circle cx="1130" cy="76" r="30" fill="#0a1430" stroke="#2c5aa8" stroke-width="2"/><text x="1130" y="82" text-anchor="middle" class="m" font-size="18" font-weight="700" fill="#22d3ee">05</text><text x="1130" y="140" text-anchor="middle" class="m" font-size="15" font-weight="700" fill="#eaf2ff" letter-spacing="2">SHIP</text><text x="1130" y="170" text-anchor="middle" class="s" font-size="14" fill="#8aa0c8">Applied on the PC, as a virtual pad.</text><text x="1130" y="192" text-anchor="middle" class="s" font-size="14" fill="#8aa0c8">Nothing is written to the controller.</text></g></g><rect x=".5" y=".5" width="1279" height="259" rx="18" fill="none" stroke="#1b2f57"/></svg>