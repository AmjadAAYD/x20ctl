<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 155" width="1000" height="155" role="img" aria-label="The Controller Check is the Read scan. Its partner, the Write scan, learns what KeyLinker writes to a controller. You change one setting in KeyLinker on an Android phone or an iPhone while the phone&#x27;s"><defs><radialGradient id="bg_1d4ed8"><stop offset="0" stop-color="#1d4ed8"/><stop offset=".55" stop-color="#1d4ed8" stop-opacity=".3"/><stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/></radialGradient><radialGradient id="bg_1e40af"><stop offset="0" stop-color="#1e40af"/><stop offset=".55" stop-color="#1e40af" stop-opacity=".3"/><stop offset="1" stop-color="#1e40af" stop-opacity="0"/></radialGradient><radialGradient id="bg_312e81"><stop offset="0" stop-color="#312e81"/><stop offset=".55" stop-color="#312e81" stop-opacity=".3"/><stop offset="1" stop-color="#312e81" stop-opacity="0"/></radialGradient><radialGradient id="bg_1e3a8a"><stop offset="0" stop-color="#1e3a8a"/><stop offset=".55" stop-color="#1e3a8a" stop-opacity=".3"/><stop offset="1" stop-color="#1e3a8a" stop-opacity="0"/></radialGradient><radialGradient id="bg_1d4ed8"><stop offset="0" stop-color="#1d4ed8"/><stop offset=".55" stop-color="#1d4ed8" stop-opacity=".3"/><stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/></radialGradient><pattern id="bg_grid" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="translate(0 -32)"><path d="M40 0H0V40" fill="none" stroke="#6ea0ff" stroke-opacity=".055"/></pattern><linearGradient id="bg_hbar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4da3ff"/><stop offset="1" stop-color="#4da3ff"/></linearGradient><clipPath id="bg_clip"><path d="M0 0 H1000 V155 H0 V0 Z"/></clipPath></defs><style>.bgA{animation:bgA 40s ease-in-out infinite alternate}.bgB{animation:bgB 52s ease-in-out infinite alternate}.bgC{animation:bgC 64s ease-in-out infinite alternate}@keyframes bgA{to{transform:translate(70px,30px)}}@keyframes bgB{to{transform:translate(-80px,40px)}}@keyframes bgC{to{transform:translate(50px,-50px)}}.bgP{stroke-dasharray:30 970;animation:bgP 9s linear infinite}@keyframes bgP{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}.bgR{animation:bgR 60s linear infinite}@keyframes bgR{to{transform:rotate(360deg)}}.bgRr{animation:bgR 90s linear infinite reverse}.bgF{animation:bgF 14s ease-in-out infinite alternate}@keyframes bgF{to{transform:translateY(-18px)}}.bgU{animation:bgU 26s linear infinite}@keyframes bgU{from{transform:translateY(0);opacity:0}10%{opacity:.8}90%{opacity:.8}to{transform:translateY(-360px);opacity:0}}.t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.mo{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><path d="M0 0 H1000 V155 H0 V0 Z" fill="#0a0f1c"/><g clip-path="url(#bg_clip)"><g class="bgC"><circle cx="920" cy="-242" r="480" fill="url(#bg_1d4ed8)" opacity="0.22"/></g><g class="bgA"><circle cx="80" cy="278" r="480" fill="url(#bg_1d4ed8)" opacity="0.22"/></g></g><defs><linearGradient id="fdl"><stop offset="0" stop-color="#0d1117" stop-opacity="0.95"/><stop offset="0.35" stop-color="#0d1117" stop-opacity="0.55"/><stop offset="0.7" stop-color="#0d1117" stop-opacity="0.18"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></linearGradient><linearGradient id="fdr" x1="1" x2="0"><stop offset="0" stop-color="#0d1117" stop-opacity="0.95"/><stop offset="0.35" stop-color="#0d1117" stop-opacity="0.55"/><stop offset="0.7" stop-color="#0d1117" stop-opacity="0.18"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></linearGradient></defs><rect width="46" height="155" fill="url(#fdl)"/><rect x="954" width="46" height="155" fill="url(#fdr)"/><text x="78.0" y="33.0" class="t" font-size="17" fill="#c4d3ee" textLength="206.0" lengthAdjust="spacingAndGlyphs">The Controller Check is the</text><text x="289.0" y="33.0" class="t" font-size="17" font-weight="700" fill="#ffd37a" textLength="79.0" lengthAdjust="spacingAndGlyphs">Read scan</text><text x="368.0" y="33.0" class="t" font-size="17" fill="#c4d3ee" textLength="122.0" lengthAdjust="spacingAndGlyphs">. Its partner, the</text><text x="495.0" y="33.0" class="t" font-size="17" font-weight="700" fill="#ffd37a" textLength="84.0" lengthAdjust="spacingAndGlyphs">Write scan</text><text x="579.0" y="33.0" class="t" font-size="17" fill="#c4d3ee" textLength="339.0" lengthAdjust="spacingAndGlyphs">, learns what KeyLinker writes to a controller.</text><text x="78.0" y="60.0" class="t" font-size="17" fill="#c4d3ee" textLength="797.0" lengthAdjust="spacingAndGlyphs">You change one setting in KeyLinker on an Android phone or an iPhone while the phone&#x27;s Bluetooth log</text><text x="78.0" y="87.0" class="t" font-size="17" fill="#c4d3ee" textLength="824.0" lengthAdjust="spacingAndGlyphs">records, then open the log here, and you can send the findings to X20CTL. X20CTL shows who the controller</text><text x="78.0" y="114.0" class="t" font-size="17" fill="#c4d3ee" textLength="836.0" lengthAdjust="spacingAndGlyphs">says it is, what it offers, and the bytes the app changed. X20CTL sends nothing to the controller. It&#x27;s slow: plan</text><text x="78.0" y="141.0" class="t" font-size="17" fill="#c4d3ee" textLength="259.0" lengthAdjust="spacingAndGlyphs">on 20 to 40 minutes the first time.</text></svg>