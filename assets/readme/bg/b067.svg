ay:-23s"/><circle cx="615" cy="273" r="1.8" fill="#9fc4ff" class="bgU" style="animation-duration:22s;animation-delay:-12s"/></g><defs><clipPath id="cc"><rect x="40" y="0" width="920" height="155"/></clipPath></defs><g clip-path="url(#cc)"><g transform="translate(40 0)"><path d="M16 0 H904 A16 16 0 0 1 920 16 V171 H0 V16 A16 16 0 0 1 16 0 Z" fill="#060c1f" fill-opacity=".76" stroke="#1b2f57"/></g></g><text x="78.0" y="33.0" class="t" font-size="17" fill="#c4d3ee" textLength="206.0" lengthAdjust="spacingAndGlyphs">The Controller Check is the</text><text x="289.0" y="33.0" class="t" font-size="17" font-weight="700" fill="#ffffff" textLength="79.0" lengthAdjust="spacingAndGlyphs">Read scan</text><text x="368.0" y="33.0" class="t" font-size="17" fill="#c4d3ee" textLength="122.0" lengthAdjust="spacingAndGlyphs">. Its partner, the</text><text x="495.0" y="33.0" class="t" font-size="17" font-weight="700" fill="#ffffff" textLength="84.0" lengthAdjust="spacingAndGlyphs">Write scan</text><text x="579.0" y="33.0" class="t" font-size="17" fill="#c4d3ee" textLength="339.0" lengthAdjust="spacingAndGlyphs">, learns what KeyLinker writes to a controller.</text><text x="78.0" y="60.0" class="t" font-size="17" fill="#c4d3ee" textLength="797.0" lengthAdjust="spacingAndGlyphs">You change one setting in KeyLinker on an Android phone or an iPhone while the phone&#x27;s Bluetooth log</text><text x="78.0" y="87.0" class="t" font-size="17" fill="#c4d3ee" textLength="824.0" lengthAdjust="spacingAndGlyphs">records, then open the log here, and you can send the findings to X20CTL. X20CTL shows who the controller</text><text x="78.0" y="114.0" class="t" font-size="17" fill="#c4d3ee" textLength="836.0" lengthAdjust="spacingAndGlyphs">says it is, what it offers, and the bytes the app changed. X20CTL sends nothing to the controller. It&#x27;s slow: plan</text><text x="78.0" y="141.0" class="t" font-size="17" fill="#c4d3ee" textLength="259.0" lengthAdjust="spacingAndGlyphs">on 20 to 40 minutes the first time.</text></svg>