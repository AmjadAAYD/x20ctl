ext><text x="272.0" y="33.0" class="t" font-size="17" fill="#c4d3ee" textLength="649.0" lengthAdjust="spacingAndGlyphs">X20CTL is open-source software. EasySMX supplied an X20 Pro to help develop it, but</text><text x="98.0" y="60.0" class="t" font-size="17" fill="#c4d3ee" textLength="823.0" lengthAdjust="spacingAndGlyphs">the app is not made, endorsed, sponsored or supported by EasySMX. Product names belong to their owners</text><text x="98.0" y="87.0" class="t" font-size="17" fill="#c4d3ee" textLength="470.0" lengthAdjust="spacingAndGlyphs">and are used only to say which controllers X20CTL works with.</text></svg>