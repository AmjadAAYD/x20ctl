<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 155" width="1000" height="155" role="img" aria-label="X20CTL is a native Windows app for EasySMX controllers. It gives every pad a console-style studio: remap buttons, shape the sticks and triggers, build macros for the back paddles, preview vibration, c"><defs><radialGradient id="bg_1d4ed8"><stop offset="0" stop-color="#1d4ed8"/><stop offset=".55" stop-color="#1d4ed8" stop-opacity=".3"/><stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/></radialGradient><radialGradient id="bg_0891b2"><stop offset="0" stop-color="#0891b2"/><stop offset=".55" stop-color="#0891b2" stop-opacity=".3"/><stop offset="1" stop-color="#0891b2" stop-opacity="0"/></radialGradient><radialGradient id="bg_4f46e5"><stop offset="0" stop-color="#4f46e5"/><stop offset=".55" stop-color="#4f46e5" stop-opacity=".3"/><stop offset="1" stop-color="#4f46e5" stop-opacity="0"/></radialGradient><radialGradient id="bg_0e7490"><stop offset="0" stop-color="#0e7490"/><stop offset=".55" stop-color="#0e7490" stop-opacity=".3"/><stop offset="1" stop-color="#0e7490" stop-opacity="0"/></radialGradient><radialGradient id="bg_6d28d9"><stop offset="0" stop-color="#6d28d9"/><stop offset=".55" stop-color="#6d28d9" stop-opacity=".3"/><stop offset="1" stop-color="#6d28d9" stop-opacity="0"/></radialGradient><pattern id="bg_grid" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="translate(0 -13)"><path d="M40 0H0V40" fill="none" stroke="#6ea0ff" stroke-opacity=".055"/></pattern><clipPath id="bg_clip"><path d="M0 0 H1000 V155 H0 V0 Z"/></clipPath></defs><style>.bgA{animation:bgA 40s ease-in-out infinite alternate}.bgB{animation:bgB 52s ease-in-out infinite alternate}.bgC{animation:bgC 64s ease-in-out infinite alternate}@keyframes bgA{to{transform:translate(70px,30px)}}@keyframes bgB{to{transform:translate(-80px,40px)}}@keyframes bgC{to{transform:translate(50px,-50px)}}.bgP{stroke-dasharray:30 970;animation:bgP 9s linear infinite}@keyframes bgP{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}.bgR{animation:bgR 60s linear infinite}@keyframes bgR{to{transform:rotate(360deg)}}.bgRr{animation:bgR 90s linear infinite reverse}.bgF{animation:bgF 14s ease-in-out infinite alternate}@keyframes bgF{to{transform:translateY(-18px)}}.bgU{animation:bgU 26s linear infinite}@keyframes bgU{from{transform:translateY(0);opacity:0}10%{opacity:.8}90%{opacity:.8}to{transform:translateY(-360px);opacity:0}}.t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.mo{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><path d="M0 0 H1000 V155 H0 V0 Z" fill="#04070f"/><g clip-path="url(#bg_clip)"><g class="bgC"><circle cx="80" cy="-343" r="480" fill="url(#bg_4f46e5)" opacity="0.5"/></g><g class="bgA"><circle cx="920" cy="177" r="480" fill="url(#bg_0e7490)" opacity="0.5"/></g><rect width="1000" height="155" fill="url(#bg_grid)"/><g transform="translate(0 -1533)"><path d="M62 1489 H397 V1449 H549 V1489 H243 V1555" fill="none" stroke="#2b4b86" stroke-opacity=".55" stroke-width="1.3" stroke-linejoin="round"/><path d="M62 1489 H397 V1449 H549 V1489 H243 V1555" pathLength="1000" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="bgP" style="animation-delay:-2.3s"/><circle cx="62" cy="1489" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="397" cy="1449" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="549" cy="1489" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="243" cy="1555" r="2.6" fill="#3b6bc4" opacity=".7"/></g><g transform="translate(0 -1533)"><path d="M689 1621 H897 V1687 H1085 V1753 H1297 V1687" fill="none" stroke="#2b4b86" stroke-opacity=".55" stroke-width="1.3" stroke-linejoin="round"/><path d="M689 1621 H897 V1687 H1085 V1753 H1297 V1687" pathLength="1000" fill="none" stroke="#4da3ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="bgP" style="animation-delay:-5.9s"/><circle cx="689" cy="1621" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="897" cy="1687" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="1085" cy="1753" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="1297" cy="1687" r="2.6" fill="#3b6bc4" opacity=".7"/></g><circle cx="627" cy="351" r="2.0" fill="#9fc4ff" class="bgU" style="animation-duration:31s;animation-delay:-8s"/><circle cx="755" cy="210" r="1.3" fill="#9fc4ff" class="bgU" style="animation-duration:36s;animation-delay:-24s"/><circle cx="394" cy="506" r="1.8" fill="#9fc4ff" class="bgU" style="animation-duration:27s;animation-delay:-13s"/><circle cx="478" cy="115" r="0.9" fill="#9fc4ff" class="bgU" style="animation-duration:29s;animation-delay:-20s"/><circle cx="39" cy="156" r="1.4" fill="#9fc4ff" class="bgU" style="animation-duration:21s;animation-delay:-24s"/><circle cx="479" cy="79" r="1.3" fill="#9fc4ff" class="bgU" style="animation-duration:29s;animation-delay:-14s"/><circle cx="153" cy="414" r="1.1" fill="#9fc4ff" class="bgU" style="animation-duration:23s;animation-delay:-12s"/><circle cx="621" cy="160" r="2.0" fill="#9fc4ff" class="bgU" style="animation-duration:30s;animation-delay:-18s"/><circle cx="993" cy="56" r="1.5" fill="#9fc4ff" class="bgU" style="animation-duration:21s;animation-delay:-10s"/><circle cx="743" cy="54" r="1.3" fill="#9fc4ff" class="bgU" style="animation-duration:23s;animation-delay:-7s"/><circle cx="760" cy="86" r="1.5" fill="#9fc4ff" class="bgU" style="animation-duration:36s;animation-delay:-26s"/><circle cx="638" cy="345" r="1.3" fill="#9fc4ff" class="bgU" style="animation-duration:34s;animation-delay:-11s"/><circle cx="765" cy="255" r="1.7" fill="#9fc4ff" class="bgU" style="animation-duration:22s;animation-delay:-20s"/><circle cx="688" cy="252" r="1.7" fill="#9fc4ff" class="bgU" style="animation-duration:29s;animation-delay:-5s"/></g><defs><clipPath id="cc"><rect x="40" y="0" width="920" height="155"/></clipPath></defs><g clip-path="url(#cc)"><g transform="translate(40 -16)"><path d="M0 0 H920 V187 H0 V0 Z" fill="#060c1f" fill-opacity=".76" stroke="#1b2f57"/></g></g><text x="78.0" y="33.0" class="t" font-size="17" fill="#c4d3ee" textLength="798.0" lengthAdjust="spacingAndGlyphs">X20CTL is a native Windows app for EasySMX controllers. It gives every pad a console-style studio: remap</text><text x="78.0" y="60.0" class="t" font-size="17" fill="#c4d3ee" textLength="793.0" lengthAdjust="spacingAndGlyphs">buttons, shape the sticks and triggers, build macros for the back paddles, preview vibration, check that a</text><text x="78.0" y="87.0" class="t" font-size="17" fill="#c4d3ee" textLength="820.0" lengthAdjust="spacingAndGlyphs">controller really works, and use it as a mouse. It runs entirely on your PC, with no account and no web page</text><text x="78.0" y="114.0" class="t" font-size="17" fill="#c4d3ee" textLength="783.0" lengthAdjust="spacingAndGlyphs">inside a window. Up to four players each pick their own controller, and every page can be driven with a</text><text x="78.0" y="141.0" class="t" font-size="17" fill="#c4d3ee" textLength="336.0" lengthAdjust="spacingAndGlyphs">gamepad, like a console&#x27;s big-picture mode.</text></svg>