<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 94" width="1000" height="94" role="img" aria-label="Code signing and Linux runtime status">
  <defs>
    <linearGradient id="bg_dlf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CFC7AE"/>
      <stop offset="5%" stop-color="#DDD7C3"/>
      <stop offset="50%" stop-color="#DAD4BE"/>
      <stop offset="95%" stop-color="#D5CEB6"/>
      <stop offset="100%" stop-color="#CFC7AE"/>
    </linearGradient>
    <pattern id="scan_dlf" width="8" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="8" y2="0" stroke="#BCB49A" stroke-width="0.6" opacity="0.22"/>
    </pattern>
    
    <style>
      .s { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      
    </style>
  </defs>
  <rect x="0" y="0" width="1000" height="94" fill="url(#bg_dlf)"/>
  <rect x="0" y="0" width="1000" height="94" fill="url(#scan_dlf)"/>
  <line x1="26" y1="0" x2="26" y2="94" stroke="#BCB49A" stroke-width="1"/>
  <line x1="30" y1="0" x2="30" y2="94" stroke="#BCB49A" stroke-width="0.6" opacity="0.65"/>
  <line x1="974" y1="0" x2="974" y2="94" stroke="#BCB49A" stroke-width="1"/>
  <line x1="970" y1="0" x2="970" y2="94" stroke="#BCB49A" stroke-width="0.6" opacity="0.65"/>
  <text x="52" y="28" class="s" font-size="13.5" fill="#35322B"><tspan font-weight="700">Code signing:</tspan> Built on GitHub Actions; applied for free open-source signing via SignPath Foundation. Until active,</text>
  <text x="52" y="49" class="s" font-size="13.5" fill="#35322B">executables are unsigned so SmartScreen may warn — verify hashes and never turn off antivirus protection.</text>
  <text x="52" y="74" class="s" font-size="13.5" fill="#6F6858"><tspan font-weight="700" fill="#35322B">Linux note:</tspan> Avalonia Studio bundles build in CI and pass headless checks, awaiting real Linux hardware tests. CLI: <tspan class="m">uv run x20 scan</tspan>.</text>
</svg>
