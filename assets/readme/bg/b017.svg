rm:translate(-80px,40px)}}@keyframes bgC{to{transform:translate(50px,-50px)}}.bgP{stroke-dasharray:30 970;animation:bgP 9s linear infinite}@keyframes bgP{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}.bgR{animation:bgR 60s linear infinite}@keyframes bgR{to{transform:rotate(360deg)}}.bgRr{animation:bgR 90s linear infinite reverse}.bgF{animation:bgF 14s ease-in-out infinite alternate}@keyframes bgF{to{transform:translateY(-18px)}}.bgU{animation:bgU 26s linear infinite}@keyframes bgU{from{transform:translateY(0);opacity:0}10%{opacity:.8}90%{opacity:.8}to{transform:translateY(-360px);opacity:0}}.t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.mo{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><path d="M0 0 H1000 V182 H0 V0 Z" fill="#04070f"/><g clip-path="url(#bg_clip)"><g class="bgB"><circle cx="920" cy="-179" r="480" fill="url(#bg_4f46e5)" opacity="0.5"/></g><g class="bgC"><circle cx="80" cy="341" r="480" fill="url(#bg_0e7490)" opacity="0.5"/></g><rect width="1000" height="182" fill="url(#bg_grid)"/><g transform="translate(0 -3969)"><path d="M563 3951 H413 V4017 H797 V3977 H431 V4017" fill="none" stroke="#2b4b86" stroke-opacity=".55" stroke-width="1.3" stroke-linejoin="round"/><path d="M563 3951 H413 V4017 H797 V3977 H431 V4017" pathLength="1000" fill="none" stroke="#4da3ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="bgP" style="animation-delay:-6.1s"/><circle cx="563" cy="3951" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="413" cy="4017" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="797" cy="3977" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="431" cy="4017" r="2.6" fill="#3b6bc4" opacity=".7"/></g><g transform="translate(0 -3969)"><path d="M617 4089 H319 V4155 H646 V4089 H966 V4129" fill="none" stroke="#2b4b86" stroke-opacity=".55" stroke-width="1.3" stroke-linejoin="round"/><path d="M617 4089 H319 V4155 H646 V4089 H966 V4129" pathLength="1000" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="bgP" style="animation-delay:-5.5s"/><circle cx="617" cy="4089" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="319" cy="4155" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="646" cy="4089" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="966" cy="4129" r="2.6" fill="#3b6bc4" opacity=".7"/></g><g transform="translate(70 -49)" opacity=".5"><circle r="140" fill="none" stroke="#2f5dae" stroke-opacity=".6"/><circle r="92" fill="none" stroke="#2f5dae" stroke-opacity=".45" stroke-dasharray="3 7"/><circle r="46" fill="none" stroke="#2f5dae" stroke-opacity=".5"/><line x1="-140" x2="140" stroke="#2f5dae" stroke-opacity=".3"/><line y1="-140" y2="140" stroke="#2f5dae" stroke-opacity=".3"/><g class="bgR"><circle cx="140" r="4.5" fill="#22d3ee"/></g><g class="bgRr"><circle cx="92" r="3.5" fill="#4da3ff"/></g></g><circle cx="150" cy="501" r="1.8" fill="#9fc4ff" class="bgU" style="animation-duration:36s;animation-delay:-2s"/><circle cx="921" cy="463" r="0.9" fill="#9fc4ff" class="bgU" style="animation-duration:29s;animation-delay:-2s"/><circle cx="977" cy="418" r="1.0" fill="#9fc4ff" class="bgU" style="animation-duration:24s;animation-delay:-24s"/><circle cx="394" cy="198" r="1.1" fill="#9fc4ff" class="bgU" style="animation-duration:36s;animation-delay:-19s"/><circle cx="872" cy="292" r="1.7" fill="#9fc4ff" class="bgU" style="animation-duration:26s;animation-delay:-24s"/><circle cx="790" cy="435" r="1.1" fill="#9fc4ff" class="bgU" style="animation-duration:28s;animation-delay:-10s"/><circle cx="696" cy="343" r="1.3" fill="#9fc4ff" class="bgU" style="animation-duration:22s;animation-delay:-13s"/><circle cx="556" cy="539" r="1.8" fill="#9fc4ff" class="bgU" style="animation-duration:33s;animation-delay:-26s"/><circle cx="221" cy="479" r="1.0" fill="#9fc4ff" class="bgU" style="animation-duration:28s;animation-delay:-22s"/><circle cx="103" cy="497" r="1.0" fill="#9fc4ff" class="bgU" style="animation-duration:30s;animation-delay:-8s"/></g><defs><linearGradient id="fdl"><stop offset="0" stop-color="#0d1117" stop-opacity="0.95"/><stop offset="0.35" stop-color="#0d1117" stop-opacity="0.55"/><stop offset="0.7" stop-color="#0d1117" stop-opacity="0.18"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></linearGradient><linearGradient id="fdr" x1="1" x2="0"><stop offset="0" stop-color="#0d1117" stop-opacity="0.95"/><stop offset="0.35" stop-color="#0d1117" stop-opacity="0.55"/><stop offset="0.7" stop-color="#0d1117" stop-opacity="0.18"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></linearGradient></defs><rect width="46" height="182" fill="url(#fdl)"/><rect x="954" width="46" height="182" fill="url(#fdr)"/><defs><clipPath id="cc"><rect x="40" y="0" width="920" height="182"/></clipPath></defs><g clip-path="url(#cc)"><g transform="translate(40 -16)"><path d="M0 0 H920 V214 H0 V0 Z" fill="#060c1f" fill-opacity=".76" stroke="#1b2f57"/></g></g><text x="78.0" y="33.0" class="t" font-size="17" fill="#c4d3ee" textLength="821.9" lengthAdjust="spacingAndGlyphs">A small assistant drawn as a controller, in the Studio&#x27;s title bar. Tell it in your own words how you play and it</text><text x="78.0" y="60.0" class="t" font-size="17" fill="#c4d3ee" textLength="813.0" lengthAdjust="spacingAndGlyphs">sets your PC mode for you: stick and trigger curves, dead zones, hair triggers, turbo, remaps, mouse mode,</text><text x="78.0" y="87.0" class="t" font-size="17" fill="#c4d3ee" textLength="833.0" lengthAdjust="spacingAndGlyphs">and measuring stick drift. It checks every request against fixed rules before it changes anything, shows exactly</text><text x="78.0" y="114.0" class="t" font-size="17" fill="#c4d3ee" textLength="790.0" lengthAdjust="spacingAndGlyphs">what changed, and has an Undo. It also answers questions about the app from these docs. Spelling and</text><text x="78.0" y="141.0" class="t" font-size="17" fill="#c4d3ee" textLength="791.0" lengthAdjust="spacingAndGlyphs">grammar don&#x27;t matter: it works out what you meant and tells you how it read it. It runs on your PC with</text><text x="78.0" y="168.0" class="t" font-size="17" fill="#c4d3ee" textLength="415.0" lengthAdjust="spacingAndGlyphs">nothing to install, and nothing you type leaves it. Type</text><text x="498.0" y="168.0" class="t" font-size="17" font-weight="700" fill="#ffd37a" textLength="35.0" lengthAdjust="spacingAndGlyphs">help</text><text x="538.0" y="168.0" class="t" font-size="17" fill="#c4d3ee" textLength="207.0" lengthAdjust="spacingAndGlyphs">to see everything it can do.</text></svg>