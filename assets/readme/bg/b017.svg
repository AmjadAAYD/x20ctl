<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 182" width="1000" height="182" role="img" aria-label="A small assistant drawn as a controller, in the Studio&#x27;s title bar. Tell it in your own words how you play and it sets your PC mode for you: stick and trigger curves, dead zones, hair triggers, turbo,"><defs><radialGradient id="bg_1d4ed8"><stop offset="0" stop-color="#1d4ed8"/><stop offset=".55" stop-color="#1d4ed8" stop-opacity=".3"/><stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/></radialGradient><radialGradient id="bg_1e40af"><stop offset="0" stop-color="#1e40af"/><stop offset=".55" stop-color="#1e40af" stop-opacity=".3"/><stop offset="1" stop-color="#1e40af" stop-opacity="0"/></radialGradient><radialGradient id="bg_312e81"><stop offset="0" stop-color="#312e81"/><stop offset=".55" stop-color="#312e81" stop-opacity=".3"/><stop offset="1" stop-color="#312e81" stop-opacity="0"/></radialGradient><radialGradient id="bg_1e3a8a"><stop offset="0" stop-color="#1e3a8a"/><stop offset=".55" stop-color="#1e3a8a" stop-opacity=".3"/><stop offset="1" stop-color="#1e3a8a" stop-opacity="0"/></radialGradient><radialGradient id="bg_1d4ed8"><stop offset="0" stop-color="#1d4ed8"/><stop offset=".55" stop-color="#1d4ed8" stop-opacity=".3"/><stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/></radialGradient><pattern id="bg_grid" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="translate(0 -9)"><path d="M40 0H0V40" fill="none" stroke="#6ea0ff" stroke-opacity=".055"/></pattern><linearGradient id="bg_hbar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4da3ff"/><stop offset="1" stop-color="#4da3ff"/></linearGradient><clipPath id="bg_clip"><path d="M0 0 H1000 V182 H0 V0 Z"/></clipPath></defs><style>.bgA{animation:bgA 40s ease-in-out infinite alternate}.bgB{animation:bgB 52s ease-in-out infinite alternate}.bgC{animation:bgC 64s ease-in-out infinite alternate}@keyframes bgA{to{transform:translate(70px,30px)}}@keyframes bgB{to{transform:translate(-80px,40px)}}@keyframes bgC{to{transform:translate(50px,-50px)}}.bgP{stroke-dasharray:30 970;animation:bgP 9s linear infinite}@keyframes bgP{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}.bgR{animation:bgR 60s linear infinite}@keyframes bgR{to{transform:rotate(360deg)}}.bgRr{animation:bgR 90s linear infinite reverse}.bgF{animation:bgF 14s ease-in-out infinite alternate}@keyframes bgF{to{transform:translateY(-18px)}}.bgU{animation:bgU 26s linear infinite}@keyframes bgU{from{transform:translateY(0);opacity:0}10%{opacity:.8}90%{opacity:.8}to{transform:translateY(-360px);opacity:0}}.t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.mo{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><path d="M0 0 H1000 V182 H0 V0 Z" fill="#0a0f1c"/><g clip-path="url(#bg_clip)"><g class="bgB"><circle cx="920" cy="-179" r="480" fill="url(#bg_312e81)" opacity="0.22"/></g><g class="bgC"><circle cx="80" cy="341" r="480" fill="url(#bg_1e3a8a)" opacity="0.22"/></g></g><defs><linearGradient id="fdl"><stop offset="0" stop-color="#0d1117" stop-opacity="0.95"/><stop offset="0.35" stop-color="#0d1117" stop-opacity="0.55"/><stop offset="0.7" stop-color="#0d1117" stop-opacity="0.18"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></linearGradient><linearGradient id="fdr" x1="1" x2="0"><stop offset="0" stop-color="#0d1117" stop-opacity="0.95"/><stop offset="0.35" stop-color="#0d1117" stop-opacity="0.55"/><stop offset="0.7" stop-color="#0d1117" stop-opacity="0.18"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></linearGradient></defs><rect width="46" height="182" fill="url(#fdl)"/><rect x="954" width="46" height="182" fill="url(#fdr)"/><text x="78.0" y="33.0" class="t" font-size="17" fill="#c4d3ee" textLength="821.9" lengthAdjust="spacingAndGlyphs">A small assistant drawn as a controller, in the Studio&#x27;s title bar. Tell it in your own words how you play and it</text><text x="78.0" y="60.0" class="t" font-size="17" fill="#c4d3ee" textLength="813.0" lengthAdjust="spacingAndGlyphs">sets your PC mode for you: stick and trigger curves, dead zones, hair triggers, turbo, remaps, mouse mode,</text><text x="78.0" y="87.0" class="t" font-size="17" fill="#c4d3ee" textLength="833.0" lengthAdjust="spacingAndGlyphs">and measuring stick drift. It checks every request against fixed rules before it changes anything, shows exactly</text><text x="78.0" y="114.0" class="t" font-size="17" fill="#c4d3ee" textLength="790.0" lengthAdjust="spacingAndGlyphs">what changed, and has an Undo. It also answers questions about the app from these docs. Spelling and</text><text x="78.0" y="141.0" class="t" font-size="17" fill="#c4d3ee" textLength="791.0" lengthAdjust="spacingAndGlyphs">grammar don&#x27;t matter: it works out what you meant and tells you how it read it. It runs on your PC with</text><text x="78.0" y="168.0" class="t" font-size="17" fill="#c4d3ee" textLength="415.0" lengthAdjust="spacingAndGlyphs">nothing to install, and nothing you type leaves it. Type</text><text x="498.0" y="168.0" class="t" font-size="17" font-weight="700" fill="#ffffff" textLength="35.0" lengthAdjust="spacingAndGlyphs">help</text><text x="538.0" y="168.0" class="t" font-size="17" fill="#c4d3ee" textLength="207.0" lengthAdjust="spacingAndGlyphs">to see everything it can do.</text></svg>