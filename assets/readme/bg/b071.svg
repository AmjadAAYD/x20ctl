ngAndGlyphs">Read scan</text><text x="368.0" y="33.0" class="t" font-size="17" fill="#c4d3ee" textLength="122.0" lengthAdjust="spacingAndGlyphs">. Its partner, the</text><text x="495.0" y="33.0" class="t" font-size="17" font-weight="700" fill="#ffd37a" textLength="84.0" lengthAdjust="spacingAndGlyphs">Write scan</text><text x="579.0" y="33.0" class="t" font-size="17" fill="#c4d3ee" textLength="339.0" lengthAdjust="spacingAndGlyphs">, learns what KeyLinker writes to a controller.</text><text x="78.0" y="60.0" class="t" font-size="17" fill="#c4d3ee" textLength="797.0" lengthAdjust="spacingAndGlyphs">You change one setting in KeyLinker on an Android phone or an iPhone while the phone&#x27;s Bluetooth log</text><text x="78.0" y="87.0" class="t" font-size="17" fill="#c4d3ee" textLength="824.0" lengthAdjust="spacingAndGlyphs">records, then open the log here, and you can send the findings to X20CTL. X20CTL shows who the controller</text><text x="78.0" y="114.0" class="t" font-size="17" fill="#c4d3ee" textLength="836.0" lengthAdjust="spacingAndGlyphs">says it is, what it offers, and the bytes the app changed. X20CTL sends nothing to the controller. It&#x27;s slow: plan</text><text x="78.0" y="141.0" class="t" font-size="17" fill="#c4d3ee" textLength="259.0" lengthAdjust="spacingAndGlyphs">on 20 to 40 minutes the first time.</text></svg>