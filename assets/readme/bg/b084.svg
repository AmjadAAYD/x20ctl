<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 325" width="1000" height="325" role="img" aria-label="No account. No telemetry. The update check is on by default and you can turn it off with Keep X20CTL up to date in Tools. PC mode names its two drivers and asks before it installs them. Your setups, drafts and assignments stay in your user folder.; Every change is a local draft until it can be sent "><defs><radialGradient id="nbK"><stop offset="0" stop-color="#000" stop-opacity=".8"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient><radialGradient id="nbC"><stop offset="0" stop-color="#fff7e0" stop-opacity=".95"/><stop offset=".35" stop-color="#ffd9a0" stop-opacity=".35"/><stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/></radialGradient><radialGradient id="nb0d9488"><stop offset="0" stop-color="#0d9488" stop-opacity="1"/><stop offset=".55" stop-color="#0d9488" stop-opacity=".35"/><stop offset="1" stop-color="#0d9488" stop-opacity="0"/></radialGradient><radialGradient id="nb1d4ed8"><stop offset="0" stop-color="#1d4ed8" stop-opacity="1"/><stop offset=".55" stop-color="#1d4ed8" stop-opacity=".35"/><stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/></radialGradient><radialGradient id="nb2563eb"><stop offset="0" stop-color="#2563eb" stop-opacity="1"/><stop offset=".55" stop-color="#2563eb" stop-opacity=".35"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient><radialGradient id="nb6d28d9"><stop offset="0" stop-color="#6d28d9" stop-opacity="1"/><stop offset=".55" stop-color="#6d28d9" stop-opacity=".35"/><stop offset="1" stop-color="#6d28d9" stop-opacity="0"/></radialGradient><radialGradient id="nb7c3aed"><stop offset="0" stop-color="#7c3aed" stop-opacity="1"/><stop offset=".55" stop-color="#7c3aed" stop-opacity=".35"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient><radialGradient id="nbbe185d"><stop offset="0" stop-color="#be185d" stop-opacity="1"/><stop offset=".55" stop-color="#be185d" stop-opacity=".35"/><stop offset="1" stop-color="#be185d" stop-opacity="0"/></radialGradient><radialGradient id="nbdb2777"><stop offset="0" stop-color="#db2777" stop-opacity="1"/><stop offset=".55" stop-color="#db2777" stop-opacity=".35"/><stop offset="1" stop-color="#db2777" stop-opacity="0"/></radialGradient><linearGradient id="bg_hbar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><clipPath id="bg_clip"><path d="M0 0 H1000 V325 H0 V0 Z"/></clipPath></defs><style>.da{animation:da 38s ease-in-out infinite alternate}.db{animation:db 46s ease-in-out infinite alternate}.dc{animation:dc 52s ease-in-out infinite alternate}@keyframes da{to{transform:translate(60px,26px)}}@keyframes db{to{transform:translate(-70px,34px)}}@keyframes dc{to{transform:translate(44px,-46px)}}.gr{animation:gr 140s linear infinite}@keyframes gr{to{transform:rotate(360deg)}}.t0{animation:tw 3s ease-in-out infinite}.t1{animation:tw 4.5s ease-in-out infinite;animation-delay:-1.2s}.t2{animation:tw 6s ease-in-out infinite;animation-delay:-3s}@keyframes tw{50%{opacity:.15}}.shs{animation:shs 11s linear infinite}@keyframes shs{0%,80%{transform:translate(0,0);opacity:0}82%{opacity:1}94%{transform:translate(300px,140px);opacity:0}100%{opacity:0}}.t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.mo{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><path d="M0 0 H1000 V325 H0 V0 Z" fill="#04050f"/><g clip-path="url(#bg_clip)"><g class="da"><ellipse cx="200" cy="-102" rx="568" ry="310" fill="url(#nb7c3aed)" opacity="0.55"/></g><g class="db"><ellipse cx="890" cy="338" rx="570" ry="310" fill="url(#nbdb2777)" opacity="0.42"/></g><ellipse cx="480" cy="18" rx="430" ry="125" fill="url(#nbK)" transform="rotate(-12 480 18)"/><circle cx="218" cy="204" r="1.3" fill="#ffffff" opacity="0.59"/><circle cx="705" cy="54" r="1.3" fill="