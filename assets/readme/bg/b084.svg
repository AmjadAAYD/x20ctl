ity="0.96" class="t1"/><circle cx="62" cy="243" r="1.8" fill="#ffe9c4" opacity="0.62"/><circle cx="302" cy="57" r="1.8" fill="#ffffff" opacity="0.57"/><circle cx="920" cy="11" r="1.8" fill="#ffffff" opacity="0.66"/><circle cx="414" cy="196" r="0.6" fill="#ffffff" opacity="0.83" class="t0"/><circle cx="882" cy="179" r="1.8" fill="#ffffff" opacity="0.63"/><circle cx="444" cy="148" r="0.6" fill="#e9d5ff" opacity="0.56"/><circle cx="474" cy="137" r="1.0" fill="#ffe9c4" opacity="0.66"/><circle cx="83" cy="271" r="1.3" fill="#cfe3ff" opacity="0.59"/><circle cx="963" cy="108" r="1.0" fill="#cfe3ff" opacity="0.58"/><circle cx="532" cy="289" r="1.8" fill="#cfe3ff" opacity="0.61"/><circle cx="441" cy="261" r="1.3" fill="#cfe3ff" opacity="0.72"/><circle cx="769" cy="102" r="0.8" fill="#ffe9c4" opacity="0.99" class="t1"/><circle cx="792" cy="27" r="1.8" fill="#ffe9c4" opacity="0.52"/><circle cx="663" cy="58" r="1.8" fill="#e9d5ff" opacity="0.63"/><circle cx="188" cy="316" r="1.3" fill="#e9d5ff" opacity="0.69"/><circle cx="779" cy="139" r="0.8" fill="#ffe9c4" opacity="0.78" class="t1"/></g><defs><linearGradient id="fdl"><stop offset="0" stop-color="#0d1117" stop-opacity="0.95"/><stop offset="0.35" stop-color="#0d1117" stop-opacity="0.55"/><stop offset="0.7" stop-color="#0d1117" stop-opacity="0.18"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></linearGradient><linearGradient id="fdr" x1="1" x2="0"><stop offset="0" stop-color="#0d1117" stop-opacity="0.95"/><stop offset="0.35" stop-color="#0d1117" stop-opacity="0.55"/><stop offset="0.7" stop-color="#0d1117" stop-opacity="0.18"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></linearGradient></defs><rect width="46" height="325" fill="url(#fdl)"/><rect x="954" width="46" height="325" fill="url(#fdr)"/><defs><clipPath id="cc"><rect x="40" y="0" width="920" height="325"/></clipPath></defs><g clip-path="url(#cc)"><g transform="translate(40 -16)"><path d="M0 0 H920 V357 H0 V0 Z" fill="#050818" fill-opacity=".62" stroke="#2a2f6a" stroke-opacity=".8"/></g></g><circle cx="86" cy="25" r="3.5" fill="#4da3ff"/><text x="102.0" y="31.0" class="t" font-size="17" fill="#c4d3ee" textLength="677.0" lengthAdjust="spacingAndGlyphs">No account. No telemetry. The update check is on by default and you can turn it off with</text><text x="784.0" y="31.0" class="t" font-size="17" font-weight="700" fill="#ffd37a" textLength="132.0" lengthAdjust="spacingAndGlyphs">Keep X20CTL up</text><text x="102.0" y="58.0" class="t" font-size="17" font-weight="700" fill="#ffd37a" textLength="58.0" lengthAdjust="spacingAndGlyphs">to date</text><text x="165.0" y="58.0" class="t" font-size="17" fill="#c4d3ee" textLength="727.0" lengthAdjust="spacingAndGlyphs">in Tools. PC mode names its two drivers and asks before it installs them. Your setups, drafts and</text><text x="102.0" y="85.0" class="t" font-size="17" fill="#c4d3ee" textLength="277.0" lengthAdjust="spacingAndGlyphs">assignments stay in your user folder.</text><circle cx="86" cy="113" r="3.5" fill="#4da3ff"/><text x="102.0" y="119.0" class="t" font-size="17" fill="#c4d3ee" textLength="131.0" lengthAdjust="spacingAndGlyphs">Every change is a</text><text x="238.0" y="119.0" class="t" font-size="17" font-weight="700" fill="#ffd37a" textLength="83.0" lengthAdjust="spacingAndGlyphs">local draft</text><text x="326.0" y="119.0" class="t" font-size="17" fill="#c4d3ee" textLength="586.0" lengthAdjust="spacingAndGlyphs">until it can be sent to a connected, verified controller. X20CTL never writes to</text><text x="102.0" y="146.0" class="t" font-size="17" fill="#c4d3ee" textLength="243.0" lengthAdjust="spacingAndGlyphs">a controller it cannot read back.</text><circle cx="86" cy="174" r="3.5" fill="#4da3ff"/><text x="102.0" y="180.0" class="t" font-size="17" fill="#c4d3ee" textLength="549.0" lengthAdjust="spacingAndGlyphs">The game shelf reads only the Steam and Epic launchers&#x27; own local files.</text><circle cx="86" cy="208" r="3.5" fill="#4da3ff"/><text x="102.0" y="214.0" class="t" font-size="17" fill="#c4d3ee" textLength="495.0" lengthAdjust="spacingAndGlyphs">The only uploads are a Controller Check report when you choose</text><text x="602.0" y="214.0" class="t" font-size="17" font-weight="700" fill="#ffd37a" textLength="114.0" lengthAdjust="spacingAndGlyphs">Scan and send</text><text x="716.0" y="214.0" class="t" font-size="17" fill="#c4d3ee" textLength="190.0" lengthAdjust="spacingAndGlyphs">, and feedback when you</text><text x="102.0" y="241.0" class="t" font-size="17" fill="#c4d3ee" textLength="39.0" lengthAdjust="spacingAndGlyphs">press</text><text x="146.0" y="241.0" class="t" font-size="17" font-weight="700" fill="#ffd37a" textLength="128.0" lengthAdjust="spacingAndGlyphs">Send to X20CTL</text><text x="274.0" y="241.0" class="t" font-size="17" fill="#c4d3ee" textLength="37.0" lengthAdjust="spacingAndGlyphs">. The</text><text x="316.0" y="241.0" class="t" font-size="17" fill="#6fb0ff" textLength="102.0" lengthAdjust="spacingAndGlyphs">privacy policy</text><line x1="316.0" x2="418.0" y1="244.5" y2="244.5" stroke="#6fb0ff" stroke-opacity=".6"/><text x="423.0" y="241.0" class="t" font-size="17" fill="#c4d3ee" textLength="444.0" lengthAdjust="spacingAndGlyphs">lists exactly what each one contains. External links, such as</text><text x="102.0" y="268.0" class="t" font-size="17" fill="#c4d3ee" textLength="561.0" lengthAdjust="spacingAndGlyphs">Support and GitHub, open in your browser and only when you click them.</text><circle cx="86" cy="296" r="3.5" fill="#4da3ff"/><text x="102.0" y="302.0" class="t" font-size="17" fill="#c4d3ee" textLength="243.0" lengthAdjust="spacingAndGlyphs">X20CTL does not flash firmware.</text></svg>