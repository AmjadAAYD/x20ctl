<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 325" width="1000" height="325" role="img" aria-label="No account. No telemetry. The update check is on by default and you can turn it off with Keep X20CTL up to date in Tools. PC mode installs its two drivers only when you press Set up PC mode. Your setups, drafts and assignments stay in your user folder.; Every change is a local draft until it can be "><defs><radialGradient id="bg_1d4ed8"><stop offset="0" stop-color="#1d4ed8"/><stop offset=".55" stop-color="#1d4ed8" stop-opacity=".3"/><stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/></radialGradient><radialGradient id="bg_1e40af"><stop offset="0" stop-color="#1e40af"/><stop offset=".55" stop-color="#1e40af" stop-opacity=".3"/><stop offset="1" stop-color="#1e40af" stop-opacity="0"/></radialGradient><radialGradient id="bg_312e81"><stop offset="0" stop-color="#312e81"/><stop offset=".55" stop-color="#312e81" stop-opacity=".3"/><stop offset="1" stop-color="#312e81" stop-opacity="0"/></radialGradient><radialGradient id="bg_1e3a8a"><stop offset="0" stop-color="#1e3a8a"/><stop offset=".55" stop-color="#1e3a8a" stop-opacity=".3"/><stop offset="1" stop-color="#1e3a8a" stop-opacity="0"/></radialGradient><radialGradient id="bg_1d4ed8"><stop offset="0" stop-color="#1d4ed8"/><stop offset=".55" stop-color="#1d4ed8" stop-opacity=".3"/><stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/></radialGradient><pattern id="bg_grid" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="translate(0 -31)"><path d="M40 0H0V40" fill="none" stroke="#6ea0ff" stroke-opacity=".055"/></pattern><linearGradient id="bg_hbar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4da3ff"/><stop offset="1" stop-color="#4da3ff"/></linearGradient><clipPath id="bg_clip"><path d="M0 0 H1000 V325 H0 V0 Z"/></clipPath></defs><style>.bgA{animation:bgA 40s ease-in-out infinite alternate}.bgB{animation:bgB 52s ease-in-out infinite alternate}.bgC{animation:bgC 64s ease-in-out infinite alternate}@keyframes bgA{to{transform:translate(70px,30px)}}@keyframes bgB{to{transform:translate(-80px,40px)}}@keyframes bgC{to{transform:translate(50px,-50px)}}.bgP{stroke-dasharray:30 970;animation:bgP 9s linear infinite}@keyframes bgP{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}.bgR{animation:bgR 60s linear infinite}@keyframes bgR{to{transform:rotate(360deg)}}.bgRr{animation:bgR 90s linear infinite reverse}.bgF{animation:bgF 14s ease-in-out infinite alternate}@keyframes bgF{to{transform:translateY(-18px)}}.bgU{animation:bgU 26s linear infinite}@keyframes bgU{from{transform:translateY(0);opacity:0}10%{opacity:.8}90%{opacity:.8}to{transform:translateY(-360px);opacity:0}}.t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.mo{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><path d="M0 0 H1000 V325 H0 V0 Z" fill="#0a0f1c"/><g clip-path="url(#bg_clip)"><g class="bgC"><circle cx="920" cy="-81" r="480" fill="url(#bg_1d4ed8)" opacity="0.22"/></g><g class="bgA"><circle cx="80" cy="439" r="480" fill="url(#bg_1e40af)" opacity="0.22"/></g></g><defs><linearGradient id="fdl"><stop offset="0" stop-color="#0d1117" stop-opacity="0.95"/><stop offset="0.35" stop-color="#0d1117" stop-opacity="0.55"/><stop offset="0.7" stop-color="#0d1117" stop-opacity="0.18"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></linearGradient><linearGradient id="fdr" x1="1" x2="0"><stop offset="0" stop-color="#0d1117" stop-opacity="0.95"/><stop offset="0.35" stop-color="#0d1117" stop-opacity="0.55"/><stop offset="0.7" stop-color="#0d1117" stop-opacity="0.18"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></linearGradient></defs><rect width="46" height="325" fill="url(#fdl)"/><rect x="954" width="46" height="325" fill="url(#fdr)"/><circle cx="86" cy="25" r="3.5" fill="#4da3ff"/><text x="102.0" y="31.0" class="t" font-size="17" fill="#c4d3ee" textLength="677.0" lengthAdjust="spacingAndGlyphs">No account. No telemetry. The update check is on by default and you can turn it off with</text><text x="784.0" y="31.0" class="t" font-size="17" font-weight="700" fill="#ffd37a" textLength="132.0" lengthAdjust="spacingAndGlyphs">Keep X20CTL up</text><text x="102.0" y="58.0" class="t" font-size="17" font-weight="700" fill="#ffd37a" textLength="58.0" lengthAdjust="spacingAndGlyphs">to date</text><text x="165.0" y="58.0" class="t" font-size="17" fill="#c4d3ee" textLength="410.0" lengthAdjust="spacingAndGlyphs">in Tools. PC mode asks before it installs its two drivers.</text><text x="581.0" y="58.0" class="t" font-size="17" fill="#c4d3ee" textLength="136.0" lengthAdjust="spacingAndGlyphs">Your setups, drafts</text><text x="102.0" y="85.0" class="t" font-size="17" fill="#c4d3ee" textLength="311.0" lengthAdjust="spacingAndGlyphs">and assignments stay in your user folder.</text><circle cx="86" cy="113" r="3.5" fill="#4da3ff"/><text x="102.0" y="119.0" class="t" font-size="17" fill="#c4d3ee" textLength="131.0" lengthAdjust="spacingAndGlyphs">Every change is a</text><text x="238.0" y="119.0" class="t" font-size="17" font-weight="700" fill="#ffd37a" textLength="83.0" lengthAdjust="spacingAndGlyphs">local draft</text><text x="326.0" y="119.0" class="t" font-size="17" fill="#c4d3ee" textLength="586.0" lengthAdjust="spacingAndGlyphs">until it can be sent to a connected, verified controller. X20CTL never writes to</text><text x="102.0" y="146.0" class="t" font-size="17" fill="#c4d3ee" textLength="243.0" lengthAdjust="spacingAndGlyphs">a controller it cannot read back.</text><circle cx="86" cy="174" r="3.5" fill="#4da3ff"/><text x="102.0" y="180.0" class="t" font-size="17" fill="#c4d3ee" textLength="549.0" lengthAdjust="spacingAndGlyphs">The game shelf reads only the Steam and Epic launchers&#x27; own local files.</text><circle cx="86" cy="208" r="3.5" fill="#4da3ff"/><text x="102.0" y="214.0" class="t" font-size="17" fill="#c4d3ee" textLength="495.0" lengthAdjust="spacingAndGlyphs">The only uploads are a Controller Check report when you choose</text><text x="602.0" y="214.0" class="t" font-size="17" font-weight="700" fill="#ffd37a" textLength="114.0" lengthAdjust="spacingAndGlyphs">Scan and send</text><text x="716.0" y="214.0" class="t" font-size="17" fill="#c4d3ee" textLength="190.0" lengthAdjust="spacingAndGlyphs">, and feedback when you</text><text x="102.0" y="241.0" class="t" font-size="17" fill="#c4d3ee" textLength="39.0" lengthAdjust="spacingAndGlyphs">press</text><text x="146.0" y="241.0" class="t" font-size="17" font-weight="700" fill="#ffd37a" textLength="128.0" lengthAdjust="spacingAndGlyphs">Send to X20CTL</text><text x="274.0" y="241.0" class="t" font-size="17" fill="#c4d3ee" textLength="37.0" lengthAdjust="spacingAndGlyphs">. The</text><text x="316.0" y="241.0" class="t" font-size="17" fill="#6fb0ff" textLength="102.0" lengthAdjust="spacingAndGlyphs">privacy policy</text><line x1="316.0" x2="418.0" y1="244.5" y2="244.5" stroke="#6fb0ff" stroke-opacity=".6"/><text x="423.0" y="241.0" class="t" font-size="17" fill="#c4d3ee" textLength="444.0" lengthAdjust="spacingAndGlyphs">lists exactly what each one contains. External links, such as</text><text x="102.0" y="268.0" class="t" font-size="17" fill="#c4d3ee" textLength="561.0" lengthAdjust="spacingAndGlyphs">Support and GitHub, open in your browser and only when you click them.</text><circle cx="86" cy="296" r="3.5" fill="#4da3ff"/><text x="102.0" y="302.0" class="t" font-size="17" fill="#c4d3ee" textLength="243.0" lengthAdjust="spacingAndGlyphs">X20CTL does not flash firmware.</text></svg>