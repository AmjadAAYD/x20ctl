<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 325" width="1000" height="325" role="img" aria-label="No account. No telemetry. The update check is on by default and you can turn it off with Keep X20CTL up to date in Tools. PC mode installs its two drivers only when you press Set up PC mode. Your setups, drafts and assignments stay in your user folder.; Every change is a local draft until it can be "><defs><radialGradient id="bg_1d4ed8"><stop offset="0" stop-color="#1d4ed8"/><stop offset=".55" stop-color="#1d4ed8" stop-opacity=".3"/><stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/></radialGradient><radialGradient id="bg_0891b2"><stop offset="0" stop-color="#0891b2"/><stop offset=".55" stop-color="#0891b2" stop-opacity=".3"/><stop offset="1" stop-color="#0891b2" stop-opacity="0"/></radialGradient><radialGradient id="bg_4f46e5"><stop offset="0" stop-color="#4f46e5"/><stop offset=".55" stop-color="#4f46e5" stop-opacity=".3"/><stop offset="1" stop-color="#4f46e5" stop-opacity="0"/></radialGradient><radialGradient id="bg_0e7490"><stop offset="0" stop-color="#0e7490"/><stop offset=".55" stop-color="#0e7490" stop-opacity=".3"/><stop offset="1" stop-color="#0e7490" stop-opacity="0"/></radialGradient><radialGradient id="bg_6d28d9"><stop offset="0" stop-color="#6d28d9"/><stop offset=".55" stop-color="#6d28d9" stop-opacity=".3"/><stop offset="1" stop-color="#6d28d9" stop-opacity="0"/></radialGradient><pattern id="bg_grid" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="translate(0 -31)"><path d="M40 0H0V40" fill="none" stroke="#6ea0ff" stroke-opacity=".055"/></pattern><linearGradient id="bg_hbar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><clipPath id="bg_clip"><path d="M0 0 H1000 V325 H0 V0 Z"/></clipPath></defs><style>.bgA{animation:bgA 40s ease-in-out infinite alternate}.bgB{animation:bgB 52s ease-in-out infinite alternate}.bgC{animation:bgC 64s ease-in-out infinite alternate}@keyframes bgA{to{transform:translate(70px,30px)}}@keyframes bgB{to{transform:translate(-80px,40px)}}@keyframes bgC{to{transform:translate(50px,-50px)}}.bgP{stroke-dasharray:30 970;animation:bgP 9s linear infinite}@keyframes bgP{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}.bgR{animation:bgR 60s linear infinite}@keyframes bgR{to{transform:rotate(360deg)}}.bgRr{animation:bgR 90s linear infinite reverse}.bgF{animation:bgF 14s ease-in-out infinite alternate}@keyframes bgF{to{transform:translateY(-18px)}}.bgU{animation:bgU 26s linear infinite}@keyframes bgU{from{transform:translateY(0);opacity:0}10%{opacity:.8}90%{opacity:.8}to{transform:translateY(-360px);opacity:0}}.t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.mo{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><path d="M0 0 H1000 V325 H0 V0 Z" fill="#04070f"/><g clip-path="url(#bg_clip)"><g class="bgC"><circle cx="920" cy="-81" r="480" fill="url(#bg_1d4ed8)" opacity="0.5"/></g><g class="bgA"><circle cx="80" cy="439" r="480" fill="url(#bg_0891b2)" opacity="0.5"/></g><rect width="1000" height="325" fill="url(#bg_grid)"/><g transform="translate(0 -18431)"><path d="M-3 18381 H181 V18421 H501 V18461 H200 V18395 H393 V18435" fill="none" stroke="#2b4b86" stroke-opacity=".55" stroke-width="1.3" stroke-linejoin="round"/><path d="M-3 18381 H181 V18421 H501 V18461 H200 V18395 H393 V18435" pathLength="1000" fill="none" stroke="#4da3ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="bgP" style="animation-delay:-2.5s"/><circle cx="-3" cy="18381" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="181" cy="18421" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="501" cy="18461" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="200" cy="18395" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="393" cy="18435" r="2.6" fill="#3b6bc4" opacity=".7"/></g><g transform="translate(0 -18431)"><path d="M410 18488 H658 V18422 H242 V18356 H656 V18316" fill="none" stroke="#2b4b86" stroke-opacity=".55" stroke-width="1.3" stroke-linejoin="round"/><path d="M410 18488 H658 V18422 H242 V18356 H656 V18316" pathLength="1000" fill="none" stroke="#8b9cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="bgP" style="animation-delay:-2.1s"/><circle cx="410" cy="18488" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="658" cy="18422" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="242" cy="18356" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="656" cy="18316" r="2.6" fill="#3b6bc4" opacity=".7"/></g><g transform="translate(0 -18431)"><path d="M212 18617 H449 V18683 H751 V18643 H956 V18683" fill="none" stroke="#2b4b86" stroke-opacity=".55" stroke-width="1.3" stroke-linejoin="round"/><path d="M212 18617 H449 V18683 H751 V18643 H956 V18683" pathLength="1000" fill="none" stroke="#4da3ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="bgP" style="animation-delay:-8.0s"/><circle cx="212" cy="18617" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="449" cy="18683" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="751" cy="18643" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="956" cy="18683" r="2.6" fill="#3b6bc4" opacity=".7"/></g><g transform="translate(0 -18431)"><path d="M689 18763 H364 V18723 H775 V18657 H491 V18723 H841 V18657" fill="none" stroke="#2b4b86" stroke-opacity=".55" stroke-width="1.3" stroke-linejoin="round"/><path d="M689 18763 H364 V18723 H775 V18657 H491 V18723 H841 V18657" pathLength="1000" fill="none" stroke="#8b9cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="bgP" style="animation-delay:-8.7s"/><circle cx="689" cy="18763" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="364" cy="18723" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="775" cy="18657" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="491" cy="18723" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="841" cy="18657" r="2.6" fill="#3b6bc4" opacity=".7"/></g><g transform="translate(70 -111)" opacity=".5"><circle r="160" fill="none" stroke="#2f5dae" stroke-opacity=".6"/><circle r="106" fill="none" stroke="#2f5dae" stroke-opacity=".45" stroke-dasharray="3 7"/><circle r="53" fill="none" stroke="#2f5dae" stroke-opacity=".5"/><line x1="-160" x2="160" stroke="#2f5dae" stroke-opacity=".3"/><line y1="-160" y2="160" stroke="#2f5dae" stroke-opacity=".3"/><g class="bgR"><circle cx="160" r="4.5" fill="#22d3ee"/></g><g class="bgRr"><circle cx="106" r="3.5" fill="#4da3ff"/></g></g><circle cx="566" cy="426" r="1.9" fill="#9fc4ff" class="bgU" style="animation-duration:22s;animation-delay:-4s"/><circle cx="443" cy="263" r="1.7" fill="#9fc4ff" class="bgU" style="animation-duration:35s;animation-delay:-13s"/><circle cx="935" cy="208" r="1.7" fill="#9fc4ff" class="bgU" style="animation-duration:21s;animation-delay:-19s"/><circle cx="446" cy="112" r="1.8" fill="#9fc4ff" class="bgU" style="animation-duration:30s;animation-delay:-1s"/><circle cx="791" cy="505" r="0.9" fill="#9fc4ff" class="bgU" style="animation-duration:21s;animation-delay:-16s"/><circle cx="983" cy="578" r="1.8" fill="#9fc4ff" class="bgU" style="animation-duration:26s;animation-delay:-8s"/><circle cx="867" cy="490" r="1.0" fill="#9fc4ff" class="bgU" style="animation-duration:27s;animation-delay:-20s"/><circle cx="988" cy="206" r="0.9" fill="#9fc4ff" class="bgU" style="animation-duration:31s;animation-delay:-8s"/><circle cx="869" cy="133" r="1.3" fill="#9fc4ff" class="bgU" style="animation-duration:33s;animation-delay:-13s"/><circle cx="6" cy="673" r="1.6" fill="#9fc4ff" class="bgU" style="animation-duration:25s;animation-delay:-24s"/><circle cx="803" cy="491" r="1.7" fill="#9fc4ff" class="bgU" style="animation-duration:33s;animation-delay:-3s"/><circle cx="214" cy="104" r="1.4" fill="#9fc4ff" class="bgU" style="animation-duration:30s;animation-delay:-17s"/><circle cx="506" cy="155" r="1.3" fill="#9fc4ff" class="bgU" style="animation-duration:27s;animation-delay:-5s"/><circle cx="583" cy="304" r="1.7" fill="#9fc4ff" class="bgU" style="animation-duration:27s;animation-delay:-15s"/><circle cx="756" cy="568" r="1.3" fill="#9fc4ff" class="bgU" style="animation-duration:31s;animation-delay:-1s"/><circle cx="173" cy="535" r="0.8" fill="#9fc4ff" class="bgU" style="animation-duration:38s;animation-delay:-24s"/><circle cx="103" cy="542" r="1.7" fill="#9fc4ff" class="bgU" style="animation-duration:22s;animation-delay:-22s"/><circle cx="163" cy="679" r="0.8" fill="#9fc4ff" class="bgU" style="animation-duration:33s;animation-delay:-19s"/><circle cx="53" cy="134" r="1.8" fill="#9fc4ff" class="bgU" style="animation-duration:34s;animation-delay:-9s"/></g><defs><clipPath id="cc"><rect x="40" y="0" width="920" height="325"/></clipPath></defs><g clip-path="url(#cc)"><g transform="translate(40 -16)"><path d="M0 0 H920 V357 H0 V0 Z" fill="#060c1f" fill-opacity=".76" stroke="#1b2f57"/></g></g><circle cx="86" cy="25" r="3.5" fill="#4da3ff"/><text x="102.0" y="31.0" class="t" font-size="17" fill="#c4d3ee" textLength="677.0" lengthAdjust="spacingAndGlyphs">No account. No telemetry. The update check is on by default and you can turn it off with</text><text x="784.0" y="31.0" class="t" font-size="17" font-weight="700" fill="#ffd37a" textLength="132.0" lengthAdjust="spacingAndGlyphs">Keep X20CTL up</text><text x="102.0" y="58.0" class="t" font-size="17" font-weight="700" fill="#ffd37a" textLength="58.0" lengthAdjust="spacingAndGlyphs">to date</text><text x="165.0" y="58.0" class="t" font-size="17" fill="#c4d3ee" textLength="464.0" lengthAdjust="spacingAndGlyphs">in Tools. PC mode installs its two drivers only when you press</text><text x="634.0" y="58.0" class="t" font-size="17" font-weight="700" fill="#ffd37a" textLength="129.0" lengthAdjust="spacingAndGlyphs">Set up PC mode</text><text x="763.0" y="58.0" class="t" font-size="17" fill="#c4d3ee" textLength="150.0" lengthAdjust="spacingAndGlyphs">. Your setups, drafts</text><text x="102.0" y="85.0" class="t" font-size="17" fill="#c4d3ee" textLength="311.0" lengthAdjust="spacingAndGlyphs">and assignments stay in your user folder.</text><circle cx="86" cy="113" r="3.5" fill="#4da3ff"/><text x="102.0" y="119.0" class="t" font-size="17" fill="#c4d3ee" textLength="131.0" lengthAdjust="spacingAndGlyphs">Every change is a</text><text x="238.0" y="119.0" class="t" font-size="17" font-weight="700" fill="#ffd37a" textLength="83.0" lengthAdjust="spacingAndGlyphs">local draft</text><text x="326.0" y="119.0" class="t" font-size="17" fill="#c4d3ee" textLength="586.0" lengthAdjust="spacingAndGlyphs">until it can be sent to a connected, verified controller. X20CTL never writes to</text><text x="102.0" y="146.0" class="t" font-size="17" fill="#c4d3ee" textLength="243.0" lengthAdjust="spacingAndGlyphs">a controller it cannot read back.</text><circle cx="86" cy="174" r="3.5" fill="#4da3ff"/><text x="102.0" y="180.0" class="t" font-size="17" fill="#c4d3ee" textLength="549.0" lengthAdjust="spacingAndGlyphs">The game shelf reads only the Steam and Epic launchers&#x27; own local files.</text><circle cx="86" cy="208" r="3.5" fill="#4da3ff"/><text x="102.0" y="214.0" class="t" font-size="17" fill="#c4d3ee" textLength="495.0" lengthAdjust="spacingAndGlyphs">The only uploads are a Controller Check report when you choose</text><text x="602.0" y="214.0" class="t" font-size="17" font-weight="700" fill="#ffd37a" textLength="114.0" lengthAdjust="spacingAndGlyphs">Scan and send</text><text x="716.0" y="214.0" class="t" font-size="17" fill="#c4d3ee" textLength="190.0" lengthAdjust="spacingAndGlyphs">, and feedback when you</text><text x="102.0" y="241.0" class="t" font-size="17" fill="#c4d3ee" textLength="39.0" lengthAdjust="spacingAndGlyphs">press</text><text x="146.0" y="241.0" class="t" font-size="17" font-weight="700" fill="#ffd37a" textLength="128.0" lengthAdjust="spacingAndGlyphs">Send to X20CTL</text><text x="274.0" y="241.0" class="t" font-size="17" fill="#c4d3ee" textLength="37.0" lengthAdjust="spacingAndGlyphs">. The</text><text x="316.0" y="241.0" class="t" font-size="17" fill="#6fb0ff" textLength="102.0" lengthAdjust="spacingAndGlyphs">privacy policy</text><line x1="316.0" x2="418.0" y1="244.5" y2="244.5" stroke="#6fb0ff" stroke-opacity=".6"/><text x="423.0" y="241.0" class="t" font-size="17" fill="#c4d3ee" textLength="444.0" lengthAdjust="spacingAndGlyphs">lists exactly what each one contains. External links, such as</text><text x="102.0" y="268.0" class="t" font-size="17" fill="#c4d3ee" textLength="561.0" lengthAdjust="spacingAndGlyphs">Support and GitHub, open in your browser and only when you click them.</text><circle cx="86" cy="296" r="3.5" fill="#4da3ff"/><text x="102.0" y="302.0" class="t" font-size="17" fill="#c4d3ee" textLength="243.0" lengthAdjust="spacingAndGlyphs">X20CTL does not flash firmware.</text></svg>