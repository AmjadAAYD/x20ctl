<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 128" width="1000" height="128" role="img" aria-label="Code signing: releases are built on GitHub Actions straight from this repository, and X20CTL has applied for free code signing for open-source projects from the SignPath Foundation(https://signpath.or"><defs><radialGradient id="bg_1d4ed8"><stop offset="0" stop-color="#1d4ed8"/><stop offset=".55" stop-color="#1d4ed8" stop-opacity=".3"/><stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/></radialGradient><radialGradient id="bg_1e40af"><stop offset="0" stop-color="#1e40af"/><stop offset=".55" stop-color="#1e40af" stop-opacity=".3"/><stop offset="1" stop-color="#1e40af" stop-opacity="0"/></radialGradient><radialGradient id="bg_312e81"><stop offset="0" stop-color="#312e81"/><stop offset=".55" stop-color="#312e81" stop-opacity=".3"/><stop offset="1" stop-color="#312e81" stop-opacity="0"/></radialGradient><radialGradient id="bg_1e3a8a"><stop offset="0" stop-color="#1e3a8a"/><stop offset=".55" stop-color="#1e3a8a" stop-opacity=".3"/><stop offset="1" stop-color="#1e3a8a" stop-opacity="0"/></radialGradient><radialGradient id="bg_1d4ed8"><stop offset="0" stop-color="#1d4ed8"/><stop offset=".55" stop-color="#1d4ed8" stop-opacity=".3"/><stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/></radialGradient><pattern id="bg_grid" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="translate(0 -13)"><path d="M40 0H0V40" fill="none" stroke="#6ea0ff" stroke-opacity=".055"/></pattern><linearGradient id="bg_hbar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4da3ff"/><stop offset="1" stop-color="#4da3ff"/></linearGradient><clipPath id="bg_clip"><path d="M0 0 H1000 V128 H0 V0 Z"/></clipPath></defs><style>.bgA{animation:bgA 40s ease-in-out infinite alternate}.bgB{animation:bgB 52s ease-in-out infinite alternate}.bgC{animation:bgC 64s ease-in-out infinite alternate}@keyframes bgA{to{transform:translate(70px,30px)}}@keyframes bgB{to{transform:translate(-80px,40px)}}@keyframes bgC{to{transform:translate(50px,-50px)}}.bgP{stroke-dasharray:30 970;animation:bgP 9s linear infinite}@keyframes bgP{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}.bgR{animation:bgR 60s linear infinite}@keyframes bgR{to{transform:rotate(360deg)}}.bgRr{animation:bgR 90s linear infinite reverse}.bgF{animation:bgF 14s ease-in-out infinite alternate}@keyframes bgF{to{transform:translateY(-18px)}}.bgU{animation:bgU 26s linear infinite}@keyframes bgU{from{transform:translateY(0);opacity:0}10%{opacity:.8}90%{opacity:.8}to{transform:translateY(-360px);opacity:0}}.t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.mo{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><path d="M0 0 H1000 V128 H0 V0 Z" fill="#0a0f1c"/><g clip-path="url(#bg_clip)"><g class="bgB"><circle cx="80" cy="-103" r="480" fill="url(#bg_1d4ed8)" opacity="0.22"/></g><g class="bgC"><circle cx="920" cy="417" r="480" fill="url(#bg_1d4ed8)" opacity="0.22"/></g></g><defs><linearGradient id="fdl"><stop offset="0" stop-color="#0d1117" stop-opacity="0.95"/><stop offset="0.35" stop-color="#0d1117" stop-opacity="0.55"/><stop offset="0.7" stop-color="#0d1117" stop-opacity="0.18"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></linearGradient><linearGradient id="fdr" x1="1" x2="0"><stop offset="0" stop-color="#0d1117" stop-opacity="0.95"/><stop offset="0.35" stop-color="#0d1117" stop-opacity="0.55"/><stop offset="0.7" stop-color="#0d1117" stop-opacity="0.18"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></linearGradient></defs><rect width="46" height="128" fill="url(#fdl)"/><rect x="954" width="46" height="128" fill="url(#fdr)"/><text x="78.0" y="33.0" class="t" font-size="17" font-weight="700" fill="#ffffff" textLength="110.0" lengthAdjust="spacingAndGlyphs">Code signing:</text><text x="193.0" y="33.0" class="t" font-size="17" fill="#c4d3ee" textLength="707.0" lengthAdjust="spacingAndGlyphs">releases are built on GitHub Actions straight from this repository, and X20CTL has applied for</text><text x="78.0" y="60.0" class="t" font-size="17" fill="#c4d3ee" textLength="394.0" lengthAdjust="spacingAndGlyphs">free code signing for open-source projects from the</text><text x="477.0" y="60.0" class="t" font-size="17" fill="#6fb0ff" textLength="160.0" lengthAdjust="spacingAndGlyphs">SignPath Foundation</text><line x1="477.0" x2="637.0" y1="63.5" y2="63.5" stroke="#6fb0ff" stroke-opacity=".6"/><text x="637.0" y="60.0" class="t" font-size="17" fill="#c4d3ee" textLength="255.0" lengthAdjust="spacingAndGlyphs">. Until that is approved, the exe is</text><text x="78.0" y="87.0" class="t" font-size="17" font-weight="700" fill="#ffffff" textLength="73.0" lengthAdjust="spacingAndGlyphs">unsigned</text><text x="151.0" y="87.0" class="t" font-size="17" fill="#c4d3ee" textLength="637.0" lengthAdjust="spacingAndGlyphs">, so Windows SmartScreen may warn you. Check the download against the release&#x27;s</text><rect x="77.0" y="98.0" width="134.0" height="24" rx="5" fill="#141c30" stroke="#26334f"/><text x="81.0" y="114.0" class="mo" font-size="15.3" fill="#c9d8f2" textLength="126.0" lengthAdjust="spacingAndGlyphs">SHA256SUMS.txt</text><text x="210.0" y="114.0" class="t" font-size="17" fill="#c4d3ee" textLength="295.0" lengthAdjust="spacingAndGlyphs">. Never turn off your antivirus to run it.</text></svg>