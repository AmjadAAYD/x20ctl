<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 128" width="1000" height="128" role="img" aria-label="Code signing: releases are built on GitHub Actions straight from this repository, and X20CTL has applied for free code signing for open-source projects from the SignPath Foundation(https://signpath.or"><defs><radialGradient id="bg_1d4ed8"><stop offset="0" stop-color="#1d4ed8"/><stop offset=".55" stop-color="#1d4ed8" stop-opacity=".3"/><stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/></radialGradient><radialGradient id="bg_0891b2"><stop offset="0" stop-color="#0891b2"/><stop offset=".55" stop-color="#0891b2" stop-opacity=".3"/><stop offset="1" stop-color="#0891b2" stop-opacity="0"/></radialGradient><radialGradient id="bg_4f46e5"><stop offset="0" stop-color="#4f46e5"/><stop offset=".55" stop-color="#4f46e5" stop-opacity=".3"/><stop offset="1" stop-color="#4f46e5" stop-opacity="0"/></radialGradient><radialGradient id="bg_0e7490"><stop offset="0" stop-color="#0e7490"/><stop offset=".55" stop-color="#0e7490" stop-opacity=".3"/><stop offset="1" stop-color="#0e7490" stop-opacity="0"/></radialGradient><radialGradient id="bg_6d28d9"><stop offset="0" stop-color="#6d28d9"/><stop offset=".55" stop-color="#6d28d9" stop-opacity=".3"/><stop offset="1" stop-color="#6d28d9" stop-opacity="0"/></radialGradient><pattern id="bg_grid" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="translate(0 -13)"><path d="M40 0H0V40" fill="none" stroke="#6ea0ff" stroke-opacity=".055"/></pattern><linearGradient id="bg_hbar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><clipPath id="bg_clip"><path d="M0 0 H1000 V128 H0 V0 Z"/></clipPath></defs><style>.bgA{animation:bgA 40s ease-in-out infinite alternate}.bgB{animation:bgB 52s ease-in-out infinite alternate}.bgC{animation:bgC 64s ease-in-out infinite alternate}@keyframes bgA{to{transform:translate(70px,30px)}}@keyframes bgB{to{transform:translate(-80px,40px)}}@keyframes bgC{to{transform:translate(50px,-50px)}}.bgP{stroke-dasharray:30 970;animation:bgP 9s linear infinite}@keyframes bgP{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}.bgR{animation:bgR 60s linear infinite}@keyframes bgR{to{transform:rotate(360deg)}}.bgRr{animation:bgR 90s linear infinite reverse}.bgF{animation:bgF 14s ease-in-out infinite alternate}@keyframes bgF{to{transform:translateY(-18px)}}.bgU{animation:bgU 26s linear infinite}@keyframes bgU{from{transform:translateY(0);opacity:0}10%{opacity:.8}90%{opacity:.8}to{transform:translateY(-360px);opacity:0}}.t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.mo{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><path d="M0 0 H1000 V128 H0 V0 Z" fill="#04070f"/><g clip-path="url(#bg_clip)"><g class="bgB"><circle cx="80" cy="-103" r="480" fill="url(#bg_6d28d9)" opacity="0.5"/></g><g class="bgC"><circle cx="920" cy="417" r="480" fill="url(#bg_1d4ed8)" opacity="0.5"/></g><rect width="1000" height="128" fill="url(#bg_grid)"/><g transform="translate(0 -17933)"><path d="M175 17995 H540 V18035 H691 V18075 H520 V18115" fill="none" stroke="#2b4b86" stroke-opacity=".55" stroke-width="1.3" stroke-linejoin="round"/><path d="M175 17995 H540 V18035 H691 V18075 H520 V18115" pathLength="1000" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="bgP" style="animation-delay:-5.5s"/><circle cx="175" cy="17995" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="540" cy="18035" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="691" cy="18075" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="520" cy="18115" r="2.6" fill="#3b6bc4" opacity=".7"/></g><g transform="translate(0 -17933)"><path d="M531 18106 H327 V18146 H654 V18106 H342 V18066" fill="none" stroke="#2b4b86" stroke-opacity=".55" stroke-width="1.3" stroke-linejoin="round"/><path d="M531 18106 H327 V18146 H654 V18106 H342 V18066" pathLength="1000" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="bgP" style="animation-delay:-4.2s"/><circle cx="531" cy="18106" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="327" cy="18146" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="654" cy="18106" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="342" cy="18066" r="2.6" fill="#3b6bc4" opacity=".7"/></g><circle cx="103" cy="233" r="1.9" fill="#9fc4ff" class="bgU" style="animation-duration:36s;animation-delay:-5s"/><circle cx="991" cy="162" r="1.4" fill="#9fc4ff" class="bgU" style="animation-duration:24s;animation-delay:-26s"/><circle cx="721" cy="189" r="2.0" fill="#9fc4ff" class="bgU" style="animation-duration:34s;animation-delay:-5s"/><circle cx="996" cy="281" r="1.6" fill="#9fc4ff" class="bgU" style="animation-duration:21s;animation-delay:-3s"/><circle cx="171" cy="32" r="1.1" fill="#9fc4ff" class="bgU" style="animation-duration:21s;animation-delay:-24s"/><circle cx="907" cy="460" r="1.2" fill="#9fc4ff" class="bgU" style="animation-duration:38s;animation-delay:-20s"/><circle cx="981" cy="93" r="1.3" fill="#9fc4ff" class="bgU" style="animation-duration:36s;animation-delay:-21s"/><circle cx="91" cy="435" r="1.9" fill="#9fc4ff" class="bgU" style="animation-duration:21s;animation-delay:-2s"/><circle cx="852" cy="446" r="1.1" fill="#9fc4ff" class="bgU" style="animation-duration:39s;animation-delay:-22s"/><circle cx="142" cy="387" r="1.4" fill="#9fc4ff" class="bgU" style="animation-duration:26s;animation-delay:-14s"/><circle cx="70" cy="353" r="1.5" fill="#9fc4ff" class="bgU" style="animation-duration:21s;animation-delay:-10s"/><circle cx="868" cy="51" r="1.3" fill="#9fc4ff" class="bgU" style="animation-duration:35s;animation-delay:-16s"/><circle cx="707" cy="13" r="1.3" fill="#9fc4ff" class="bgU" style="animation-duration:31s;animation-delay:-7s"/></g><defs><clipPath id="cc"><rect x="40" y="0" width="920" height="128"/></clipPath></defs><g clip-path="url(#cc)"><g transform="translate(40 -16)"><path d="M0 0 H920 V160 H0 V0 Z" fill="#060c1f" fill-opacity=".76" stroke="#1b2f57"/></g></g><text x="78.0" y="33.0" class="t" font-size="17" font-weight="700" fill="#ffd37a" textLength="110.0" lengthAdjust="spacingAndGlyphs">Code signing:</text><text x="193.0" y="33.0" class="t" font-size="17" fill="#c4d3ee" textLength="707.0" lengthAdjust="spacingAndGlyphs">releases are built on GitHub Actions straight from this repository, and X20CTL has applied for</text><text x="78.0" y="60.0" class="t" font-size="17" fill="#c4d3ee" textLength="394.0" lengthAdjust="spacingAndGlyphs">free code signing for open-source projects from the</text><text x="477.0" y="60.0" class="t" font-size="17" fill="#6fb0ff" textLength="160.0" lengthAdjust="spacingAndGlyphs">SignPath Foundation</text><line x1="477.0" x2="637.0" y1="63.5" y2="63.5" stroke="#6fb0ff" stroke-opacity=".6"/><text x="637.0" y="60.0" class="t" font-size="17" fill="#c4d3ee" textLength="255.0" lengthAdjust="spacingAndGlyphs">. Until that is approved, the exe is</text><text x="78.0" y="87.0" class="t" font-size="17" font-weight="700" fill="#ffd37a" textLength="73.0" lengthAdjust="spacingAndGlyphs">unsigned</text><text x="151.0" y="87.0" class="t" font-size="17" fill="#c4d3ee" textLength="637.0" lengthAdjust="spacingAndGlyphs">, so Windows SmartScreen may warn you. Check the download against the release&#x27;s</text><rect x="77.0" y="98.0" width="134.0" height="24" rx="5" fill="#1a1440" stroke="#4b3c9a"/><text x="81.0" y="114.0" class="mo" font-size="15.3" fill="#d2c4ff" textLength="126.0" lengthAdjust="spacingAndGlyphs">SHA256SUMS.txt</text><text x="210.0" y="114.0" class="t" font-size="17" fill="#c4d3ee" textLength="295.0" lengthAdjust="spacingAndGlyphs">. Never turn off your antivirus to run it.</text></svg>