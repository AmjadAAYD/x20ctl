<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 508" width="1000" height="508" role="img" aria-label="Back paddles and macros. EasySMX paddles don&#x27;t have a button of their own: each one sends an ordinary button. So in PC mode, each macro slot is played by a real button you pick in the Macros tab, and that button plays the macro instead of its usual job.; Up to four controllers at once, each with its"><defs><radialGradient id="bg_1d4ed8"><stop offset="0" stop-color="#1d4ed8"/><stop offset=".55" stop-color="#1d4ed8" stop-opacity=".3"/><stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/></radialGradient><radialGradient id="bg_1e40af"><stop offset="0" stop-color="#1e40af"/><stop offset=".55" stop-color="#1e40af" stop-opacity=".3"/><stop offset="1" stop-color="#1e40af" stop-opacity="0"/></radialGradient><radialGradient id="bg_312e81"><stop offset="0" stop-color="#312e81"/><stop offset=".55" stop-color="#312e81" stop-opacity=".3"/><stop offset="1" stop-color="#312e81" stop-opacity="0"/></radialGradient><radialGradient id="bg_1e3a8a"><stop offset="0" stop-color="#1e3a8a"/><stop offset=".55" stop-color="#1e3a8a" stop-opacity=".3"/><stop offset="1" stop-color="#1e3a8a" stop-opacity="0"/></radialGradient><radialGradient id="bg_1d4ed8"><stop offset="0" stop-color="#1d4ed8"/><stop offset=".55" stop-color="#1d4ed8" stop-opacity=".3"/><stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/></radialGradient><pattern id="bg_grid" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="translate(0 -35)"><path d="M40 0H0V40" fill="none" stroke="#6ea0ff" stroke-opacity=".055"/></pattern><linearGradient id="bg_hbar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4da3ff"/><stop offset="1" stop-color="#4da3ff"/></linearGradient><clipPath id="bg_clip"><path d="M0 0 H1000 V508 H0 V0 Z"/></clipPath></defs><style>.bgA{animation:bgA 40s ease-in-out infinite alternate}.bgB{animation:bgB 52s ease-in-out infinite alternate}.bgC{animation:bgC 64s ease-in-out infinite alternate}@keyframes bgA{to{transform:translate(70px,30px)}}@keyframes bgB{to{transform:translate(-80px,40px)}}@keyframes bgC{to{transform:translate(50px,-50px)}}.bgP{stroke-dasharray:30 970;animation:bgP 9s linear infinite}@keyframes bgP{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}.bgR{animation:bgR 60s linear infinite}@keyframes bgR{to{transform:rotate(360deg)}}.bgRr{animation:bgR 90s linear infinite reverse}.bgF{animation:bgF 14s ease-in-out infinite alternate}@keyframes bgF{to{transform:translateY(-18px)}}.bgU{animation:bgU 26s linear infinite}@keyframes bgU{from{transform:translateY(0);opacity:0}10%{opacity:.8}90%{opacity:.8}to{transform:translateY(-360px);opacity:0}}.t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.mo{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><path d="M0 0 H1000 V508 H0 V0 Z" fill="#0a0f1c"/><g clip-path="url(#bg_clip)"><g class="bgC"><circle cx="920" cy="-445" r="480" fill="url(#bg_312e81)" opacity="0.22"/></g><g class="bgA"><circle cx="80" cy="75" r="480" fill="url(#bg_1e3a8a)" opacity="0.22"/></g><g class="bgB"><circle cx="920" cy="595" r="480" fill="url(#bg_1d4ed8)" opacity="0.22"/></g></g><defs><linearGradient id="fdl"><stop offset="0" stop-color="#0d1117" stop-opacity="0.95"/><stop offset="0.35" stop-color="#0d1117" stop-opacity="0.55"/><stop offset="0.7" stop-color="#0d1117" stop-opacity="0.18"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></linearGradient><linearGradient id="fdr" x1="1" x2="0"><stop offset="0" stop-color="#0d1117" stop-opacity="0.95"/><stop offset="0.35" stop-color="#0d1117" stop-opacity="0.55"/><stop offset="0.7" stop-color="#0d1117" stop-opacity="0.18"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></linearGradient></defs><rect width="46" height="508" fill="url(#fdl)"/><rect x="954" width="46" height="508" fill="url(#fdr)"/><circle cx="86" cy="25" r="3.5" fill="#4da3ff"/><text x="102.0" y="31.0" class="t" font-size="17" font-weight="700" fill="#ffd37a" textLength="208.0" lengthAdjust="spacingAndGlyphs">Back paddles and macros.</text><text x="315.0" y="31.0" class="t" font-size="17" fill="#c4d3ee" textLength="604.0" lengthAdjust="spacingAndGlyphs">EasySMX paddles don&#x27;t have a button of their own: each one sends an ordinary</text><text x="102.0" y="58.0" class="t" font-size="17" fill="#c4d3ee" textLength="783.0" lengthAdjust="spacingAndGlyphs">button. So in PC mode, each macro slot is played by a real button you pick in the Macros tab, and that</text><text x="102.0" y="85.0" class="t" font-size="17" fill="#c4d3ee" textLength="358.0" lengthAdjust="spacingAndGlyphs">button plays the macro instead of its usual job.</text><circle cx="86" cy="113" r="3.5" fill="#4da3ff"/><text x="102.0" y="119.0" class="t" font-size="17" font-weight="700" fill="#ffd37a" textLength="455.0" lengthAdjust="spacingAndGlyphs">Up to four controllers at once, each with its own settings</text><text x="562.0" y="119.0" class="t" font-size="17" fill="#c4d3ee" textLength="359.0" lengthAdjust="spacingAndGlyphs">and its own virtual Xbox controller, in the same</text><text x="102.0" y="146.0" class="t" font-size="17" fill="#c4d3ee" textLength="45.0" lengthAdjust="spacingAndGlyphs">order.</text><circle cx="86" cy="174" r="3.5" fill="#4da3ff"/><text x="102.0" y="180.0" class="t" font-size="17" font-weight="700" fill="#ffd37a" textLength="153.0" lengthAdjust="spacingAndGlyphs">Settings per game.</text><text x="260.0" y="180.0" class="t" font-size="17" fill="#c4d3ee" textLength="645.0" lengthAdjust="spacingAndGlyphs">Give a running game its own settings; X20CTL switches to them while that game is in</text><text x="102.0" y="207.0" class="t" font-size="17" fill="#c4d3ee" textLength="136.0" lengthAdjust="spacingAndGlyphs">front, and back to</text><text x="243.0" y="207.0" class="t" font-size="17" font-style="italic" fill="#b9a8ff" textLength="84.0" lengthAdjust="spacingAndGlyphs">Every game</text><text x="332.0" y="207.0" class="t" font-size="17" fill="#c4d3ee" textLength="77.0" lengthAdjust="spacingAndGlyphs">otherwise.</text><circle cx="86" cy="235" r="3.5" fill="#4da3ff"/><text x="102.0" y="241.0" class="t" font-size="17" font-weight="700" fill="#ffd37a" textLength="253.0" lengthAdjust="spacingAndGlyphs">Hold View + Menu for a second</text><text x="360.0" y="241.0" class="t" font-size="17" fill="#c4d3ee" textLength="552.0" lengthAdjust="spacingAndGlyphs">to switch your settings off mid-game, and again to switch them back on.</text><circle cx="86" cy="269" r="3.5" fill="#4da3ff"/><text x="102.0" y="275.0" class="t" font-size="17" font-weight="700" fill="#ffd37a" textLength="113.0" lengthAdjust="spacingAndGlyphs">Share settings</text><text x="220.0" y="275.0" class="t" font-size="17" fill="#c4d3ee" textLength="692.0" lengthAdjust="spacingAndGlyphs">as a file or as a short code to paste in a chat. Only the settings go in, never anything about</text><text x="102.0" y="302.0" class="t" font-size="17" fill="#c4d3ee" textLength="118.0" lengthAdjust="spacingAndGlyphs">you or your PC.</text><circle cx="86" cy="330" r="3.5" fill="#4da3ff"/><text x="102.0" y="336.0" class="t" font-size="17" fill="#c4d3ee" textLength="776.0" lengthAdjust="spacingAndGlyphs">It&#x27;s on by default but does nothing until you change a setting, and it only works while X20CTL is open.</text><circle cx="86" cy="364" r="3.5" fill="#4da3ff"/><text x="102.0" y="370.0" class="t" font-size="17" fill="#c4d3ee" textLength="402.0" lengthAdjust="spacingAndGlyphs">The first time, it installs two small drivers by Nefarius:</text><text x="509.0" y="370.0" class="t" font-size="17" fill="#6fb0ff" textLength="78.0" lengthAdjust="spacingAndGlyphs">ViGEmBus</text><line x1="509.0" x2="587.0" y1="373.5" y2="373.5" stroke="#6fb0ff" stroke-opacity=".6"/><text x="592.0" y="370.0" class="t" font-size="17" fill="#c4d3ee" textLength="199.0" lengthAdjust="spacingAndGlyphs">(the virtual controller) and</text><text x="796.0" y="370.0" class="t" font-size="17" fill="#6fb0ff" textLength="61.0" lengthAdjust="spacingAndGlyphs">HidHide</text><line x1="796.0" x2="857.0" y1="373.5" y2="373.5" stroke="#6fb0ff" stroke-opacity=".6"/><text x="862.0" y="370.0" class="t" font-size="17" fill="#c4d3ee" textLength="45.0" lengthAdjust="spacingAndGlyphs">(hides</text><text x="102.0" y="397.0" class="t" font-size="17" fill="#c4d3ee" textLength="801.0" lengthAdjust="spacingAndGlyphs">the real one). Their official installers are inside the exe, checked against pinned hashes. Remove them any</text><text x="102.0" y="424.0" class="t" font-size="17" fill="#c4d3ee" textLength="282.0" lengthAdjust="spacingAndGlyphs">time from Windows Settings → Apps.</text><circle cx="86" cy="452" r="3.5" fill="#4da3ff"/><text x="102.0" y="458.0" class="t" font-size="17" font-weight="700" fill="#ffd37a" textLength="444.0" lengthAdjust="spacingAndGlyphs">Turbo and macros can get you banned in online games.</text><text x="551.0" y="458.0" class="t" font-size="17" fill="#c4d3ee" textLength="351.0" lengthAdjust="spacingAndGlyphs">You are responsible for the rules of the games</text><text x="102.0" y="485.0" class="t" font-size="17" fill="#c4d3ee" textLength="68.0" lengthAdjust="spacingAndGlyphs">you play.</text></svg>