rm:translate(50px,-50px)}}.bgP{stroke-dasharray:30 970;animation:bgP 9s linear infinite}@keyframes bgP{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}.bgR{animation:bgR 60s linear infinite}@keyframes bgR{to{transform:rotate(360deg)}}.bgRr{animation:bgR 90s linear infinite reverse}.bgF{animation:bgF 14s ease-in-out infinite alternate}@keyframes bgF{to{transform:translateY(-18px)}}.bgU{animation:bgU 26s linear infinite}@keyframes bgU{from{transform:translateY(0);opacity:0}10%{opacity:.8}90%{opacity:.8}to{transform:translateY(-360px);opacity:0}}.t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.mo{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><path d="M0 0 H1000 V508 H0 V0 Z" fill="#04070f"/><g clip-path="url(#bg_clip)"><g class="bgC"><circle cx="920" cy="-445" r="480" fill="url(#bg_4f46e5)" opacity="0.5"/></g><g class="bgA"><circle cx="80" cy="75" r="480" fill="url(#bg_0e7490)" opacity="0.5"/></g><g class="bgB"><circle cx="920" cy="595" r="480" fill="url(#bg_6d28d9)" opacity="0.5"/></g><rect width="1000" height="508" fill="url(#bg_grid)"/><g transform="translate(0 -9435)"><path d="M600 9377 H220 V9443 H528 V9509 H272 V9443 H483 V9403" fill="none" stroke="#2b4b86" stroke-opacity=".55" stroke-width="1.3" stroke-linejoin="round"/><path d="M600 9377 H220 V9443 H528 V9509 H272 V9443 H483 V9403" pathLength="1000" fill="none" stroke="#4da3ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="bgP" style="animation-delay:-4.9s"/><circle cx="600" cy="9377" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="220" cy="9443" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="528" cy="9509" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="272" cy="9443" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="483" cy="9403" r="2.6" fill="#3b6bc4" opacity=".7"/></g><g transform="translate(0 -9435)"><path d="M125 9523 H536 V9589 H927 V9549 H743 V9615 H1135 V9575" fill="none" stroke="#2b4b86" stroke-opacity=".55" stroke-width="1.3" stroke-linejoin="round"/><path d="M125 9523 H536 V9589 H927 V9549 H743 V9615 H1135 V9575" pathLength="1000" fill="none" stroke="#4da3ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="bgP" style="animation-delay:-2.1s"/><circle cx="125" cy="9523" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="536" cy="9589" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="927" cy="9549" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="743" cy="9615" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="1135" cy="9575" r="2.6" fill="#3b6bc4" opacity=".7"/></g><g transform="translate(0 -9435)"><path d="M-61 9640 H105 V9680 H448 V9640 H644 V9706" fill="none" stroke="#2b4b86" stroke-opacity=".55" stroke-width="1.3" stroke-linejoin="round"/><path d="M-61 9640 H105 V9680 H448 V9640 H644 V9706" pathLength="1000" fill="none" stroke="#4da3ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="bgP" style="animation-delay:-2.5s"/><circle cx="-61" cy="9640" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="105" cy="9680" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="448" cy="9640" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="644" cy="9706" r="2.6" fill="#3b6bc4" opacity=".7"/></g><g transform="translate(0 -9435)"><path d="M516 9818 H358 V9778 H746 V9844 H390 V9884 H774 V9924" fill="none" stroke="#2b4b86" stroke-opacity=".55" stroke-width="1.3" stroke-linejoin="round"/><path d="M516 9818 H358 V9778 H746 V9844 H390 V9884 H774 V9924" pathLength="1000" fill="none" stroke="#8b9cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="bgP" style="animation-delay:-0.2s"/><circle cx="516" cy="9818" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="358" cy="9778" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="746" cy="9844" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="390" cy="9884" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="774" cy="9924" r="2.6" fill="#3b6bc4" opacity=".7"/></g><g transform="translate(0 -9435)"><path d="M50 9892 H388 V9932 H765 V9866 H487 V9800 H761 V9840" fill="none" stroke="#2b4b86" stroke-opacity=".55" stroke-width="1.3" stroke-linejoin="round"/><path d="M50 9892 H388 V9932 H765 V9866 H487 V9800 H761 V9840" pathLength="1000" fill="none" stroke="#8b9cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="bgP" style="animation-delay:-2.8s"/><circle cx="50" cy="9892" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="388" cy="9932" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="765" cy="9866" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="487" cy="9800" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="761" cy="9840" r="2.6" fill="#3b6bc4" opacity=".7"/></g><g transform="translate(70 -115)" opacity=".5"><circle r="140" fill="none" stroke="#2f5dae" stroke-opacity=".6"/><circle r="92" fill="none" stroke="#2f5dae" stroke-opacity=".45" stroke-dasharray="3 7"/><circle r="46" fill="none" stroke="#2f5dae" stroke-opacity=".5"/><line x1="-140" x2="140" stroke="#2f5dae" stroke-opacity=".3"/><line y1="-140" y2="140" stroke="#2f5dae" stroke-opacity=".3"/><g class="bgR"><circle cx="140" r="4.5" fill="#22d3ee"/></g><g class="bgRr"><circle cx="92" r="3.5" fill="#4da3ff"/></g></g><circle cx="232" cy="637" r="1.1" fill="#9fc4ff" class="bgU" style="animation-duration:23s;animation-delay:-13s"/><circle cx="934" cy="617" r="1.9" fill="#9fc4ff" class="bgU" style="animation-duration:29s;animation-delay:-4s"/><circle cx="533" cy="263" r="1.8" fill="#9fc4ff" class="bgU" style="animation-duration:32s;animation-delay:-18s"/><circle cx="521" cy="255" r="1.2" fill="#9fc4ff" class="bgU" style="animation-duration:24s;animation-delay:-4s"/><circle cx="129" cy="512" r="1.7" fill="#9fc4ff" class="bgU" style="animation-duration:25s;animation-delay:-26s"/><circle cx="126" cy="83" r="1.1" fill="#9fc4ff" class="bgU" style="animation-duration:38s;animation-delay:-14s"/><circle cx="615" cy="50" r="2.0" fill="#9fc4ff" class="bgU" style="animation-duration:38s;animation-delay:-25s"/><circle cx="32" cy="189" r="1.4" fill="#9fc4ff" class="bgU" style="animation-duration:25s;animation-delay:-3s"/><circle cx="94" cy="868" r="1.5" fill="#9fc4ff" class="bgU" style="animation-duration:34s;animation-delay:-20s"/><circle cx="322" cy="801" r="1.1" fill="#9fc4ff" class="bgU" style="animation-duration:38s;animation-delay:-21s"/><circle cx="269" cy="459" r="1.5" fill="#9fc4ff" class="bgU" style="animation-duration:24s;animation-delay:-17s"/><circle cx="81" cy="262" r="1.4" fill="#9fc4ff" class="bgU" style="animation-duration:33s;animation-delay:-22s"/><circle cx="532" cy="787" r="1.0" fill="#9fc4ff" class="bgU" style="animation-duration:31s;animation-delay:-7s"/><circle cx="708" cy="251" r="2.0" fill="#9fc4ff" class="bgU" style="animation-duration:38s;animation-delay:-14s"/><circle cx="440" cy="550" r="0.9" fill="#9fc4ff" class="bgU" style="animation-duration:26s;animation-delay:-20s"/><circle cx="985" cy="291" r="0.8" fill="#9fc4ff" class="bgU" style="animation-duration:21s;animation-delay:-8s"/><circle cx="484" cy="105" r="1.2" fill="#9fc4ff" class="bgU" style="animation-duration:24s;animation-delay:-20s"/><circle cx="283" cy="792" r="1.1" fill="#9fc4ff" class="bgU" style="animation-duration:23s;animation-delay:-16s"/></g><defs><clipPath id="cc"><rect x="40" y="0" width="920" height="508"/></clipPath></defs><g clip-path="url(#cc)"><g transform="translate(40 0)"><path d="M16 0 H904 A16 16 0 0 1 920 16 V524 H0 V16 A16 16 0 0 1 16 0 Z" fill="#060c1f" fill-opacity=".76" stroke="#1b2f57"/></g></g><circle cx="86" cy="25" r="3.5" fill="#4da3ff"/><text x="102.0" y="31.0" class="t" font-size="17" font-weight="700" fill="#ffffff" textLength="208.0" lengthAdjust="spacingAndGlyphs">Back paddles and macros.</text><text x="315.0" y="31.0" class="t" font-size="17" fill="#c4d3ee" textLength="604.0" lengthAdjust="spacingAndGlyphs">EasySMX paddles don&#x27;t have a button of their own: each one sends an ordinary</text><text x="102.0" y="58.0" class="t" font-size="17" fill="#c4d3ee" textLength="783.0" lengthAdjust="spacingAndGlyphs">button. So in PC mode, each macro slot is played by a real button you pick in the Macros tab, and that</text><text x="102.0" y="85.0" class="t" font-size="17" fill="#c4d3ee" textLength="358.0" lengthAdjust="spacingAndGlyphs">button plays the macro instead of its usual job.</text><circle cx="86" cy="113" r="3.5" fill="#4da3ff"/><text x="102.0" y="119.0" class="t" font-size="17" font-weight="700" fill="#ffffff" textLength="455.0" lengthAdjust="spacingAndGlyphs">Up to four controllers at once, each with its own settings</text><text x="562.0" y="119.0" class="t" font-size="17" fill="#c4d3ee" textLength="359.0" lengthAdjust="spacingAndGlyphs">and its own virtual Xbox controller, in the same</text><text x="102.0" y="146.0" class="t" font-size="17" fill="#c4d3ee" textLength="45.0" lengthAdjust="spacingAndGlyphs">order.</text><circle cx="86" cy="174" r="3.5" fill="#4da3ff"/><text x="102.0" y="180.0" class="t" font-size="17" font-weight="700" fill="#ffffff" textLength="153.0" lengthAdjust="spacingAndGlyphs">Settings per game.</text><text x="260.0" y="180.0" class="t" font-size="17" fill="#c4d3ee" textLength="645.0" lengthAdjust="spacingAndGlyphs">Give a running game its own settings; X20CTL switches to them while that game is in</text><text x="102.0" y="207.0" class="t" font-size="17" fill="#c4d3ee" textLength="136.0" lengthAdjust="spacingAndGlyphs">front, and back to</text><text x="243.0" y="207.0" class="t" font-size="17" font-style="italic" fill="#c4d3ee" textLength="84.0" lengthAdjust="spacingAndGlyphs">Every game</text><text x="332.0" y="207.0" class="t" font-size="17" fill="#c4d3ee" textLength="77.0" lengthAdjust="spacingAndGlyphs">otherwise.</text><circle cx="86" cy="235" r="3.5" fill="#4da3ff"/><text x="102.0" y="241.0" class="t" font-size="17" font-weight="700" fill="#ffffff" textLength="253.0" lengthAdjust="spacingAndGlyphs">Hold View + Menu for a second</text><text x="360.0" y="241.0" class="t" font-size="17" fill="#c4d3ee" textLength="552.0" lengthAdjust="spacingAndGlyphs">to switch your settings off mid-game, and again to switch them back on.</text><circle cx="86" cy="269" r="3.5" fill="#4da3ff"/><text x="102.0" y="275.0" class="t" font-size="17" font-weight="700" fill="#ffffff" textLength="113.0" lengthAdjust="spacingAndGlyphs">Share settings</text><text x="220.0" y="275.0" class="t" font-size="17" fill="#c4d3ee" textLength="692.0" lengthAdjust="spacingAndGlyphs">as a file or as a short code to paste in a chat. Only the settings go in, never anything about</text><text x="102.0" y="302.0" class="t" font-size="17" fill="#c4d3ee" textLength="118.0" lengthAdjust="spacingAndGlyphs">you or your PC.</text><circle cx="86" cy="330" r="3.5" fill="#4da3ff"/><text x="102.0" y="336.0" class="t" font-size="17" fill="#c4d3ee" textLength="776.0" lengthAdjust="spacingAndGlyphs">It&#x27;s on by default but does nothing until you change a setting, and it only works while X20CTL is open.</text><circle cx="86" cy="364" r="3.5" fill="#4da3ff"/><text x="102.0" y="370.0" class="t" font-size="17" fill="#c4d3ee" textLength="402.0" lengthAdjust="spacingAndGlyphs">The first time, it installs two small drivers by Nefarius:</text><text x="509.0" y="370.0" class="t" font-size="17" fill="#6fb0ff" textLength="78.0" lengthAdjust="spacingAndGlyphs">ViGEmBus</text><line x1="509.0" x2="587.0" y1="373.5" y2="373.5" stroke="#6fb0ff" stroke-opacity=".6"/><text x="592.0" y="370.0" class="t" font-size="17" fill="#c4d3ee" textLength="199.0" lengthAdjust="spacingAndGlyphs">(the virtual controller) and</text><text x="796.0" y="370.0" class="t" font-size="17" fill="#6fb0ff" textLength="61.0" lengthAdjust="spacingAndGlyphs">HidHide</text><line x1="796.0" x2="857.0" y1="373.5" y2="373.5" stroke="#6fb0ff" stroke-opacity=".6"/><text x="862.0" y="370.0" class="t" font-size="17" fill="#c4d3ee" textLength="45.0" lengthAdjust="spacingAndGlyphs">(hides</text><text x="102.0" y="397.0" class="t" font-size="17" fill="#c4d3ee" textLength="801.0" lengthAdjust="spacingAndGlyphs">the real one). Their official installers are inside the exe, checked against pinned hashes. Remove them any</text><text x="102.0" y="424.0" class="t" font-size="17" fill="#c4d3ee" textLength="282.0" lengthAdjust="spacingAndGlyphs">time from Windows Settings → Apps.</text><circle cx="86" cy="452" r="3.5" fill="#4da3ff"/><text x="102.0" y="458.0" class="t" font-size="17" font-weight="700" fill="#ffffff" textLength="444.0" lengthAdjust="spacingAndGlyphs">Turbo and macros can get you banned in online games.</text><text x="551.0" y="458.0" class="t" font-size="17" fill="#c4d3ee" textLength="351.0" lengthAdjust="spacingAndGlyphs">You are responsible for the rules of the games</text><text x="102.0" y="485.0" class="t" font-size="17" fill="#c4d3ee" textLength="68.0" lengthAdjust="spacingAndGlyphs">you play.</text></svg>