<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 254" width="1000" height="254" role="img" aria-label="Independent project notice and what X20CTL is">
  <defs>
    <linearGradient id="bg_intro" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CFC7AE"/>
      <stop offset="5%" stop-color="#DDD7C3"/>
      <stop offset="50%" stop-color="#DAD4BE"/>
      <stop offset="95%" stop-color="#D5CEB6"/>
      <stop offset="100%" stop-color="#CFC7AE"/>
    </linearGradient>
    <pattern id="scan_intro" width="8" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="8" y2="0" stroke="#BCB49A" stroke-width="0.6" opacity="0.22"/>
    </pattern>
    
    <style>
      .s { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      
    </style>
  </defs>
  <rect x="0" y="0" width="1000" height="254" fill="url(#bg_intro)"/>
  <rect x="0" y="0" width="1000" height="254" fill="url(#scan_intro)"/>
  <line x1="26" y1="0" x2="26" y2="254" stroke="#BCB49A" stroke-width="1"/>
  <line x1="30" y1="0" x2="30" y2="254" stroke="#BCB49A" stroke-width="0.6" opacity="0.65"/>
  <line x1="974" y1="0" x2="974" y2="254" stroke="#BCB49A" stroke-width="1"/>
  <line x1="970" y1="0" x2="970" y2="254" stroke="#BCB49A" stroke-width="0.6" opacity="0.65"/>
  <rect x="56" y="16" width="896" height="82" fill="#BDB69E"/>
  <rect x="52" y="12" width="896" height="82" fill="#DFD9C4" stroke="#454138" stroke-width="1"/>
  <line x1="52" y1="15" x2="948" y2="15" stroke="#454138" stroke-width="2.2"/>
  <rect x="52" y="12" width="5" height="82" fill="#454138"/>
  <text x="72" y="38" class="s" font-size="13.5" fill="#35322B"><tspan font-weight="700">Independent project.</tspan> X20CTL is open-source software. EasySMX supplied an X20 Pro to help develop it, but</text>
  <text x="72" y="59" class="s" font-size="13.5" fill="#35322B">the app is not made, endorsed, sponsored or supported by EasySMX. Product names belong to their owners</text>
  <text x="72" y="80" class="s" font-size="13.5" fill="#35322B">and are used only to say which controllers X20CTL works with.</text>

  <rect x="52" y="132" width="5" height="22" fill="#454138"/>
  <rect x="60" y="132" width="2" height="22" fill="#454138"/>
  <rect x="69" y="139" width="8" height="8" fill="#454138"/>
  <text x="85" y="150" class="s" font-size="20" font-weight="700" fill="#35322B" letter-spacing="2.4">WHAT IT IS</text>
  <text x="85" y="126" class="m" font-size="10.5" fill="#6F6858" letter-spacing="1.6">ARCHIVE // 01</text>
  
  <line x1="52" y1="158" x2="940" y2="158" stroke="#454138" stroke-width="1"/>
  <polygon points="944,155 948,158 944,161 940,158" fill="#454138"/>
  <text x="52" y="186" class="s" font-size="14.5" fill="#35322B">X20CTL is a desktop studio for EasySMX controllers on Windows (WPF + C++) and Linux (Avalonia). Remap</text>
  <text x="52" y="208" class="s" font-size="14.5" fill="#35322B">buttons, sculpt stick &amp; trigger curves, edit X20 Pro RGB &amp; built-in screen art, preview 4-zone vibration, talk to</text>
  <text x="52" y="230" class="s" font-size="14.5" fill="#35322B">100% offline Agent XCTL, or run low-latency PC Mode across up to four players — with no account or web shell.</text>
</svg>
