<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 332" width="1000" height="332" role="img" aria-label="Independent project notice and overview of X20CTL"><style>.s{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace}</style><defs><linearGradient id="obs_h" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0"><stop offset="0%" stop-color="#06080E"/><stop offset="16%" stop-color="#0B101C"/><stop offset="50%" stop-color="#0E1526"/><stop offset="84%" stop-color="#0B101C"/><stop offset="100%" stop-color="#06080E"/></linearGradient><linearGradient id="obs_vl" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="18" y2="0"><stop offset="0%" stop-color="#020306" stop-opacity="0"/><stop offset="100%" stop-color="#020306" stop-opacity="0.48"/></linearGradient><linearGradient id="obs_vr" gradientUnits="userSpaceOnUse" x1="1000" y1="0" x2="982" y2="0"><stop offset="0%" stop-color="#020306" stop-opacity="0"/><stop offset="100%" stop-color="#020306" stop-opacity="0.48"/></linearGradient><radialGradient id="sb_22a6e0_70" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#22a6e0" stop-opacity="0.07"/><stop offset="48%" stop-color="#22a6e0" stop-opacity="0.0252"/><stop offset="100%" stop-color="#22a6e0" stop-opacity="0"/></radialGradient><radialGradient id="sb_3b6fd8_80" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#3b6fd8" stop-opacity="0.08"/><stop offset="48%" stop-color="#3b6fd8" stop-opacity="0.0288"/><stop offset="100%" stop-color="#3b6fd8" stop-opacity="0"/></radialGradient><clipPath id="c_intro"><rect x="18" y="0" width="964.0" height="332"/></clipPath></defs><g transform="translate(0, 0)"><rect x="0" y="0" width="18" height="332" fill="url(#obs_vl)"/></g><g transform="translate(0, 0)"><rect x="982" y="0" width="18" height="332" fill="url(#obs_vr)"/></g><g clip-path="url(#c_intro)"><g transform="translate(0, -1392.0)"><rect x="0" y="0" width="1000" height="7074" fill="url(#obs_h)"/><polygon points="380,-200 740,-200 340,660 -20,660" fill="#B9D0F8" fill-opacity="0.022"/><polygon points="790,80 1020,80 620,920 390,920" fill="#4F7BE8" fill-opacity="0.026"/><polygon points="380,760 740,760 340,1620 -20,1620" fill="#B9D0F8" fill-opacity="0.022"/><polygon points="790,1040 1020,1040 620,1880 390,1880" fill="#4F7BE8" fill-opacity="0.026"/><polygon points="380,1720 740,1720 340,2580 -20,2580" fill="#B9D0F8" fill-opacity="0.022"/><polygon points="790,2000 1020,2000 620,2840 390,2840" fill="#4F7BE8" fill-opacity="0.026"/><polygon points="380,2680 740,2680 340,3540 -20,3540" fill="#B9D0F8" fill-opacity="0.022"/><polygon points="790,2960 1020,2960 620,3800 390,3800" fill="#4F7BE8" fill-opacity="0.026"/><polygon points="380,3640 740,3640 340,4500 -20,4500" fill="#B9D0F8" fill-opacity="0.022"/><polygon points="790,3920 1020,3920 620,4760 390,4760" fill="#4F7BE8" fill-opacity="0.026"/><polygon points="380,4600 740,4600 340,5460 -20,5460" fill="#B9D0F8" fill-opacity="0.022"/><polygon points="790,4880 1020,4880 620,5720 390,5720" fill="#4F7BE8" fill-opacity="0.026"/><polygon points="380,5560 740,5560 340,6420 -20,6420" fill="#B9D0F8" fill-opacity="0.022"/><polygon points="790,5840 1020,5840 620,6680 390,6680" fill="#4F7BE8" fill-opacity="0.026"/><polygon points="380,6520 740,6520 340,7380 -20,7380" fill="#B9D0F8" fill-opacity="0.022"/><polygon points="790,6800 1020,6800 620,7640 390,7640" fill="#4F7BE8" fill-opacity="0.026"/><ellipse cx="500" cy="1086.0" rx="480" ry="280" fill="url(#sb_3b6fd8_80)"/><ellipse cx="780" cy="2004.0" rx="460" ry="300" fill="url(#sb_22a6e0_70)"/></g></g><line x1="18.5" y1="0" x2="18.5" y2="332" stroke="#DCE8FF" stroke-opacity="0.15" stroke-width="1"/><line x1="981.5" y1="0" x2="981.5" y2="332" stroke="#DCE8FF" stroke-opacity="0.15" stroke-width="1"/><rect x="48" y="12" width="904" height="64" rx="12" fill="#0D1322" fill-opacity="0.90" stroke="#DCE8FF" stroke-opacity="0.14" stroke-width="1"/><rect x="48" y="22" width="3" height="44" rx="1.5" fill="#60A5FA"/><text x="66" y="38" class="s" font-size="13" fill="#BAC5D8"><tspan font-weight="700" fill="#F4F7FC">Independent project.</tspan> X20CTL is open-source software. EasySMX supplied an X20 Pro to help develop it,</text><text x="66" y="58" class="s" font-size="13" fill="#BAC5D8">but the app is not made, endorsed, sponsored or supported by EasySMX.</text><text x="48" y="104" class="m" font-size="11" font-weight="600" fill="#7D8B9F" letter-spacing="2">ARCHIVE // 01</text><text x="952" y="104" text-anchor="end" class="m" font-size="11" fill="#7D8B9F" letter-spacing="1.6">WINDOWS · LINUX · OFFLINE</text><text x="48" y="133" class="s" font-size="22.5" font-weight="700" fill="#F4F7FC" letter-spacing="-0.3">WHAT IT IS &amp; WHY X20CTL</text><line x1="48" y1="146" x2="952" y2="146" stroke="#DCE8FF" stroke-opacity="0.12" stroke-width="1"/><text x="48" y="168" class="s" font-size="14" fill="#BAC5D8">A lightweight desktop alternative to KeyLinker on Windows (.NET 10 WPF + C++) and Linux (Avalonia). Remap paddles,</text><text x="48" y="190" class="s" font-size="14" fill="#BAC5D8">sculpt stick/trigger curves, tune X20 Pro RGB &amp; its 160x80 screen, or run low-latency PC Mode for up to 4 players.</text><rect x="48.0" y="214" width="218.5" height="96" rx="10" fill="#0D1322" fill-opacity="0.92" stroke="#DCE8FF" stroke-opacity="0.16" stroke-width="1"/><text x="62.0" y="237" class="m" font-size="10" font-weight="600" fill="#7DD3FC" letter-spacing="1.2">01 // NO PHONE APP</text><text x="62.0" y="262" class="s" font-size="14.5" font-weight="700" fill="#F4F7FC">No KeyLinker Needed</text><text x="62.0" y="285" class="s" font-size="12" fill="#BAC5D8">Edit pads on PC over BLE or 2.4G</text><rect x="276.5" y="214" width="218.5" height="96" rx="10" fill="#0D1322" fill-opacity="0.92" stroke="#DCE8FF" stroke-opacity="0.16" stroke-width="1"/><text x="290.5" y="237" class="m" font-size="10" font-weight="600" fill="#7DD3FC" letter-spacing="1.2">02 // ZERO BLOAT</text><text x="290.5" y="262" class="s" font-size="14.5" font-weight="700" fill="#F4F7FC">Single Portable EXE</text><text x="290.5" y="285" class="s" font-size="12" fill="#BAC5D8">No account, no background bloat</text><rect x="505.0" y="214" width="218.5" height="96" rx="10" fill="#0D1322" fill-opacity="0.92" stroke="#DCE8FF" stroke-opacity="0.16" stroke-width="1"/><text x="519.0" y="237" class="m" font-size="10" font-weight="600" fill="#7DD3FC" letter-spacing="1.2">03 // UNLOCKS PRO</text><text x="519.0" y="262" class="s" font-size="14.5" font-weight="700" fill="#F4F7FC">Ambient &amp; 160x80 LCD</text><text x="519.0" y="285" class="s" font-size="12" fill="#BAC5D8">Screen Sync, GIFs &amp; Agent XCTL</text><rect x="733.5" y="214" width="218.5" height="96" rx="10" fill="#0D1322" fill-opacity="0.92" stroke="#DCE8FF" stroke-opacity="0.16" stroke-width="1"/><text x="747.5" y="237" class="m" font-size="10" font-weight="600" fill="#7DD3FC" letter-spacing="1.2">04 // VERIFIED SAFE</text><text x="747.5" y="262" class="s" font-size="14.5" font-weight="700" fill="#F4F7FC">Read-Back Checked</text><text x="747.5" y="285" class="s" font-size="12" fill="#BAC5D8">Never flashes controller firmware</text></svg>
