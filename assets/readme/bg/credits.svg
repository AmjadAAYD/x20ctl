<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 178" width="1000" height="178" role="img" aria-label="Credits and open-source contributors">
  <defs>
    <linearGradient id="bg_cred" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CFC7AE"/>
      <stop offset="5%" stop-color="#DDD7C3"/>
      <stop offset="50%" stop-color="#DAD4BE"/>
      <stop offset="95%" stop-color="#D5CEB6"/>
      <stop offset="100%" stop-color="#CFC7AE"/>
    </linearGradient>
    <pattern id="scan_cred" width="8" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="8" y2="0" stroke="#BCB49A" stroke-width="0.6" opacity="0.22"/>
    </pattern>
    
    <style>
      .s { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      
    </style>
  </defs>
  <rect x="0" y="0" width="1000" height="178" fill="url(#bg_cred)"/>
  <rect x="0" y="0" width="1000" height="178" fill="url(#scan_cred)"/>
  <line x1="26" y1="0" x2="26" y2="178" stroke="#BCB49A" stroke-width="1"/>
  <line x1="30" y1="0" x2="30" y2="178" stroke="#BCB49A" stroke-width="0.6" opacity="0.65"/>
  <line x1="974" y1="0" x2="974" y2="178" stroke="#BCB49A" stroke-width="1"/>
  <line x1="970" y1="0" x2="970" y2="178" stroke="#BCB49A" stroke-width="0.6" opacity="0.65"/>
  <rect x="52" y="26" width="5" height="22" fill="#454138"/>
  <rect x="60" y="26" width="2" height="22" fill="#454138"/>
  <rect x="69" y="33" width="8" height="8" fill="#454138"/>
  <text x="85" y="44" class="s" font-size="20" font-weight="700" fill="#35322B" letter-spacing="2.4">CREDITS &amp; LICENSE</text>
  <text x="85" y="20" class="m" font-size="10.5" fill="#6F6858" letter-spacing="1.6">ARCHIVE // 07</text>
  <text x="948" y="43" text-anchor="end" class="m" font-size="11" fill="#6F6858" letter-spacing="1.4">GPL-3.0-OR-LATER</text>
  <line x1="52" y1="52" x2="940" y2="52" stroke="#454138" stroke-width="1"/>
  <polygon points="944,49 948,52 944,55 940,52" fill="#454138"/>
  <text x="52" y="84" class="s" font-size="13.2" fill="#35322B">■ <tspan font-weight="700">Kiin &amp; Team EasySMX:</tspan> Special thanks for supplying a free X20 Pro to turn protocol research into verified hardware support.</text>
  <text x="52" y="109" class="s" font-size="13.2" fill="#35322B">■ <tspan font-weight="700">Edgard (edgardmessias):</tspan> Thanks for decoding the X10 Bluetooth protocol in EasyGamepad; X10 read-back builds on his work.</text>
  <text x="52" y="134" class="s" font-size="13.2" fill="#35322B">■ <tspan font-weight="700">Monratis:</tspan> Thanks for resolving simultaneous mouse/gamepad focus and testing X20 Pro support on real hardware.</text>
  <text x="52" y="159" class="s" font-size="13.2" fill="#35322B">■ <tspan font-weight="700">Design &amp; input inspiration:</tspan> Console layout inspired by ApexSenseBridge (Kayn arts); mouse defaults inspired by Gopher360.</text>
</svg>
