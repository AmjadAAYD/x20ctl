"819.0" lengthAdjust="spacingAndGlyphs">The home screen. Each of the four players has a card; the selected card grows into the hero spot on the left</text><text x="78.0" y="60.0" class="t" font-size="17" fill="#c4d3ee" textLength="330.0" lengthAdjust="spacingAndGlyphs">and the other three wait on the right. Press</text><text x="413.0" y="60.0" class="t" font-size="17" font-weight="700" fill="#ffffff" textLength="12.0" lengthAdjust="spacingAndGlyphs">+</text><text x="430.0" y="60.0" class="t" font-size="17" fill="#c4d3ee" textLength="480.0" lengthAdjust="spacingAndGlyphs">on an empty card to choose a controller. The app opens with a</text><text x="78.0" y="87.0" class="t" font-size="17" fill="#c4d3ee" textLength="90.0" lengthAdjust="spacingAndGlyphs">short intro (</text><text x="168.0" y="87.0" class="t" font-size="17" font-weight="700" fill="#ffffff" textLength="24.0" lengthAdjust="spacingAndGlyphs">Esc</text><text x="197.0" y="87.0" class="t" font-size="17" fill="#c4d3ee" textLength="55.0" lengthAdjust="spacingAndGlyphs">skips it,</text><text x="257.0" y="87.0" class="t" font-size="17" font-weight="700" fill="#ffffff" textLength="16.0" lengthAdjust="spacingAndGlyphs">M</text><text x="278.0" y="87.0" class="t" font-size="17" fill="#c4d3ee" textLength="370.0" lengthAdjust="spacingAndGlyphs">mutes it, and Tools → Opening intro turns it off).</text></svg>