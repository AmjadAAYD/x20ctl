</g><text x="78.0" y="33.0" class="t" font-size="17" font-weight="700" fill="#ffd37a" textLength="79.0" lengthAdjust="spacingAndGlyphs">Windows:</text><text x="162.0" y="33.0" class="t" font-size="17" fill="#c4d3ee" textLength="75.0" lengthAdjust="spacingAndGlyphs">download</text><text x="242.0" y="33.0" class="t" font-size="17" font-weight="700" fill="#ffd37a" textLength="321.0" lengthAdjust="spacingAndGlyphs">X20CTL-V0.016-windows-x64-setup.exe</text><line x1="242.0" x2="563.0" y1="36.5" y2="36.5" stroke="#6fb0ff" stroke-opacity=".6"/><text x="568.0" y="33.0" class="t" font-size="17" fill="#c4d3ee" textLength="353.0" lengthAdjust="spacingAndGlyphs">and run it. It installs X20CTL with a Start menu</text><text x="78.0" y="60.0" class="t" font-size="17" fill="#c4d3ee" textLength="493.0" lengthAdjust="spacingAndGlyphs">entry and an uninstaller in Windows Apps. To skip installing, take</text><text x="576.0" y="60.0" class="t" font-size="17" font-weight="700" fill="#ffd37a" textLength="270.0" lengthAdjust="spacingAndGlyphs">X20CTL-V0.016-windows-x64.exe</text><line x1="576.0" x2="846.0" y1="63.5" y2="63.5" stroke="#6fb0ff" stroke-opacity=".6"/><text x="851.0" y="60.0" class="t" font-size="17" fill="#c4d3ee" textLength="55.0" lengthAdjust="spacingAndGlyphs">instead</text><text x="78.0" y="87.0" class="t" font-size="17" fill="#c4d3ee" textLength="814.0" lengthAdjust="spacingAndGlyphs">and run it from anywhere. The first launch unpacks the engine and data into your temp folder, so it takes a</text><text x="78.0" y="114.0" class="t" font-size="17" fill="#c4d3ee" textLength="274.0" lengthAdjust="spacingAndGlyphs">moment longer than later launches.</text></svg>