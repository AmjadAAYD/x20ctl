anslate(-80px,40px)}}@keyframes bgC{to{transform:translate(50px,-50px)}}.bgP{stroke-dasharray:30 970;animation:bgP 9s linear infinite}@keyframes bgP{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}.bgR{animation:bgR 60s linear infinite}@keyframes bgR{to{transform:rotate(360deg)}}.bgRr{animation:bgR 90s linear infinite reverse}.bgF{animation:bgF 14s ease-in-out infinite alternate}@keyframes bgF{to{transform:translateY(-18px)}}.bgU{animation:bgU 26s linear infinite}@keyframes bgU{from{transform:translateY(0);opacity:0}10%{opacity:.8}90%{opacity:.8}to{transform:translateY(-360px);opacity:0}}.t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.mo{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><path d="M0 0 H1000 V128 H0 V0 Z" fill="#0a0f1c"/><g clip-path="url(#bg_clip)"><g class="bgA"><circle cx="920" cy="-373" r="480" fill="url(#bg_1e3a8a)" opacity="0.22"/></g><g class="bgB"><circle cx="80" cy="147" r="480" fill="url(#bg_1d4ed8)" opacity="0.22"/></g></g><defs><linearGradient id="fdl"><stop offset="0" stop-color="#0d1117" stop-opacity="0.95"/><stop offset="0.35" stop-color="#0d1117" stop-opacity="0.55"/><stop offset="0.7" stop-color="#0d1117" stop-opacity="0.18"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></linearGradient><linearGradient id="fdr" x1="1" x2="0"><stop offset="0" stop-color="#0d1117" stop-opacity="0.95"/><stop offset="0.35" stop-color="#0d1117" stop-opacity="0.55"/><stop offset="0.7" stop-color="#0d1117" stop-opacity="0.18"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></linearGradient></defs><rect width="46" height="128" fill="url(#fdl)"/><rect x="954" width="46" height="128" fill="url(#fdr)"/><text x="78.0" y="33.0" class="t" font-size="17" font-weight="700" fill="#ffffff" textLength="79.0" lengthAdjust="spacingAndGlyphs">Windows:</text><text x="162.0" y="33.0" class="t" font-size="17" fill="#c4d3ee" textLength="75.0" lengthAdjust="spacingAndGlyphs">download</text><text x="242.0" y="33.0" class="t" font-size="17" font-weight="700" fill="#ffffff" textLength="321.0" lengthAdjust="spacingAndGlyphs">X20CTL-V0.016-windows-x64-setup.exe</text><line x1="242.0" x2="563.0" y1="36.5" y2="36.5" stroke="#6fb0ff" stroke-opacity=".6"/><text x="568.0" y="33.0" class="t" font-size="17" fill="#c4d3ee" textLength="353.0" lengthAdjust="spacingAndGlyphs">and run it. It installs X20CTL with a Start menu</text><text x="78.0" y="60.0" class="t" font-size="17" fill="#c4d3ee" textLength="493.0" lengthAdjust="spacingAndGlyphs">entry and an uninstaller in Windows Apps. To skip installing, take</text><text x="576.0" y="60.0" class="t" font-size="17" font-weight="700" fill="#ffffff" textLength="270.0" lengthAdjust="spacingAndGlyphs">X20CTL-V0.016-windows-x64.exe</text><line x1="576.0" x2="846.0" y1="63.5" y2="63.5" stroke="#6fb0ff" stroke-opacity=".6"/><text x="851.0" y="60.0" class="t" font-size="17" fill="#c4d3ee" textLength="55.0" lengthAdjust="spacingAndGlyphs">instead</text><text x="78.0" y="87.0" class="t" font-size="17" fill="#c4d3ee" textLength="814.0" lengthAdjust="spacingAndGlyphs">and run it from anywhere. The first launch unpacks the engine and data into your temp folder, so it takes a</text><text x="78.0" y="114.0" class="t" font-size="17" fill="#c4d3ee" textLength="274.0" lengthAdjust="spacingAndGlyphs">moment longer than later launches.</text></svg>