<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 156" width="1000" height="156" role="img" aria-label="Switch it on in the tab, from the tray icon, or by holding View + Y for a second.; Speed, acceleration, dead zone, slow-pointer speed and scroll speed are adjustable.; While it&#x27;s on, games see a resting controller, so a click never also presses A in a game.; The idea comes from Gopher360(https://git"><defs><radialGradient id="bg_1d4ed8"><stop offset="0" stop-color="#1d4ed8"/><stop offset=".55" stop-color="#1d4ed8" stop-opacity=".3"/><stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/></radialGradient><radialGradient id="bg_1e40af"><stop offset="0" stop-color="#1e40af"/><stop offset=".55" stop-color="#1e40af" stop-opacity=".3"/><stop offset="1" stop-color="#1e40af" stop-opacity="0"/></radialGradient><radialGradient id="bg_312e81"><stop offset="0" stop-color="#312e81"/><stop offset=".55" stop-color="#312e81" stop-opacity=".3"/><stop offset="1" stop-color="#312e81" stop-opacity="0"/></radialGradient><radialGradient id="bg_1e3a8a"><stop offset="0" stop-color="#1e3a8a"/><stop offset=".55" stop-color="#1e3a8a" stop-opacity=".3"/><stop offset="1" stop-color="#1e3a8a" stop-opacity="0"/></radialGradient><radialGradient id="bg_1d4ed8"><stop offset="0" stop-color="#1d4ed8"/><stop offset=".55" stop-color="#1d4ed8" stop-opacity=".3"/><stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/></radialGradient><pattern id="bg_grid" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="translate(0 -5)"><path d="M40 0H0V40" fill="none" stroke="#6ea0ff" stroke-opacity=".055"/></pattern><linearGradient id="bg_hbar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4da3ff"/><stop offset="1" stop-color="#4da3ff"/></linearGradient><clipPath id="bg_clip"><path d="M0 0 H1000 V156 H0 V0 Z"/></clipPath></defs><style>.bgA{animation:bgA 40s ease-in-out infinite alternate}.bgB{animation:bgB 52s ease-in-out infinite alternate}.bgC{animation:bgC 64s ease-in-out infinite alternate}@keyframes bgA{to{transform:translate(70px,30px)}}@keyframes bgB{to{transform:translate(-80px,40px)}}@keyframes bgC{to{transform:translate(50px,-50px)}}.bgP{stroke-dasharray:30 970;animation:bgP 9s linear infinite}@keyframes bgP{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}.bgR{animation:bgR 60s linear infinite}@keyframes bgR{to{transform:rotate(360deg)}}.bgRr{animation:bgR 90s linear infinite reverse}.bgF{animation:bgF 14s ease-in-out infinite alternate}@keyframes bgF{to{transform:translateY(-18px)}}.bgU{animation:bgU 26s linear infinite}@keyframes bgU{from{transform:translateY(0);opacity:0}10%{opacity:.8}90%{opacity:.8}to{transform:translateY(-360px);opacity:0}}.t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.mo{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><path d="M0 0 H1000 V156 H0 V0 Z" fill="#0a0f1c"/><g clip-path="url(#bg_clip)"><g class="bgB"><circle cx="80" cy="-175" r="480" fill="url(#bg_312e81)" opacity="0.22"/></g><g class="bgC"><circle cx="920" cy="345" r="480" fill="url(#bg_1e3a8a)" opacity="0.22"/></g></g><defs><linearGradient id="fdl"><stop offset="0" stop-color="#0d1117" stop-opacity="0.95"/><stop offset="0.35" stop-color="#0d1117" stop-opacity="0.55"/><stop offset="0.7" stop-color="#0d1117" stop-opacity="0.18"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></linearGradient><linearGradient id="fdr" x1="1" x2="0"><stop offset="0" stop-color="#0d1117" stop-opacity="0.95"/><stop offset="0.35" stop-color="#0d1117" stop-opacity="0.55"/><stop offset="0.7" stop-color="#0d1117" stop-opacity="0.18"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></linearGradient></defs><rect width="46" height="156" fill="url(#fdl)"/><rect x="954" width="46" height="156" fill="url(#fdr)"/><circle cx="86" cy="25" r="3.5" fill="#4da3ff"/><text x="102.0" y="31.0" class="t" font-size="17" fill="#c4d3ee" textLength="425.0" lengthAdjust="spacingAndGlyphs">Switch it on in the tab, from the tray icon, or by holding</text><text x="532.0" y="31.0" class="t" font-size="17" font-weight="700" fill="#ffffff" textLength="71.0" lengthAdjust="spacingAndGlyphs">View + Y</text><text x="608.0" y="31.0" class="t" font-size="17" fill="#c4d3ee" textLength="98.0" lengthAdjust="spacingAndGlyphs">for a second.</text><circle cx="86" cy="59" r="3.5" fill="#4da3ff"/><text x="102.0" y="65.0" class="t" font-size="17" fill="#c4d3ee" textLength="635.0" lengthAdjust="spacingAndGlyphs">Speed, acceleration, dead zone, slow-pointer speed and scroll speed are adjustable.</text><circle cx="86" cy="93" r="3.5" fill="#4da3ff"/><text x="102.0" y="99.0" class="t" font-size="17" fill="#c4d3ee" textLength="652.0" lengthAdjust="spacingAndGlyphs">While it&#x27;s on, games see a resting controller, so a click never also presses A in a game.</text><circle cx="86" cy="127" r="3.5" fill="#4da3ff"/><text x="102.0" y="133.0" class="t" font-size="17" fill="#c4d3ee" textLength="160.0" lengthAdjust="spacingAndGlyphs">The idea comes from</text><text x="267.0" y="133.0" class="t" font-size="17" fill="#6fb0ff" textLength="84.0" lengthAdjust="spacingAndGlyphs">Gopher360</text><line x1="267.0" x2="351.0" y1="136.5" y2="136.5" stroke="#6fb0ff" stroke-opacity=".6"/><text x="351.0" y="133.0" class="t" font-size="17" fill="#c4d3ee" textLength="255.0" lengthAdjust="spacingAndGlyphs">; X20CTL&#x27;s version is written fresh.</text></svg>