></g><circle cx="86" cy="25" r="3.5" fill="#4da3ff"/><text x="102.0" y="31.0" class="t" font-size="17" fill="#c4d3ee" textLength="425.0" lengthAdjust="spacingAndGlyphs">Switch it on in the tab, from the tray icon, or by holding</text><text x="532.0" y="31.0" class="t" font-size="17" font-weight="700" fill="#ffd37a" textLength="71.0" lengthAdjust="spacingAndGlyphs">View + Y</text><text x="608.0" y="31.0" class="t" font-size="17" fill="#c4d3ee" textLength="98.0" lengthAdjust="spacingAndGlyphs">for a second.</text><circle cx="86" cy="59" r="3.5" fill="#4da3ff"/><text x="102.0" y="65.0" class="t" font-size="17" fill="#c4d3ee" textLength="635.0" lengthAdjust="spacingAndGlyphs">Speed, acceleration, dead zone, slow-pointer speed and scroll speed are adjustable.</text><circle cx="86" cy="93" r="3.5" fill="#4da3ff"/><text x="102.0" y="99.0" class="t" font-size="17" fill="#c4d3ee" textLength="652.0" lengthAdjust="spacingAndGlyphs">While it&#x27;s on, games see a resting controller, so a click never also presses A in a game.</text><circle cx="86" cy="127" r="3.5" fill="#4da3ff"/><text x="102.0" y="133.0" class="t" font-size="17" fill="#c4d3ee" textLength="160.0" lengthAdjust="spacingAndGlyphs">The idea comes from</text><text x="267.0" y="133.0" class="t" font-size="17" fill="#6fb0ff" textLength="84.0" lengthAdjust="spacingAndGlyphs">Gopher360</text><line x1="267.0" x2="351.0" y1="136.5" y2="136.5" stroke="#6fb0ff" stroke-opacity=".6"/><text x="351.0" y="133.0" class="t" font-size="17" fill="#c4d3ee" textLength="255.0" lengthAdjust="spacingAndGlyphs">; X20CTL&#x27;s version is written fresh.</text></svg>