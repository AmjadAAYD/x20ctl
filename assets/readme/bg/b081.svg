2c4ff" textLength="144.0" lengthAdjust="spacingAndGlyphs">x20ctl-pcmode.py</text><text x="559.0" y="60.0" class="t" font-size="17" fill="#c4d3ee" textLength="278.0" lengthAdjust="spacingAndGlyphs">) as standalone Python 3 scripts. The</text><rect x="841.0" y="44.0" width="35.0" height="24" rx="5" fill="#1a1440" stroke="#4b3c9a"/><text x="845.0" y="60.0" class="mo" font-size="15.3" fill="#d2c4ff" textLength="27.0" lengthAdjust="spacingAndGlyphs">x20</text><text x="78.0" y="87.0" class="t" font-size="17" fill="#c4d3ee" textLength="119.0" lengthAdjust="spacingAndGlyphs">command line (</text><rect x="201.0" y="71.0" width="143.0" height="24" rx="5" fill="#1a1440" stroke="#4b3c9a"/><text x="205.0" y="87.0" class="mo" font-size="15.3" fill="#d2c4ff" textLength="135.0" lengthAdjust="spacingAndGlyphs">uv run x20 scan</text><text x="343.0" y="87.0" class="t" font-size="17" fill="#c4d3ee" textLength="575.0" lengthAdjust="spacingAndGlyphs">) runs from this repository. A native Linux build of the full Studio is planned.</text></svg>