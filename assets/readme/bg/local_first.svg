<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 178" width="1000" height="178" role="img" aria-label="Local-first privacy guarantees">
  <defs>
    <linearGradient id="bg_loc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CFC7AE"/>
      <stop offset="5%" stop-color="#DDD7C3"/>
      <stop offset="50%" stop-color="#DAD4BE"/>
      <stop offset="95%" stop-color="#D5CEB6"/>
      <stop offset="100%" stop-color="#CFC7AE"/>
    </linearGradient>
    <pattern id="scan_loc" width="8" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="8" y2="0" stroke="#BCB49A" stroke-width="0.6" opacity="0.22"/>
    </pattern>
    
    <style>
      .s { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      
    </style>
  </defs>
  <rect x="0" y="0" width="1000" height="178" fill="url(#bg_loc)"/>
  <rect x="0" y="0" width="1000" height="178" fill="url(#scan_loc)"/>
  <line x1="26" y1="0" x2="26" y2="178" stroke="#BCB49A" stroke-width="1"/>
  <line x1="30" y1="0" x2="30" y2="178" stroke="#BCB49A" stroke-width="0.6" opacity="0.65"/>
  <line x1="974" y1="0" x2="974" y2="178" stroke="#BCB49A" stroke-width="1"/>
  <line x1="970" y1="0" x2="970" y2="178" stroke="#BCB49A" stroke-width="0.6" opacity="0.65"/>
  <rect x="52" y="26" width="5" height="22" fill="#454138"/>
  <rect x="60" y="26" width="2" height="22" fill="#454138"/>
  <rect x="69" y="33" width="8" height="8" fill="#454138"/>
  <text x="85" y="44" class="s" font-size="20" font-weight="700" fill="#35322B" letter-spacing="2.4">LOCAL FIRST</text>
  <text x="85" y="20" class="m" font-size="10.5" fill="#6F6858" letter-spacing="1.6">ARCHIVE // 06</text>
  <text x="948" y="43" text-anchor="end" class="m" font-size="11" fill="#6F6858" letter-spacing="1.4">NO ACCOUNT · ZERO TELEMETRY</text>
  <line x1="52" y1="52" x2="940" y2="52" stroke="#454138" stroke-width="1"/>
  <polygon points="944,49 948,52 944,55 940,52" fill="#454138"/>
  <text x="52" y="84" class="s" font-size="13.2" fill="#35322B">■ <tspan font-weight="700">100% offline assistant &amp; storage:</tspan> Agent XCTL, setups, drafts and PC Mode profiles stay in your local user folder.</text>
  <text x="52" y="109" class="s" font-size="13.2" fill="#35322B">■ <tspan font-weight="700">Update check &amp; drivers:</tspan> Checks GitHub stable releases only (toggle off in Tools); asks before installing ViGEmBus / HidHide.</text>
  <text x="52" y="134" class="s" font-size="13.2" fill="#35322B">■ <tspan font-weight="700">Local game library reads:</tspan> Reads local Steam, Epic, GOG, Riot, Heroic and Lutris files only for automatic per-game profiles.</text>
  <text x="52" y="159" class="s" font-size="13.2" fill="#35322B">■ <tspan font-weight="700">Opt-in uploads only:</tspan> Nothing is sent unless you confirm Scan and send or Feedback; X20CTL never flashes firmware.</text>
</svg>
