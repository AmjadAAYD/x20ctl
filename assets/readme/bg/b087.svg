<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 101" width="1000" height="101" role="img" aria-label="The controller art is generated from the source pictures by tools/build_native_controller_layers.py, and the outlines by tools/build_controller_outlines.py. The protocol research and the earlier Pytho"><defs><radialGradient id="bg_1d4ed8"><stop offset="0" stop-color="#1d4ed8"/><stop offset=".55" stop-color="#1d4ed8" stop-opacity=".3"/><stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/></radialGradient><radialGradient id="bg_1e40af"><stop offset="0" stop-color="#1e40af"/><stop offset=".55" stop-color="#1e40af" stop-opacity=".3"/><stop offset="1" stop-color="#1e40af" stop-opacity="0"/></radialGradient><radialGradient id="bg_312e81"><stop offset="0" stop-color="#312e81"/><stop offset=".55" stop-color="#312e81" stop-opacity=".3"/><stop offset="1" stop-color="#312e81" stop-opacity="0"/></radialGradient><radialGradient id="bg_1e3a8a"><stop offset="0" stop-color="#1e3a8a"/><stop offset=".55" stop-color="#1e3a8a" stop-opacity=".3"/><stop offset="1" stop-color="#1e3a8a" stop-opacity="0"/></radialGradient><radialGradient id="bg_1d4ed8"><stop offset="0" stop-color="#1d4ed8"/><stop offset=".55" stop-color="#1d4ed8" stop-opacity=".3"/><stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/></radialGradient><pattern id="bg_grid" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="translate(0 -9)"><path d="M40 0H0V40" fill="none" stroke="#6ea0ff" stroke-opacity=".055"/></pattern><linearGradient id="bg_hbar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4da3ff"/><stop offset="1" stop-color="#4da3ff"/></linearGradient><clipPath id="bg_clip"><path d="M0 0 H1000 V101 H0 V0 Z"/></clipPath></defs><style>.bgA{animation:bgA 40s ease-in-out infinite alternate}.bgB{animation:bgB 52s ease-in-out infinite alternate}.bgC{animation:bgC 64s ease-in-out infinite alternate}@keyframes bgA{to{transform:translate(70px,30px)}}@keyframes bgB{to{transform:translate(-80px,40px)}}@keyframes bgC{to{transform:translate(50px,-50px)}}.bgP{stroke-dasharray:30 970;animation:bgP 9s linear infinite}@keyframes bgP{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}.bgR{animation:bgR 60s linear infinite}@keyframes bgR{to{transform:rotate(360deg)}}.bgRr{animation:bgR 90s linear infinite reverse}.bgF{animation:bgF 14s ease-in-out infinite alternate}@keyframes bgF{to{transform:translateY(-18px)}}.bgU{animation:bgU 26s linear infinite}@keyframes bgU{from{transform:translateY(0);opacity:0}10%{opacity:.8}90%{opacity:.8}to{transform:translateY(-360px);opacity:0}}.t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.mo{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><path d="M0 0 H1000 V101 H0 V0 Z" fill="#0a0f1c"/><g clip-path="url(#bg_clip)"><g class="bgA"><circle cx="80" cy="-59" r="480" fill="url(#bg_1e40af)" opacity="0.22"/></g><g class="bgB"><circle cx="920" cy="461" r="480" fill="url(#bg_312e81)" opacity="0.22"/></g></g><defs><linearGradient id="fdl"><stop offset="0" stop-color="#0d1117" stop-opacity="0.95"/><stop offset="0.35" stop-color="#0d1117" stop-opacity="0.55"/><stop offset="0.7" stop-color="#0d1117" stop-opacity="0.18"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></linearGradient><linearGradient id="fdr" x1="1" x2="0"><stop offset="0" stop-color="#0d1117" stop-opacity="0.95"/><stop offset="0.35" stop-color="#0d1117" stop-opacity="0.55"/><stop offset="0.7" stop-color="#0d1117" stop-opacity="0.18"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></linearGradient></defs><rect width="46" height="101" fill="url(#fdl)"/><rect x="954" width="46" height="101" fill="url(#fdr)"/><text x="78.0" y="33.0" class="t" font-size="17" fill="#c4d3ee" textLength="445.0" lengthAdjust="spacingAndGlyphs">The controller art is generated from the source pictures by</text><rect x="527.0" y="17.0" width="359.0" height="24" rx="5" fill="#1a1440" stroke="#4b3c9a"/><text x="531.0" y="33.0" class="mo" font-size="15.3" fill="#d2c4ff" textLength="351.0" lengthAdjust="spacingAndGlyphs">tools/build_native_controller_layers.py</text><text x="885.0" y="33.0" class="t" font-size="17" fill="#c4d3ee" textLength="4.0" lengthAdjust="spacingAndGlyphs">,</text><text x="78.0" y="60.0" class="t" font-size="17" fill="#c4d3ee" textLength="147.0" lengthAdjust="spacingAndGlyphs">and the outlines by</text><rect x="229.0" y="44.0" width="314.0" height="24" rx="5" fill="#1a1440" stroke="#4b3c9a"/><text x="233.0" y="60.0" class="mo" font-size="15.3" fill="#d2c4ff" textLength="306.0" lengthAdjust="spacingAndGlyphs">tools/build_controller_outlines.py</text><text x="542.0" y="60.0" class="t" font-size="17" fill="#c4d3ee" textLength="350.0" lengthAdjust="spacingAndGlyphs">. The protocol research and the earlier Python</text><text x="78.0" y="87.0" class="t" font-size="17" fill="#c4d3ee" textLength="403.0" lengthAdjust="spacingAndGlyphs">and React desktop lines are still in the repository: see</text><text x="486.0" y="87.0" class="t" font-size="17" fill="#6fb0ff" textLength="42.0" lengthAdjust="spacingAndGlyphs">docs/</text><line x1="486.0" x2="528.0" y1="90.5" y2="90.5" stroke="#6fb0ff" stroke-opacity=".6"/><text x="533.0" y="87.0" class="t" font-size="17" fill="#c4d3ee" textLength="59.0" lengthAdjust="spacingAndGlyphs">and the</text><text x="597.0" y="87.0" class="t" font-size="17" fill="#6fb0ff" textLength="140.0" lengthAdjust="spacingAndGlyphs">protocol reference</text><line x1="597.0" x2="737.0" y1="90.5" y2="90.5" stroke="#6fb0ff" stroke-opacity=".6"/><text x="737.0" y="87.0" class="t" font-size="17" fill="#c4d3ee" textLength="4.0" lengthAdjust="spacingAndGlyphs">.</text></svg>