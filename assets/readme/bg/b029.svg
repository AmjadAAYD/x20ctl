<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 156" width="1000" height="156" role="img" aria-label="dead zones in 0.1% steps, anti-deadzone and max output;; a square gate, up/down speed, or pure raw 1:1;; presets, copy to the other stick, and a table of what the game gets at each push;; Measure drift, which sets each inner dead zone just past how far the stick wanders on its own."><defs><radialGradient id="bg_1d4ed8"><stop offset="0" stop-color="#1d4ed8"/><stop offset=".55" stop-color="#1d4ed8" stop-opacity=".3"/><stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/></radialGradient><radialGradient id="bg_1e40af"><stop offset="0" stop-color="#1e40af"/><stop offset=".55" stop-color="#1e40af" stop-opacity=".3"/><stop offset="1" stop-color="#1e40af" stop-opacity="0"/></radialGradient><radialGradient id="bg_312e81"><stop offset="0" stop-color="#312e81"/><stop offset=".55" stop-color="#312e81" stop-opacity=".3"/><stop offset="1" stop-color="#312e81" stop-opacity="0"/></radialGradient><radialGradient id="bg_1e3a8a"><stop offset="0" stop-color="#1e3a8a"/><stop offset=".55" stop-color="#1e3a8a" stop-opacity=".3"/><stop offset="1" stop-color="#1e3a8a" stop-opacity="0"/></radialGradient><radialGradient id="bg_1d4ed8"><stop offset="0" stop-color="#1d4ed8"/><stop offset=".55" stop-color="#1d4ed8" stop-opacity=".3"/><stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/></radialGradient><pattern id="bg_grid" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="translate(0 -32)"><path d="M40 0H0V40" fill="none" stroke="#6ea0ff" stroke-opacity=".055"/></pattern><linearGradient id="bg_hbar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4da3ff"/><stop offset="1" stop-color="#4da3ff"/></linearGradient><clipPath id="bg_clip"><path d="M0 0 H1000 V156 H0 V0 Z"/></clipPath></defs><style>.bgA{animation:bgA 40s ease-in-out infinite alternate}.bgB{animation:bgB 52s ease-in-out infinite alternate}.bgC{animation:bgC 64s ease-in-out infinite alternate}@keyframes bgA{to{transform:translate(70px,30px)}}@keyframes bgB{to{transform:translate(-80px,40px)}}@keyframes bgC{to{transform:translate(50px,-50px)}}.bgP{stroke-dasharray:30 970;animation:bgP 9s linear infinite}@keyframes bgP{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}.bgR{animation:bgR 60s linear infinite}@keyframes bgR{to{transform:rotate(360deg)}}.bgRr{animation:bgR 90s linear infinite reverse}.bgF{animation:bgF 14s ease-in-out infinite alternate}@keyframes bgF{to{transform:translateY(-18px)}}.bgU{animation:bgU 26s linear infinite}@keyframes bgU{from{transform:translateY(0);opacity:0}10%{opacity:.8}90%{opacity:.8}to{transform:translateY(-360px);opacity:0}}.t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.mo{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><path d="M0 0 H1000 V156 H0 V0 Z" fill="#0a0f1c"/><g clip-path="url(#bg_clip)"><g class="bgA"><circle cx="80" cy="-42" r="480" fill="url(#bg_312e81)" opacity="0.22"/></g><g class="bgB"><circle cx="920" cy="478" r="480" fill="url(#bg_1e3a8a)" opacity="0.22"/></g></g><defs><linearGradient id="fdl"><stop offset="0" stop-color="#0d1117" stop-opacity="0.95"/><stop offset="0.35" stop-color="#0d1117" stop-opacity="0.55"/><stop offset="0.7" stop-color="#0d1117" stop-opacity="0.18"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></linearGradient><linearGradient id="fdr" x1="1" x2="0"><stop offset="0" stop-color="#0d1117" stop-opacity="0.95"/><stop offset="0.35" stop-color="#0d1117" stop-opacity="0.55"/><stop offset="0.7" stop-color="#0d1117" stop-opacity="0.18"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></linearGradient></defs><rect width="46" height="156" fill="url(#fdl)"/><rect x="954" width="46" height="156" fill="url(#fdr)"/><circle cx="86" cy="25" r="3.5" fill="#4da3ff"/><text x="102.0" y="31.0" class="t" font-size="17" fill="#c4d3ee" textLength="443.0" lengthAdjust="spacingAndGlyphs">dead zones in 0.1% steps, anti-deadzone and max output;</text><circle cx="86" cy="59" r="3.5" fill="#4da3ff"/><text x="102.0" y="65.0" class="t" font-size="17" fill="#c4d3ee" textLength="360.0" lengthAdjust="spacingAndGlyphs">a square gate, up/down speed, or pure raw 1:1;</text><circle cx="86" cy="93" r="3.5" fill="#4da3ff"/><text x="102.0" y="99.0" class="t" font-size="17" fill="#c4d3ee" textLength="613.0" lengthAdjust="spacingAndGlyphs">presets, copy to the other stick, and a table of what the game gets at each push;</text><circle cx="86" cy="127" r="3.5" fill="#4da3ff"/><text x="102.0" y="133.0" class="t" font-size="17" font-weight="700" fill="#ffd37a" textLength="109.0" lengthAdjust="spacingAndGlyphs">Measure drift</text><text x="211.0" y="133.0" class="t" font-size="17" fill="#c4d3ee" textLength="612.0" lengthAdjust="spacingAndGlyphs">, which sets each inner dead zone just past how far the stick wanders on its own.</text></svg>