 textLength="836.0" lengthAdjust="spacingAndGlyphs">PC mode gives any controller remaps, turbo, stick and trigger curves and macros on the PC. X20CTL reads the</text><text x="78.0" y="60.0" class="t" font-size="17" fill="#c4d3ee" textLength="818.0" lengthAdjust="spacingAndGlyphs">real controller, applies your settings, and hands the result to the game as a virtual Xbox controller while the</text><text x="78.0" y="87.0" class="t" font-size="17" fill="#c4d3ee" textLength="415.0" lengthAdjust="spacingAndGlyphs">real one is hidden. Nothing is written to the controller.</text></svg>