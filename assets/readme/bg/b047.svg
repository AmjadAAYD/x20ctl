<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 156" width="1000" height="156" role="img" aria-label="Sticks: a range trace with its roundness, where each stick rests (drift), and the smallest step it moves in.; Triggers: how far each one travels.; Buttons: every press, with chatter flagged, since a press too short for a finger usually means a worn switch.; Report rate: how many reports a second the"><defs><radialGradient id="bg_1d4ed8"><stop offset="0" stop-color="#1d4ed8"/><stop offset=".55" stop-color="#1d4ed8" stop-opacity=".3"/><stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/></radialGradient><radialGradient id="bg_1e40af"><stop offset="0" stop-color="#1e40af"/><stop offset=".55" stop-color="#1e40af" stop-opacity=".3"/><stop offset="1" stop-color="#1e40af" stop-opacity="0"/></radialGradient><radialGradient id="bg_312e81"><stop offset="0" stop-color="#312e81"/><stop offset=".55" stop-color="#312e81" stop-opacity=".3"/><stop offset="1" stop-color="#312e81" stop-opacity="0"/></radialGradient><radialGradient id="bg_1e3a8a"><stop offset="0" stop-color="#1e3a8a"/><stop offset=".55" stop-color="#1e3a8a" stop-opacity=".3"/><stop offset="1" stop-color="#1e3a8a" stop-opacity="0"/></radialGradient><radialGradient id="bg_1d4ed8"><stop offset="0" stop-color="#1d4ed8"/><stop offset=".55" stop-color="#1d4ed8" stop-opacity=".3"/><stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/></radialGradient><pattern id="bg_grid" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="translate(0 -2)"><path d="M40 0H0V40" fill="none" stroke="#6ea0ff" stroke-opacity=".055"/></pattern><linearGradient id="bg_hbar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4da3ff"/><stop offset="1" stop-color="#4da3ff"/></linearGradient><clipPath id="bg_clip"><path d="M0 0 H1000 V156 H0 V0 Z"/></clipPath></defs><style>.bgA{animation:bgA 40s ease-in-out infinite alternate}.bgB{animation:bgB 52s ease-in-out infinite alternate}.bgC{animation:bgC 64s ease-in-out infinite alternate}@keyframes bgA{to{transform:translate(70px,30px)}}@keyframes bgB{to{transform:translate(-80px,40px)}}@keyframes bgC{to{transform:translate(50px,-50px)}}.bgP{stroke-dasharray:30 970;animation:bgP 9s linear infinite}@keyframes bgP{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}.bgR{animation:bgR 60s linear infinite}@keyframes bgR{to{transform:rotate(360deg)}}.bgRr{animation:bgR 90s linear infinite reverse}.bgF{animation:bgF 14s ease-in-out infinite alternate}@keyframes bgF{to{transform:translateY(-18px)}}.bgU{animation:bgU 26s linear infinite}@keyframes bgU{from{transform:translateY(0);opacity:0}10%{opacity:.8}90%{opacity:.8}to{transform:translateY(-360px);opacity:0}}.t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.mo{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><path d="M0 0 H1000 V156 H0 V0 Z" fill="#0a0f1c"/><g clip-path="url(#bg_clip)"><g class="bgC"><circle cx="80" cy="-252" r="480" fill="url(#bg_1d4ed8)" opacity="0.22"/></g><g class="bgA"><circle cx="920" cy="268" r="480" fill="url(#bg_1e40af)" opacity="0.22"/></g></g><defs><linearGradient id="fdl"><stop offset="0" stop-color="#0d1117" stop-opacity="0.95"/><stop offset="0.35" stop-color="#0d1117" stop-opacity="0.55"/><stop offset="0.7" stop-color="#0d1117" stop-opacity="0.18"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></linearGradient><linearGradient id="fdr" x1="1" x2="0"><stop offset="0" stop-color="#0d1117" stop-opacity="0.95"/><stop offset="0.35" stop-color="#0d1117" stop-opacity="0.55"/><stop offset="0.7" stop-color="#0d1117" stop-opacity="0.18"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></linearGradient></defs><rect width="46" height="156" fill="url(#fdl)"/><rect x="954" width="46" height="156" fill="url(#fdr)"/><circle cx="86" cy="25" r="3.5" fill="#4da3ff"/><text x="102.0" y="31.0" class="t" font-size="17" font-weight="700" fill="#ffffff" textLength="52.0" lengthAdjust="spacingAndGlyphs">Sticks:</text><text x="159.0" y="31.0" class="t" font-size="17" fill="#c4d3ee" textLength="727.0" lengthAdjust="spacingAndGlyphs">a range trace with its roundness, where each stick rests (drift), and the smallest step it moves in.</text><circle cx="86" cy="59" r="3.5" fill="#4da3ff"/><text x="102.0" y="65.0" class="t" font-size="17" font-weight="700" fill="#ffffff" textLength="72.0" lengthAdjust="spacingAndGlyphs">Triggers:</text><text x="179.0" y="65.0" class="t" font-size="17" fill="#c4d3ee" textLength="190.0" lengthAdjust="spacingAndGlyphs">how far each one travels.</text><circle cx="86" cy="93" r="3.5" fill="#4da3ff"/><text x="102.0" y="99.0" class="t" font-size="17" font-weight="700" fill="#ffffff" textLength="67.0" lengthAdjust="spacingAndGlyphs">Buttons:</text><text x="174.0" y="99.0" class="t" font-size="17" fill="#c4d3ee" textLength="740.0" lengthAdjust="spacingAndGlyphs">every press, with chatter flagged, since a press too short for a finger usually means a worn switch.</text><circle cx="86" cy="127" r="3.5" fill="#4da3ff"/><text x="102.0" y="133.0" class="t" font-size="17" font-weight="700" fill="#ffffff" textLength="97.0" lengthAdjust="spacingAndGlyphs">Report rate:</text><text x="204.0" y="133.0" class="t" font-size="17" fill="#c4d3ee" textLength="416.0" lengthAdjust="spacingAndGlyphs">how many reports a second the controller really sends.</text></svg>