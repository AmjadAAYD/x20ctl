rm:translate(50px,-50px)}}.bgP{stroke-dasharray:30 970;animation:bgP 9s linear infinite}@keyframes bgP{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}.bgR{animation:bgR 60s linear infinite}@keyframes bgR{to{transform:rotate(360deg)}}.bgRr{animation:bgR 90s linear infinite reverse}.bgF{animation:bgF 14s ease-in-out infinite alternate}@keyframes bgF{to{transform:translateY(-18px)}}.bgU{animation:bgU 26s linear infinite}@keyframes bgU{from{transform:translateY(0);opacity:0}10%{opacity:.8}90%{opacity:.8}to{transform:translateY(-360px);opacity:0}}.t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.mo{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><path d="M0 0 H1000 V325 H0 V0 Z" fill="#04070f"/><g clip-path="url(#bg_clip)"><g class="bgA"><circle cx="920" cy="-204" r="480" fill="url(#bg_0e7490)" opacity="0.5"/></g><g class="bgB"><circle cx="80" cy="316" r="480" fill="url(#bg_6d28d9)" opacity="0.5"/></g><rect width="1000" height="325" fill="url(#bg_grid)"/><g transform="translate(0 -1914)"><path d="M241 2007 H506 V2073 H287 V2113 H684 V2179" fill="none" stroke="#2b4b86" stroke-opacity=".55" stroke-width="1.3" stroke-linejoin="round"/><path d="M241 2007 H506 V2073 H287 V2113 H684 V2179" pathLength="1000" fill="none" stroke="#4da3ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="bgP" style="animation-delay:-8.5s"/><circle cx="241" cy="2007" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="506" cy="2073" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="287" cy="2113" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="684" cy="2179" r="2.6" fill="#3b6bc4" opacity=".7"/></g><g transform="translate(0 -1914)"><path d="M478 2128 H878 V2168 H474 V2128 H646 V2168" fill="none" stroke="#2b4b86" stroke-opacity=".55" stroke-width="1.3" stroke-linejoin="round"/><path d="M478 2128 H878 V2168 H474 V2128 H646 V2168" pathLength="1000" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="bgP" style="animation-delay:-8.8s"/><circle cx="478" cy="2128" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="878" cy="2168" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="474" cy="2128" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="646" cy="2168" r="2.6" fill="#3b6bc4" opacity=".7"/></g><g transform="translate(0 -1914)"><path d="M-14 2240 H181 V2174 H358 V2240 H756 V2174 H390 V2240" fill="none" stroke="#2b4b86" stroke-opacity=".55" stroke-width="1.3" stroke-linejoin="round"/><path d="M-14 2240 H181 V2174 H358 V2240 H756 V2174 H390 V2240" pathLength="1000" fill="none" stroke="#4da3ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="bgP" style="animation-delay:-7.9s"/><circle cx="-14" cy="2240" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="181" cy="2174" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="358" cy="2240" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="756" cy="2174" r="2.6" fill="#3b6bc4" opacity=".7"/><circle cx="390" cy="2240" r="2.6" fill="#3b6bc4" opacity=".7"/></g><g transform="translate(70 206)" opacity=".5"><circle r="160" fill="none" stroke="#2f5dae" stroke-opacity=".6"/><circle r="106" fill="none" stroke="#2f5dae" stroke-opacity=".45" stroke-dasharray="3 7"/><circle r="53" fill="none" stroke="#2f5dae" stroke-opacity=".5"/><line x1="-160" x2="160" stroke="#2f5dae" stroke-opacity=".3"/><line y1="-160" y2="160" stroke="#2f5dae" stroke-opacity=".3"/><g class="bgR"><circle cx="160" r="4.5" fill="#22d3ee"/></g><g class="bgRr"><circle cx="106" r="3.5" fill="#4da3ff"/></g></g><circle cx="498" cy="565" r="1.8" fill="#9fc4ff" class="bgU" style="animation-duration:35s;animation-delay:-6s"/><circle cx="87" cy="628" r="1.4" fill="#9fc4ff" class="bgU" style="animation-duration:38s;animation-delay:-9s"/><circle cx="394" cy="125" r="1.8" fill="#9fc4ff" class="bgU" style="animation-duration:27s;animation-delay:-13s"/><circle cx="90" cy="544" r="1.8" fill="#9fc4ff" class="bgU" style="animation-duration:29s;animation-delay:-16s"/><circle cx="895" cy="679" r="1.8" fill="#9fc4ff" class="bgU" style="animation-duration:36s;animation-delay:-9s"/><circle cx="881" cy="207" r="1.9" fill="#9fc4ff" class="bgU" style="animation-duration:26s;animation-delay:-7s"/><circle cx="773" cy="411" r="1.8" fill="#9fc4ff" class="bgU" style="animation-duration:28s;animation-delay:-11s"/><circle cx="479" cy="472" r="1.5" fill="#9fc4ff" class="bgU" style="animation-duration:25s;animation-delay:-15s"/><circle cx="909" cy="379" r="1.1" fill="#9fc4ff" class="bgU" style="animation-duration:38s;animation-delay:-1s"/><circle cx="942" cy="216" r="1.5" fill="#9fc4ff" class="bgU" style="animation-duration:25s;animation-delay:-8s"/><circle cx="756" cy="570" r="2.0" fill="#9fc4ff" class="bgU" style="animation-duration:32s;animation-delay:-14s"/><circle cx="730" cy="192" r="0.9" fill="#9fc4ff" class="bgU" style="animation-duration:23s;animation-delay:-14s"/><circle cx="781" cy="505" r="1.6" fill="#9fc4ff" class="bgU" style="animation-duration:35s;animation-delay:-9s"/><circle cx="885" cy="180" r="1.3" fill="#9fc4ff" class="bgU" style="animation-duration:36s;animation-delay:-15s"/><circle cx="153" cy="33" r="1.1" fill="#9fc4ff" class="bgU" style="animation-duration:23s;animation-delay:-12s"/><circle cx="946" cy="178" r="1.8" fill="#9fc4ff" class="bgU" style="animation-duration:36s;animation-delay:-19s"/></g><defs><clipPath id="cc"><rect x="40" y="0" width="920" height="325"/></clipPath></defs><g clip-path="url(#cc)"><g transform="translate(40 -16)"><path d="M0 0 H920 V357 H0 V0 Z" fill="#060c1f" fill-opacity=".76" stroke="#1b2f57"/></g></g><circle cx="86" cy="25" r="3.5" fill="#4da3ff"/><text x="102.0" y="31.0" class="t" font-size="17" font-weight="700" fill="#ffffff" textLength="83.0" lengthAdjust="spacingAndGlyphs">Transport:</text><text x="190.0" y="31.0" class="t" font-size="17" fill="#c4d3ee" textLength="697.0" lengthAdjust="spacingAndGlyphs">Bluetooth LE GATT. A configuration service with one write and one notify characteristic. The</text><text x="102.0" y="58.0" class="t" font-size="17" fill="#c4d3ee" textLength="699.0" lengthAdjust="spacingAndGlyphs">OTA firmware service is documented so it can be left alone: X20CTL does not flash firmware.</text><circle cx="86" cy="86" r="3.5" fill="#4da3ff"/><text x="102.0" y="92.0" class="t" font-size="17" font-weight="700" fill="#ffffff" textLength="122.0" lengthAdjust="spacingAndGlyphs">Fingerprinting:</text><text x="229.0" y="92.0" class="t" font-size="17" fill="#c4d3ee" textLength="655.0" lengthAdjust="spacingAndGlyphs">the controllers&#x27; Bluetooth address prefixes tell models apart far better than the cloned</text><rect x="101.0" y="103.0" width="89.0" height="24" rx="5" fill="#0f2140" stroke="#1d3a6b"/><text x="105.0" y="119.0" class="mo" font-size="15.3" fill="#a9d0ff" textLength="81.0" lengthAdjust="spacingAndGlyphs">045E:028E</text><text x="194.0" y="119.0" class="t" font-size="17" fill="#c4d3ee" textLength="57.0" lengthAdjust="spacingAndGlyphs">USB ID.</text><circle cx="86" cy="147" r="3.5" fill="#4da3ff"/><text x="102.0" y="153.0" class="t" font-size="17" font-weight="700" fill="#ffffff" textLength="113.0" lengthAdjust="spacingAndGlyphs">Honest status:</text><text x="220.0" y="153.0" class="t" font-size="17" fill="#c4d3ee" textLength="140.0" lengthAdjust="spacingAndGlyphs">a model is marked</text><text x="365.0" y="153.0" class="t" font-size="17" font-style="italic" fill="#c4d3ee" textLength="52.0" lengthAdjust="spacingAndGlyphs">verified</text><text x="422.0" y="153.0" class="t" font-size="17" fill="#c4d3ee" textLength="447.0" lengthAdjust="spacingAndGlyphs">only after its settings can be read back from real hardware.</text><text x="102.0" y="180.0" class="t" font-size="17" fill="#c4d3ee" textLength="777.0" lengthAdjust="spacingAndGlyphs">Everything else is a read-only preview, and nothing is written to a controller X20CTL cannot read back.</text><circle cx="86" cy="208" r="3.5" fill="#4da3ff"/><text x="102.0" y="214.0" class="t" font-size="17" font-weight="700" fill="#ffffff" textLength="208.0" lengthAdjust="spacingAndGlyphs">Read scan and Write scan:</text><text x="315.0" y="214.0" class="t" font-size="17" fill="#c4d3ee" textLength="80.0" lengthAdjust="spacingAndGlyphs">the in-app</text><text x="400.0" y="214.0" class="t" font-size="17" fill="#6fb0ff" textLength="127.0" lengthAdjust="spacingAndGlyphs">Controller Check</text><line x1="400.0" x2="527.0" y1="217.5" y2="217.5" stroke="#6fb0ff" stroke-opacity=".6"/><text x="532.0" y="214.0" class="t" font-size="17" fill="#c4d3ee" textLength="364.0" lengthAdjust="spacingAndGlyphs">and the phone-log-based Write scan let owners</text><text x="102.0" y="241.0" class="t" font-size="17" fill="#c4d3ee" textLength="277.0" lengthAdjust="spacingAndGlyphs">contribute evidence for new models.</text><circle cx="86" cy="269" r="3.5" fill="#4da3ff"/><text x="102.0" y="275.0" class="t" font-size="17" font-weight="700" fill="#ffffff" textLength="128.0" lengthAdjust="spacingAndGlyphs">Research policy:</text><text x="235.0" y="275.0" class="t" font-size="17" fill="#c4d3ee" textLength="680.0" lengthAdjust="spacingAndGlyphs">raw captures and personal data stay private. Only reviewed, derived implementation goes</text><text x="102.0" y="302.0" class="t" font-size="17" fill="#c4d3ee" textLength="131.0" lengthAdjust="spacingAndGlyphs">in this repository:</text><text x="238.0" y="302.0" class="t" font-size="17" fill="#6fb0ff" textLength="186.0" lengthAdjust="spacingAndGlyphs">docs/research-policy.md</text><line x1="238.0" x2="424.0" y1="305.5" y2="305.5" stroke="#6fb0ff" stroke-opacity=".6"/><text x="424.0" y="302.0" class="t" font-size="17" fill="#c4d3ee" textLength="4.0" lengthAdjust="spacingAndGlyphs">.</text></svg>