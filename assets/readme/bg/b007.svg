<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 325" width="1000" height="325" role="img" aria-label="Transport: Bluetooth LE GATT. A configuration service with one write and one notify characteristic. The OTA firmware service is documented so it can be left alone: X20CTL does not flash firmware.; Fingerprinting: the controllers&#x27; Bluetooth address prefixes tell models apart far better than the clone"><defs><radialGradient id="bg_1d4ed8"><stop offset="0" stop-color="#1d4ed8"/><stop offset=".55" stop-color="#1d4ed8" stop-opacity=".3"/><stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/></radialGradient><radialGradient id="bg_1e40af"><stop offset="0" stop-color="#1e40af"/><stop offset=".55" stop-color="#1e40af" stop-opacity=".3"/><stop offset="1" stop-color="#1e40af" stop-opacity="0"/></radialGradient><radialGradient id="bg_312e81"><stop offset="0" stop-color="#312e81"/><stop offset=".55" stop-color="#312e81" stop-opacity=".3"/><stop offset="1" stop-color="#312e81" stop-opacity="0"/></radialGradient><radialGradient id="bg_1e3a8a"><stop offset="0" stop-color="#1e3a8a"/><stop offset=".55" stop-color="#1e3a8a" stop-opacity=".3"/><stop offset="1" stop-color="#1e3a8a" stop-opacity="0"/></radialGradient><radialGradient id="bg_1d4ed8"><stop offset="0" stop-color="#1d4ed8"/><stop offset=".55" stop-color="#1d4ed8" stop-opacity=".3"/><stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/></radialGradient><pattern id="bg_grid" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="translate(0 -34)"><path d="M40 0H0V40" fill="none" stroke="#6ea0ff" stroke-opacity=".055"/></pattern><linearGradient id="bg_hbar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4da3ff"/><stop offset="1" stop-color="#4da3ff"/></linearGradient><clipPath id="bg_clip"><path d="M0 0 H1000 V325 H0 V0 Z"/></clipPath></defs><style>.bgA{animation:bgA 40s ease-in-out infinite alternate}.bgB{animation:bgB 52s ease-in-out infinite alternate}.bgC{animation:bgC 64s ease-in-out infinite alternate}@keyframes bgA{to{transform:translate(70px,30px)}}@keyframes bgB{to{transform:translate(-80px,40px)}}@keyframes bgC{to{transform:translate(50px,-50px)}}.bgP{stroke-dasharray:30 970;animation:bgP 9s linear infinite}@keyframes bgP{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}.bgR{animation:bgR 60s linear infinite}@keyframes bgR{to{transform:rotate(360deg)}}.bgRr{animation:bgR 90s linear infinite reverse}.bgF{animation:bgF 14s ease-in-out infinite alternate}@keyframes bgF{to{transform:translateY(-18px)}}.bgU{animation:bgU 26s linear infinite}@keyframes bgU{from{transform:translateY(0);opacity:0}10%{opacity:.8}90%{opacity:.8}to{transform:translateY(-360px);opacity:0}}.t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.mo{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><path d="M0 0 H1000 V325 H0 V0 Z" fill="#0a0f1c"/><g clip-path="url(#bg_clip)"><g class="bgA"><circle cx="920" cy="-204" r="480" fill="url(#bg_1e3a8a)" opacity="0.22"/></g><g class="bgB"><circle cx="80" cy="316" r="480" fill="url(#bg_1d4ed8)" opacity="0.22"/></g></g><defs><linearGradient id="fdl"><stop offset="0" stop-color="#0d1117" stop-opacity="0.95"/><stop offset="0.35" stop-color="#0d1117" stop-opacity="0.55"/><stop offset="0.7" stop-color="#0d1117" stop-opacity="0.18"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></linearGradient><linearGradient id="fdr" x1="1" x2="0"><stop offset="0" stop-color="#0d1117" stop-opacity="0.95"/><stop offset="0.35" stop-color="#0d1117" stop-opacity="0.55"/><stop offset="0.7" stop-color="#0d1117" stop-opacity="0.18"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></linearGradient></defs><rect width="46" height="325" fill="url(#fdl)"/><rect x="954" width="46" height="325" fill="url(#fdr)"/><circle cx="86" cy="25" r="3.5" fill="#4da3ff"/><text x="102.0" y="31.0" class="t" font-size="17" font-weight="700" fill="#ffffff" textLength="83.0" lengthAdjust="spacingAndGlyphs">Transport:</text><text x="190.0" y="31.0" class="t" font-size="17" fill="#c4d3ee" textLength="697.0" lengthAdjust="spacingAndGlyphs">Bluetooth LE GATT. A configuration service with one write and one notify characteristic. The</text><text x="102.0" y="58.0" class="t" font-size="17" fill="#c4d3ee" textLength="699.0" lengthAdjust="spacingAndGlyphs">OTA firmware service is documented so it can be left alone: X20CTL does not flash firmware.</text><circle cx="86" cy="86" r="3.5" fill="#4da3ff"/><text x="102.0" y="92.0" class="t" font-size="17" font-weight="700" fill="#ffffff" textLength="122.0" lengthAdjust="spacingAndGlyphs">Fingerprinting:</text><text x="229.0" y="92.0" class="t" font-size="17" fill="#c4d3ee" textLength="655.0" lengthAdjust="spacingAndGlyphs">the controllers&#x27; Bluetooth address prefixes tell models apart far better than the cloned</text><rect x="101.0" y="103.0" width="89.0" height="24" rx="5" fill="#141c30" stroke="#26334f"/><text x="105.0" y="119.0" class="mo" font-size="15.3" fill="#c9d8f2" textLength="81.0" lengthAdjust="spacingAndGlyphs">045E:028E</text><text x="194.0" y="119.0" class="t" font-size="17" fill="#c4d3ee" textLength="57.0" lengthAdjust="spacingAndGlyphs">USB ID.</text><circle cx="86" cy="147" r="3.5" fill="#4da3ff"/><text x="102.0" y="153.0" class="t" font-size="17" font-weight="700" fill="#ffffff" textLength="113.0" lengthAdjust="spacingAndGlyphs">Honest status:</text><text x="220.0" y="153.0" class="t" font-size="17" fill="#c4d3ee" textLength="140.0" lengthAdjust="spacingAndGlyphs">a model is marked</text><text x="365.0" y="153.0" class="t" font-size="17" font-style="italic" fill="#c4d3ee" textLength="52.0" lengthAdjust="spacingAndGlyphs">verified</text><text x="422.0" y="153.0" class="t" font-size="17" fill="#c4d3ee" textLength="447.0" lengthAdjust="spacingAndGlyphs">only after its settings can be read back from real hardware.</text><text x="102.0" y="180.0" class="t" font-size="17" fill="#c4d3ee" textLength="777.0" lengthAdjust="spacingAndGlyphs">Everything else is a read-only preview, and nothing is written to a controller X20CTL cannot read back.</text><circle cx="86" cy="208" r="3.5" fill="#4da3ff"/><text x="102.0" y="214.0" class="t" font-size="17" font-weight="700" fill="#ffffff" textLength="208.0" lengthAdjust="spacingAndGlyphs">Read scan and Write scan:</text><text x="315.0" y="214.0" class="t" font-size="17" fill="#c4d3ee" textLength="80.0" lengthAdjust="spacingAndGlyphs">the in-app</text><text x="400.0" y="214.0" class="t" font-size="17" fill="#6fb0ff" textLength="127.0" lengthAdjust="spacingAndGlyphs">Controller Check</text><line x1="400.0" x2="527.0" y1="217.5" y2="217.5" stroke="#6fb0ff" stroke-opacity=".6"/><text x="532.0" y="214.0" class="t" font-size="17" fill="#c4d3ee" textLength="364.0" lengthAdjust="spacingAndGlyphs">and the phone-log-based Write scan let owners</text><text x="102.0" y="241.0" class="t" font-size="17" fill="#c4d3ee" textLength="277.0" lengthAdjust="spacingAndGlyphs">contribute evidence for new models.</text><circle cx="86" cy="269" r="3.5" fill="#4da3ff"/><text x="102.0" y="275.0" class="t" font-size="17" font-weight="700" fill="#ffffff" textLength="128.0" lengthAdjust="spacingAndGlyphs">Research policy:</text><text x="235.0" y="275.0" class="t" font-size="17" fill="#c4d3ee" textLength="680.0" lengthAdjust="spacingAndGlyphs">raw captures and personal data stay private. Only reviewed, derived implementation goes</text><text x="102.0" y="302.0" class="t" font-size="17" fill="#c4d3ee" textLength="131.0" lengthAdjust="spacingAndGlyphs">in this repository:</text><text x="238.0" y="302.0" class="t" font-size="17" fill="#6fb0ff" textLength="186.0" lengthAdjust="spacingAndGlyphs">docs/research-policy.md</text><line x1="238.0" x2="424.0" y1="305.5" y2="305.5" stroke="#6fb0ff" stroke-opacity=".6"/><text x="424.0" y="302.0" class="t" font-size="17" fill="#c4d3ee" textLength="4.0" lengthAdjust="spacingAndGlyphs">.</text></svg>