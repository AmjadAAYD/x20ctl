" fill="#4F7BE8" fill-opacity="0.026"/><polygon points="380,760 740,760 340,1620 -20,1620" fill="#B9D0F8" fill-opacity="0.022"/><polygon points="790,1040 1020,1040 620,1880 390,1880" fill="#4F7BE8" fill-opacity="0.026"/><polygon points="380,1720 740,1720 340,2580 -20,2580" fill="#B9D0F8" fill-opacity="0.022"/><polygon points="790,2000 1020,2000 620,2840 390,2840" fill="#4F7BE8" fill-opacity="0.026"/><polygon points="380,2680 740,2680 340,3540 -20,3540" fill="#B9D0F8" fill-opacity="0.022"/><polygon points="790,2960 1020,2960 620,3800 390,3800" fill="#4F7BE8" fill-opacity="0.026"/><polygon points="380,3640 740,3640 340,4500 -20,4500" fill="#B9D0F8" fill-opacity="0.022"/><polygon points="790,3920 1020,3920 620,4760 390,4760" fill="#4F7BE8" fill-opacity="0.026"/><polygon points="380,4600 740,4600 340,5460 -20,5460" fill="#B9D0F8" fill-opacity="0.022"/><polygon points="790,4880 1020,4880 620,5720 390,5720" fill="#4F7BE8" fill-opacity="0.026"/><polygon points="380,5560 740,5560 340,6420 -20,6420" fill="#B9D0F8" fill-opacity="0.022"/><polygon points="790,5840 1020,5840 620,6680 390,6680" fill="#4F7BE8" fill-opacity="0.026"/><polygon points="380,6520 740,6520 340,7380 -20,7380" fill="#B9D0F8" fill-opacity="0.022"/><polygon points="790,6800 1020,6800 620,7640 390,7640" fill="#4F7BE8" fill-opacity="0.026"/><ellipse cx="720" cy="6098.0" rx="440" ry="210" fill="url(#sb_60a5fa_65)"/></g></g><line x1="18.5" y1="0" x2="18.5" y2="312" stroke="#DCE8FF" stroke-opacity="0.15" stroke-width="1"/><line x1="981.5" y1="0" x2="981.5" y2="312" stroke="#DCE8FF" stroke-opacity="0.15" stroke-width="1"/><text x="48" y="34" class="m" font-size="11" font-weight="600" fill="#7D8B9F" letter-spacing="2">ARCHIVE // 04</text><text x="952" y="34" text-anchor="end" class="m" font-size="11" fill="#7D8B9F" letter-spacing="1.6">KEYLINKER WIRE PROTOCOL</text><text x="48" y="63" class="s" font-size="22.5" font-weight="700" fill="#F4F7FC" letter-spacing="-0.3">REVERSE ENGINEERING</text><line x1="48" y1="76" x2="952" y2="76" stroke="#DCE8FF" stroke-opacity="0.12" stroke-width="1"/><rect x="48" y="94" width="122" height="48" rx="8" fill="#0D1322" stroke="#DCE8FF" stroke-opacity="0.16" stroke-width="1"/><text x="60" y="114" class="m" font-size="11" font-weight="700" fill="#F4F7FC">OPCODE</text><text x="60" y="131" class="s" font-size="11.5" fill="#7D8B9F">1B command</text><rect x="180" y="94" width="122" height="48" rx="8" fill="#0D1322" stroke="#DCE8FF" stroke-opacity="0.16" stroke-width="1"/><text x="192" y="114" class="m" font-size="11" font-weight="700" fill="#F4F7FC">LENGTH</text><text x="192" y="131" class="s" font-size="11.5" fill="#7D8B9F">payload size</text><rect x="312" y="94" width="122" height="48" rx="8" fill="#0D1322" stroke="#DCE8FF" stroke-opacity="0.16" stroke-width="1"/><text x="324" y="114" class="m" font-size="11" font-weight="700" fill="#F4F7FC">SERIAL</text><text x="324" y="131" class="s" font-size="11.5" fill="#7D8B9F">session ctr</text><rect x="444" y="94" width="132" height="48" rx="8" fill="#0D1322" stroke="#DCE8FF" stroke-opacity="0.16" stroke-width="1"/><text x="456" y="114" class="m" font-size="11" font-weight="700" fill="#F4F7FC">NONCE</text><text x="456" y="131" class="s" font-size="11.5" fill="#7D8B9F">keystream idx</text><rect x="586" y="94" width="232" height="48" rx="8" fill="#0D1322" stroke="#DCE8FF" stroke-opacity="0.16" stroke-width="1"/><text x="598" y="114" class="m" font-size="11" font-weight="700" fill="#F4F7FC">PAYLOAD</text><text x="598" y="131" class="s" font-size="11.5" fill="#7D8B9F">up to 15 bytes</text><rect x="828" y="94" width="124" height="48" rx="8" fill="#0D1322" stroke="#DCE8FF" stroke-opacity="0.16" stroke-width="1"/><text x="840" y="114" class="m" font-size="11" font-weight="700" fill="#F4F7FC">CRC-8</text><text x="840" y="131" class="s" font-size="11.5" fill="#7D8B9F">poly 0xEB</text><rect x="48" y="156" width="166" height="34" rx="17" fill="#0E1422" stroke="#DCE8FF" stroke-opacity="0.14" stroke-width="1"/><text x="131.0" y="177" text-anchor="middle" class="s" font-size="12" font-weight="600" fill="#BAC5D8">1. Decompile</text><text x="223.0" y="177" text-anchor="middle" class="s" font-size="12" fill="#7D8B9F">→</text><rect x="232" y="156" width="166" height="34" rx="17" fill="#0E1422" stroke="#DCE8FF" stroke-opacity="0.14" stroke-width="1"/><text x="315.0" y="177" text-anchor="middle" class="s" font-size="12" font-weight="600" fill="#BAC5D8">2. Capture BLE</text><text x="407.0" y="177" text-anchor="middle" class="s" font-size="12" fill="#7D8B9F">→</text><rect x="416" y="156" width="166" height="34" rx="17" fill="#0E1422" stroke="#DCE8FF" stroke-opacity="0.14" stroke-width="1"/><text x="499.0" y="177" text-anchor="middle" class="s" font-size="12" font-weight="600" fill="#BAC5D8">3. Diff 1 setting</text><text x="591.0" y="177" text-anchor="middle" class="s" font-size="12" fill="#7D8B9F">→</text><rect x="600" y="156" width="166" height="34" rx="17" fill="#17233B" stroke="#DCE8FF" stroke-opacity="0.30" stroke-width="1"/><text x="683.0" y="177" text-anchor="middle" class="s" font-size="12" font-weight="600" fill="#F4F7FC">4. Verify read-back</text><text x="775.0" y="177" text-anchor="middle" class="s" font-size="12" fill="#7D8B9F">→</text><rect x="784" y="156" width="166" height="34" rx="17" fill="#17233B" stroke="#DCE8FF" stroke-opacity="0.30" stroke-width="1"/><text x="867.0" y="177" text-anchor="middle" class="s" font-size="12" font-weight="600" fill="#F4F7FC">5. Ship in Studio</text><rect x="48" y="210" width="5" height="5" fill="#60A5FA"/><text x="63" y="218" class="s" font-size="12.5" fill="#BAC5D8"><tspan font-weight="700" fill="#F4F7FC">Transport &amp; Safety:</tspan> BLE GATT (+ USB serial for X20 Pro screen uploads). OTA characteristics are left untouched — never flashes firmware.</text><rect x="48" y="232" width="5" height="5" fill="#60A5FA"/><text x="63" y="240" class="s" font-size="12.5" fill="#BAC5D8"><tspan font-weight="700" fill="#F4F7FC">Honest Identity:</tspan> Matches real hardware BLE and USB descriptors while avoiding ambiguous 045E:028E and STK-7024X DInput traps.</text><rect x="48" y="254" width="5" height="5" fill="#60A5FA"/><text x="63" y="262" class="s" font-size="12.5" fill="#BAC5D8"><tspan font-weight="700" fill="#F4F7FC">Verified Writes Only:</tspan> Nothing writes to controller memory unless read-back has been verified; drafts stay local in PC Mode.</text><rect x="48" y="276" width="5" height="5" fill="#60A5FA"/><text x="63" y="284" class="s" font-size="12.5" fill="#BAC5D8"><tspan font-weight="700" fill="#F4F7FC">Research Boundary:</tspan> Raw captures and personal IDs stay private; only sanitized protocol docs ship publicly.</text></svg>
