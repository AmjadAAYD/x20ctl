r-spacing="-0.3">REVERSE ENGINEERING</text><line x1="48" y1="76" x2="952" y2="76" stroke="#DCE8FF" stroke-opacity="0.14" stroke-width="1"/><g clip-path="url(#shc_archive04)"><rect x="48" y="75.5" width="72" height="2" fill="#60A5FA" fill-opacity="0.65"/><rect x="-162" y="75.5" width="210" height="2" fill="url(#shg_archive04)"><animate attributeName="x" values="-162;952;952" keyTimes="0;0.58;1" dur="5.4s" repeatCount="indefinite"/></rect></g></g><rect x="48" y="92" width="122" height="48" rx="8" fill="#0D1322" stroke="#60A5FA" stroke-opacity="0.16" stroke-width="1" class="rpk0"/><text x="60" y="112" class="m" font-size="11" font-weight="700" fill="#F4F7FC">OPCODE</text><text x="60" y="129" class="s" font-size="11.5" fill="#7D8B9F">1B command</text><rect x="180" y="92" width="122" height="48" rx="8" fill="#0D1322" stroke="#60A5FA" stroke-opacity="0.16" stroke-width="1" class="rpk1"/><text x="192" y="112" class="m" font-size="11" font-weight="700" fill="#F4F7FC">LENGTH</text><text x="192" y="129" class="s" font-size="11.5" fill="#7D8B9F">payload size</text><rect x="312" y="92" width="122" height="48" rx="8" fill="#0D1322" stroke="#60A5FA" stroke-opacity="0.16" stroke-width="1" class="rpk2"/><text x="324" y="112" class="m" font-size="11" font-weight="700" fill="#F4F7FC">SERIAL</text><text x="324" y="129" class="s" font-size="11.5" fill="#7D8B9F">session ctr</text><rect x="444" y="92" width="132" height="48" rx="8" fill="#0D1322" stroke="#60A5FA" stroke-opacity="0.16" stroke-width="1" class="rpk3"/><text x="456" y="112" class="m" font-size="11" font-weight="700" fill="#F4F7FC">NONCE</text><text x="456" y="129" class="s" font-size="11.5" fill="#7D8B9F">keystream idx</text><rect x="586" y="92" width="232" height="48" rx="8" fill="#0D1322" stroke="#60A5FA" stroke-opacity="0.16" stroke-width="1" class="rpk4"/><text x="598" y="112" class="m" font-size="11" font-weight="700" fill="#F4F7FC">PAYLOAD</text><text x="598" y="129" class="s" font-size="11.5" fill="#7D8B9F">up to 15 bytes</text><rect x="828" y="92" width="124" height="48" rx="8" fill="#0D1322" stroke="#60A5FA" stroke-opacity="0.16" stroke-width="1" class="rpk5"/><text x="840" y="112" class="m" font-size="11" font-weight="700" fill="#F4F7FC">CRC-8</text><text x="840" y="129" class="s" font-size="11.5" fill="#7D8B9F">poly 0xEB</text><rect x="48" y="154" width="532" height="116" rx="10" fill="#0D1322" fill-opacity="0.92" stroke="#DCE8FF" stroke-opacity="0.16" stroke-width="1"/><text x="64" y="172" class="m" font-size="10" font-weight="700" fill="#7DD3FC" letter-spacing="1.4">DUAL-LINK BUS</text><text x="564" y="172" text-anchor="end" class="m" font-size="10" fill="#7D8B9F" letter-spacing="1.2">SIMULTANEOUS TRANSPORT</text><rect x="64" y="186" width="132" height="66" rx="8" fill="#131C30" stroke="#60A5FA" stroke-opacity="0.32" stroke-width="1"/><text x="130" y="213" text-anchor="middle" class="m" font-size="11.5" font-weight="700" fill="#F4F7FC">X20CTL STUDIO</text><text x="130" y="232" text-anchor="middle" class="s" font-size="11" fill="#7D8B9F">Win / Linux Host</text><rect x="432" y="186" width="132" height="66" rx="8" fill="#131C30" stroke="#A78BFA" stroke-opacity="0.32" stroke-width="1"/><text x="498" y="213" text-anchor="middle" class="m" font-size="11.5" font-weight="700" fill="#F4F7FC">EASYSMX X20 PRO</text><text x="498" y="232" text-anchor="middle" class="s" font-size="11" fill="#7D8B9F">Dongle + BLE MCU</text><text x="314" y="194" text-anchor="middle" class="m" font-size="10" font-weight="600" fill="#38BDF8">2.4G HID · 1000Hz LIVE STREAM</text><line x1="196" y1="204" x2="432" y2="204" stroke="#22D3EE" stroke-opacity="0.28" stroke-width="2" stroke-linecap="round"/><circle cx="196" cy="204" r="3" fill="#22D3EE"/><circle cx="432" cy="204" r="3" fill="#22D3EE"/><g><circle cx="0" cy="0" r="10" fill="url(#re_glow_c)"/><circle cx="0" cy="0" r="3.4" fill="#67E8F9"/><animateMotion dur="1.4s" repeatCount="indefinite" path="M 196 204 L 432 204"/></g><g><circle cx="0" cy="0" r="9" fill="url(#re_glow_c)"/><circle cx="0" cy="0" r="3" fill="#22D3EE"/><animateMotion dur="1.4s" begin="0.7s" repeatCount="indefinite" path="M 196 204 L 432 204"/></g><line x1="196" y1="240" x2="432" y2="240" stroke="#A78BFA" stroke-opacity="0.28" stroke-width="2" stroke-linecap="round"/><circle cx="196" cy="240" r="3" fill="#A78BFA"/><circle cx="432" cy="240" r="3" fill="#34D399"/><text x="314" y="257" text-anchor="middle" class="m" font-size="10" font-weight="600" fill="#C4B5FD">BLE GATT · 0x37 WRITE / 0xB3 VERIFY</text><g><circle cx="0" cy="0" r="10" fill="url(#re_glow_v)"/><circle cx="0" cy="0" r="3.4" fill="#C4B5FD"/><animateMotion dur="2.4s" repeatCount="indefinite" path="M 196 240 L 432 240"/></g><g><circle cx="0" cy="0" r="10" fill="url(#re_glow_g)"/><circle cx="0" cy="0" r="3.4" fill="#6EE7B7"/><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M 432 240 L 196 240"/></g><rect x="592" y="154" width="360" height="116" rx="10" fill="#0D1322" fill-opacity="0.94" stroke="#DCE8FF" stroke-opacity="0.16" stroke-width="1"/><rect x="592" y="154" width="360" height="24" rx="10" fill="#131C30"/><circle cx="607" cy="166" r="3" fill="#F43F75"/><circle cx="618" cy="166" r="3" fill="#F59E0B"/><circle cx="629" cy="166" r="3" fill="#22C55E"/><text x="938" y="169" text-anchor="end" class="m" font-size="9.5" font-weight="600" fill="#7D8B9F" letter-spacing="1.1">PACKET MONITOR · VERIFIED</text><text x="606" y="198" class="m rtl0" font-size="10.5" fill="#7DD3FC">&gt; TX 0x91 IDENT   [1020:2006 FW 1.44]</text><text x="606" y="217" class="m rtl1" font-size="10.5" fill="#C4B5FD">&gt; TX 0x37 RGB     4-ZONE 2.4G+BLE SYNC</text><text x="606" y="236" class="m rtl2" font-size="10.5" fill="#6EE7B7">&lt; RX 0xB7 VERIFY  CRC-8 0xEB · MATCH OK</text><text x="606" y="255" class="m rtl3" font-size="10.5" fill="#F4F7FC">&gt; PC MODE ViGEm   XINPUT 1000Hz READY <tspan fill="#38BDF8" class="recur">_</tspan></text><rect x="48" y="288" width="5" height="5" fill="#60A5FA"/><text x="63" y="296" class="s" font-size="12.5" fill="#BAC5D8"><tspan font-weight="700" fill="#F4F7FC">Transport &amp; Safety:</tspan> BLE GATT (+ USB serial for X20 Pro screen uploads). OTA characteristics are left untouched - never flashes firmware.</text><rect x="48" y="310" width="5" height="5" fill="#60A5FA"/><text x="63" y="318" class="s" font-size="12.5" fill="#BAC5D8"><tspan font-weight="700" fill="#F4F7FC">Honest Identity:</tspan> Matches real hardware BLE and USB descriptors while avoiding ambiguous 045E:028E and STK-7024X DInput traps.</text><rect x="48" y="332" width="5" height="5" fill="#60A5FA"/><text x="63" y="340" class="s" font-size="12.5" fill="#BAC5D8"><tspan font-weight="700" fill="#F4F7FC">Verified Writes Only:</tspan> Nothing writes to controller memory unless read-back has been verified; drafts stay local in PC Mode.</text><rect x="48" y="354" width="5" height="5" fill="#60A5FA"/><text x="63" y="362" class="s" font-size="12.5" fill="#BAC5D8"><tspan font-weight="700" fill="#F4F7FC">Research Boundary:</tspan> Raw captures and personal IDs stay private; only sanitized protocol docs ship publicly.</text></svg>
