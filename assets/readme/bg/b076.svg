ity="0.55"/><stop offset="0.7" stop-color="#0d1117" stop-opacity="0.18"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></linearGradient></defs><rect x="0" width="46" height="128" fill="url(#fdl)"/><rect x="954" width="46" height="128" fill="url(#fdr)"/><defs><clipPath id="cc"><rect x="40" y="0" width="920" height="128"/></clipPath></defs><g clip-path="url(#cc)"><g transform="translate(40 -16)"><path d="M0 0 H920 V160 H0 V0 Z" fill="#070b24" fill-opacity=".40" stroke="#4a54a8" stroke-opacity=".7"/></g></g><text x="78.0" y="33.0" class="t" font-size="17" fill="#c4d3ee" textLength="794.0" lengthAdjust="spacingAndGlyphs">For a preview model, nothing is written to the controller and nothing is stored as if it had been. A model</text><text x="78.0" y="60.0" class="t" font-size="17" fill="#c4d3ee" textLength="814.0" lengthAdjust="spacingAndGlyphs">becomes verified only once its settings can be read back from real hardware. Controller Check reports from</text><text x="78.0" y="87.0" class="t" font-size="17" fill="#c4d3ee" textLength="306.0" lengthAdjust="spacingAndGlyphs">owners help get each model there. With</text><text x="389.0" y="87.0" class="t" font-size="17" fill="#6fb0ff" textLength="70.0" lengthAdjust="spacingAndGlyphs">PC mode</text><line x1="389.0" x2="459.0" y1="90.5" y2="90.5" stroke="#6fb0ff" stroke-opacity=".6"/><text x="464.0" y="87.0" class="t" font-size="17" fill="#c4d3ee" textLength="456.0" lengthAdjust="spacingAndGlyphs">on, every model gets remaps, curves and macros on the PC,</text><text x="78.0" y="114.0" class="t" font-size="17" fill="#c4d3ee" textLength="310.0" lengthAdjust="spacingAndGlyphs">since nothing is written to the controller.</text></svg>