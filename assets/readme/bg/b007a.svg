y="0.63"/><circle cx="294" cy="34" r="1.0" fill="#cfe3ff" opacity="0.89" class="t0"/><circle cx="947" cy="32" r="1.3" fill="#cfe3ff" opacity="0.59"/><circle cx="329" cy="85" r="1.3" fill="#e9d5ff" opacity="0.90" class="t1"/><circle cx="294" cy="310" r="1.8" fill="#e9d5ff" opacity="0.58"/><circle cx="440" cy="144" r="0.6" fill="#cfe3ff" opacity="0.98" class="t2"/><circle cx="267" cy="176" r="1.0" fill="#ffffff" opacity="0.76"/><circle cx="959" cy="345" r="0.8" fill="#e9d5ff" opacity="0.92" class="t0"/><g class="shs" style="animation-delay:2.7s"><line x1="375" y1="0" x2="335" y2="-18" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity=".85"/></g></g><defs><linearGradient id="fdl"><stop offset="0" stop-color="#0d1117" stop-opacity="0.95"/><stop offset="0.35" stop-color="#0d1117" stop-opacity="0.55"/><stop offset="0.7" stop-color="#0d1117" stop-opacity="0.18"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></linearGradient><linearGradient id="fdr" x1="1" x2="0"><stop offset="0" stop-color="#0d1117" stop-opacity="0.95"/><stop offset="0.35" stop-color="#0d1117" stop-opacity="0.55"/><stop offset="0.7" stop-color="#0d1117" stop-opacity="0.18"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></linearGradient></defs><rect width="46" height="356" fill="url(#fdl)"/><rect x="954" width="46" height="356" fill="url(#fdr)"/><svg x="40" y="10" width="920" height="337.81" viewBox="0 0 1280 470" role="img" aria-label="KeyLinker packet layout: opcode, length, serial, nonce, payload, CRC-8, then scrambled"><style>.s{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}.hl{animation:hl 6s linear infinite}@keyframes hl{0%{transform:translateX(0)}100%{transform:translateX(950px)}}.fl{animation:fl 1.6s steps(1) infinite}@keyframes fl{0%{fill:#4da3ff}25%{fill:#22d3ee}50%{fill:#a78bfa}75%{fill:#4da3ff}}.fd{stroke-dasharray:6 8;animation:fd 1.4s linear infinite}@keyframes fd{to{stroke-dashoffset:-28}}.pu{animation:pu 3s ease-in-out infinite}@keyframes pu{50%{opacity:.4}}.row{animation:rw 8s ease-out infinite both}@keyframes rw{0%{opacity:0;transform:translateY(10px)}10%,92%{opacity:1;transform:none}100%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><clipPath id="rc"><rect width="1280" height="470" rx="18"/></clipPath><linearGradient id="hg" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#22d3ee" stop-opacity=".35"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient></defs><g clip-path="url(#rc)"><rect width="1280" height="470" fill="#050a18"/><text x="48" y="54" class="m" font-size="12" fill="#22d3ee" letter-spacing="2.4">KEYLINKER PACKET · BOTH DIRECTIONS</text><text x="48" y="92" class="s" font-size="30" font-weight="700" fill="#eaf2ff">Six fields, one checksum, one scramble.</text><g class="row"><rect x="105" y="128" width="122" height="86" rx="10" fill="#0a1430" stroke="#22407a"/><text x="166.0" y="164" text-anchor="middle" class="m" font-size="15" font-weight="700" fill="#cfe3ff" letter-spacing="1.5">OPCODE</text><text x="166.0" y="192" text-anchor="middle" class="m" font-size="12" fill="#7f98c8">1 B</text><rect x="235" y="128" width="122" height="86" rx="10" fill="#0a1430" stroke="#22407a"/><text x="296.0" y="164" text-anchor="middle" class="m" font-size="15" font-weight="700" fill="#cfe3ff" letter-spacing="1.5">LENGTH</text><text x="296.0" y="192" text-anchor="middle" class="m" font-size="12" fill="#7f98c8">1 B</text><rect x="365" y="128" width="122" height="86" rx="10" fill="#0a1430" stroke="#22407a"/><text x="426.0" y="164" text-anchor="middle" class="m" font-size="15" font-weight="700" fill="#cfe3ff" letter-spacing="1.5">SERIAL</text><text x="426.0" y="192" text-anchor="middle" class="m" font-size="12" fill="#7f98c8">1 B</text><rect x="495" y="128" width="122" height="86" rx="10" fill="#0a1430" stroke="#22407a"/><text x="556.0" y="164" text-anchor="middle" class="m" font-size="15" font-weight="700" fill="#cfe3ff" letter-spacing="1.5">NONCE</text><text x="556.0" y="192" text-anchor="middle" class="m" font-size="12" fill="#7f98c8">1 B</text><rect x="625" y="128" width="412" height="86" rx="10" fill="#0a1430" stroke="#22407a"/><text x="831.0" y="164" text-anchor="middle" class="m" font-size="15" font-weight="700" fill="#cfe3ff" letter-spacing="1.5">PAYLOAD</text><text x="831.0" y="192" text-anchor="middle" class="m" font-size="12" fill="#7f98c8">up to 15 B</text><rect x="1045" y="128" width="122" height="86" rx="10" fill="#0a1430" stroke="#22407a"/><text x="1106.0" y="164" text-anchor="middle" class="m" font-size="15" font-weight="700" fill="#cfe3ff" letter-spacing="1.5">CRC-8</text><text x="1106.0" y="192" text-anchor="middle" class="m" font-size="12" fill="#7f98c8">1 B</text></g><rect x="105" y="128" width="120" height="86" rx="10" fill="url(#hg)" class="hl"/><line x1="640" y1="228" x2="640" y2="290" stroke="#4da3ff" stroke-width="2" class="fd"/><path d="M632 282 L640 296 L648 282" fill="none" stroke="#4da3ff" stroke-width="2"/><rect x="672" y="236" width="360" height="40" rx="20" fill="#0a1430" stroke="#22407a"/><text x="852" y="262" text-anchor="middle" class="m" font-size="13" fill="#cfe3ff">encrypt(): XOR with two fixed keystreams</text><g class="row" style="animation-delay:.3s"><rect x="105" y="304" width="122" height="62" rx="10" fill="#0a0f24" stroke="#1a2a52"/><text x="166.0" y="344" text-anchor="middle" class="m fl" font-size="26" font-weight="700" style="animation-delay:0.9s">71</text><rect x="235" y="304" width="122" height="62" rx="10" fill="#0a0f24" stroke="#1a2a52"/><text x="296.0" y="344" text-anchor="middle" class="m fl" font-size="26" font-weight="700" style="animation-delay:1.1s">AE</text><rect x="365" y="304" width="122" height="62" rx="10" fill="#0a0f24" stroke="#1a2a52"/><text x="426.0" y="344" text-anchor="middle" class="m fl" font-size="26" font-weight="700" style="animation-delay:1.1s">7F</text><rect x="495" y="304" width="122" height="62" rx="10" fill="#0a0f24" stroke="#1a2a52"/><text x="556.0" y="344" text-anchor="middle" class="m fl" font-size="26" font-weight="700" style="animation-delay:0.4s">88</text><rect x="625" y="304" width="412" height="62" rx="10" fill="#0a0f24" stroke="#1a2a52"/><text x="677" y="344" text-anchor="middle" class="m fl" font-size="26" font-weight="700" style="animation-delay:0.7s">F4</text><text x="763" y="344" text-anchor="middle" class="m fl" font-size="26" font-weight="700" style="animation-delay:0.5s">5A</text><text x="849" y="344" text-anchor="middle" class="m fl" font-size="26" font-weight="700" style="animation-delay:1.5s">E2</text><text x="935" y="344" text-anchor="middle" class="m fl" font-size="26" font-weight="700" style="animation-delay:1.5s">1A</text><rect x="1045" y="304" width="122" height="62" rx="10" fill="#0a0f24" stroke="#1a2a52"/><text x="1106.0" y="344" text-anchor="middle" class="m fl" font-size="26" font-weight="700" style="animation-delay:0.1s">D9</text></g><text x="48" y="404" class="m" font-size="13" fill="#7f98c8">CRC-8 is reflected, polynomial 0xEB, init 0x00, no final XOR. The checksum byte passes through the scramble unchanged.</text><text x="48" y="430" class="m" font-size="13" fill="#7f98c8">It is scrambling, not cryptography: no key exchange, no authentication, so packets can be built offline.</text><circle cx="1220" cy="52" r="5" fill="#22d3ee" class="pu"/><text x="1204" y="57" text-anchor="end" class="m" font-size="12" fill="#7f98c8">BLE GATT</text></g><rect x=".5" y=".5" width="1279" height="469" rx="18" fill="none" stroke="#1b2f57"/></svg></svg>