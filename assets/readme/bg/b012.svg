0" y1="0" x2="600" y2="-18" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity=".85"/></g></g><defs><linearGradient id="fdl" gradientUnits="userSpaceOnUse" x1="0" x2="46"><stop offset="0" stop-color="#0d1117" stop-opacity="0.95"/><stop offset="0.35" stop-color="#0d1117" stop-opacity="0.55"/><stop offset="0.7" stop-color="#0d1117" stop-opacity="0.18"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></linearGradient><linearGradient id="fdr" gradientUnits="userSpaceOnUse" x1="1000" x2="954"><stop offset="0" stop-color="#0d1117" stop-opacity="0.95"/><stop offset="0.35" stop-color="#0d1117" stop-opacity="0.55"/><stop offset="0.7" stop-color="#0d1117" stop-opacity="0.18"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></linearGradient></defs><rect x="0" width="46" height="101" fill="url(#fdl)"/><rect x="954" width="46" height="101" fill="url(#fdr)"/><defs><clipPath id="cc"><rect x="40" y="0" width="920" height="101"/></clipPath></defs><g clip-path="url(#cc)"><g transform="translate(40 -16)"><path d="M0 0 H920 V101 A16 16 0 0 1 904 117 H16 A16 16 0 0 1 0 101 V0 Z" fill="#070b24" fill-opacity=".40" stroke="#4a54a8" stroke-opacity=".7"/></g></g><text x="78.0" y="33.0" class="t" font-size="17" fill="#c4d3ee" textLength="819.0" lengthAdjust="spacingAndGlyphs">The home screen. Each of the four players has a card; the selected card grows into the hero spot on the left</text><text x="78.0" y="60.0" class="t" font-size="17" fill="#c4d3ee" textLength="330.0" lengthAdjust="spacingAndGlyphs">and the other three wait on the right. Press</text><text x="413.0" y="60.0" class="t" font-size="17" font-weight="700" fill="#ffd37a" textLength="12.0" lengthAdjust="spacingAndGlyphs">+</text><text x="430.0" y="60.0" class="t" font-size="17" fill="#c4d3ee" textLength="480.0" lengthAdjust="spacingAndGlyphs">on an empty card to choose a controller. The app opens with a</text><text x="78.0" y="87.0" class="t" font-size="17" fill="#c4d3ee" textLength="90.0" lengthAdjust="spacingAndGlyphs">short intro (</text><text x="168.0" y="87.0" class="t" font-size="17" font-weight="700" fill="#ffd37a" textLength="24.0" lengthAdjust="spacingAndGlyphs">Esc</text><text x="197.0" y="87.0" class="t" font-size="17" fill="#c4d3ee" textLength="55.0" lengthAdjust="spacingAndGlyphs">skips it,</text><text x="257.0" y="87.0" class="t" font-size="17" font-weight="700" fill="#ffd37a" textLength="16.0" lengthAdjust="spacingAndGlyphs">M</text><text x="278.0" y="87.0" class="t" font-size="17" fill="#c4d3ee" textLength="370.0" lengthAdjust="spacingAndGlyphs">mutes it, and Tools → Opening intro turns it off).</text></svg>