="animation-duration:36s;animation-delay:-5s"/><circle cx="615" cy="118" r="1.8" fill="#9fc4ff" class="bgU" style="animation-duration:22s;animation-delay:-12s"/></g><defs><clipPath id="cc"><rect x="40" y="0" width="920" height="128"/></clipPath></defs><g clip-path="url(#cc)"><g transform="translate(40 -16)"><path d="M0 0 H920 V160 H0 V0 Z" fill="#060c1f" fill-opacity=".76" stroke="#1b2f57"/></g></g><text x="78.0" y="33.0" class="t" font-size="17" fill="#c4d3ee" textLength="838.0" lengthAdjust="spacingAndGlyphs">Without a phone log, the command line can compare the controller&#x27;s own settings before and after a change:</text><rect x="77.0" y="44.0" width="377.0" height="24" rx="5" fill="#1a1440" stroke="#4b3c9a"/><text x="81.0" y="60.0" class="mo" font-size="15.3" fill="#d2c4ff" textLength="369.0" lengthAdjust="spacingAndGlyphs">x20 state save before.json --label before</text><text x="453.0" y="60.0" class="t" font-size="17" fill="#c4d3ee" textLength="389.0" lengthAdjust="spacingAndGlyphs">, change one setting in the official app and close it,</text><rect x="77.0" y="71.0" width="359.0" height="24" rx="5" fill="#1a1440" stroke="#4b3c9a"/><text x="81.0" y="87.0" class="mo" font-size="15.3" fill="#d2c4ff" textLength="351.0" lengthAdjust="spacingAndGlyphs">x20 state save after.json --label after</text><text x="435.0" y="87.0" class="t" font-size="17" fill="#c4d3ee" textLength="44.0" lengthAdjust="spacingAndGlyphs">, then</text><rect x="483.0" y="71.0" width="341.0" height="24" rx="5" fill="#1a1440" stroke="#4b3c9a"/><text x="487.0" y="87.0" class="mo" font-size="15.3" fill="#d2c4ff" textLength="333.0" lengthAdjust="spacingAndGlyphs">x20 state diff before.json after.json</text><text x="823.0" y="87.0" class="t" font-size="17" fill="#c4d3ee" textLength="71.0" lengthAdjust="spacingAndGlyphs">. It shows</text><text x="78.0" y="114.0" class="t" font-size="17" fill="#c4d3ee" textLength="547.0" lengthAdjust="spacingAndGlyphs">which record and bytes changed, not the messages that changed them.</text></svg>