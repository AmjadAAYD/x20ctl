name: Windows verification
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Check public research boundary
        run: python tools/check_research_boundary.py
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned build dependencies and legacy test dependency
        run: |
          python -m pip install -r requirements-build.txt
          python -m pip install "PySide6>=6.6"
          npm ci
      - name: Verify Python behavior
        run: python -m pytest -q
      - name: Verify frontend
        run: |
          npm run lint
          npm test
          npm run build
      - name: Build integrated Windows preview
        run: |
          python tools/licenses.py
          python -m PyInstaller --noconfirm x20ctl.spec --distpath dist/4.1.0-preview.2
          python tools/package_desktop_preview.py
      - name: Upload Windows preview archive
        uses: actions/upload-artifact@v4
        with:
          name: x20ctl-windows-preview
          path: dist/x20ctl-*-win-x64.zip
          retention-days: 7
# Stable publication requires native-window acceptance. This job builds previews.
