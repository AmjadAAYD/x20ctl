name: Windows verification
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned build dependencies and legacy test dependency
        run: |
          python -m pip install -r requirements-build.txt
          python -m pip install "PySide6>=6.6"
          npm ci
      - name: Verify Python behavior
        run: python -m pytest -q
      - name: Verify frontend
        run: |
          npm run lint
          npm test
          npm run build
      - name: Build and verify paired Windows archive
        run: python tools/build_exe.py
      - name: Upload paired development archive
        uses: actions/upload-artifact@v4
        with:
          name: x20ctl-windows-paired-development
          path: dist/x20ctl-4.0.1-win-x64.zip
          retention-days: 7
# The archive contains both executables. Public release still requires native-window
# acceptance, release checksums, and an explicit publication step.
