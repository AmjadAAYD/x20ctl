name: Windows verification
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned build dependencies and legacy test dependency
        run: |
          python -m pip install -r requirements-build.txt
          python -m pip install "PySide6>=6.6"
          npm ci
      - name: Verify Python behavior
        run: python -m pytest -q
      - name: Verify frontend
        run: |
          npm run lint
          npm test
          npm run build
      - name: Build desktop executable
        run: python -m PyInstaller --noconfirm x20ctl.spec
      - name: Upload development executable
        uses: actions/upload-artifact@v4
        with:
          name: x20ctl-windows-development
          path: dist/x20ctl.exe
          retention-days: 7
# CI's smaller development artifact uses the system WebView2 runtime.
# Public releases use tools/build_exe.py --bundled-runtime and native-window acceptance.
