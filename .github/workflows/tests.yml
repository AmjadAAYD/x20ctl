name: Verification
on:
  push:
    branches: [main, 'codex/**', 'cleanup/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    name: CLI and protocol (Python)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public research boundary
        run: python tools/check_research_boundary.py
      - name: Install
        run: python -m pip install "bleak>=0.22" "pytest>=8" "packaging>=23"
      - name: Test
        run: python -m pytest -q -p no:cacheprovider
  dotnet:
    name: Domain tests (.NET)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test desktop-dotnet/X20Ctl.Zone.Tests
