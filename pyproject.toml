[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x20ctl"
dynamic = ["version"]
description = "Open configuration for the EasySMX X20 and other KeyLinker controllers"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Amjad AAYD" }]
keywords = ["gamepad", "controller", "easysmx", "keylinker", "bluetooth", "ble"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware",
]

# The protocol layer itself has no dependencies; bleak is needed to reach a
# controller. The Windows app is the separate .NET project in desktop-dotnet.
dependencies = ["bleak>=0.22"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
x20 = "x20ctl.cli:main"

[project.urls]
Homepage = "https://github.com/AmjadAAYD/x20ctl"

[tool.setuptools]
packages = ["x20ctl", "x20ctl.controllers", "x20ctl.scanning"]

[tool.setuptools.package-data]
"x20ctl.controllers" = ["catalog.json"]
"x20ctl.scanning" = ["PROVENANCE.json"]

# One source of truth, read straight out of the package.
[tool.setuptools.dynamic]
version = { attr = "x20ctl.__version__" }
