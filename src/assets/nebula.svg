<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960">
  <defs>
    <filter id="cloud" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".008 .014" numOctaves="3" seed="12" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 .54  0 0 0 0 .61  0 0 0 0 .94  0 0 0 1.8 -.62"/>
    </filter>
    <radialGradient id="band" gradientTransform="translate(.5 .5) rotate(-25) scale(.75 .19) translate(-.5 -.5)">
      <stop offset="0" stop-color="white" stop-opacity=".9"/>
      <stop offset=".45" stop-color="white" stop-opacity=".65"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <mask id="galaxy"><rect width="1440" height="960" fill="url(#band)"/></mask>
  </defs>
  <!-- Static texture is rasterized once; only the containing CSS layer moves. -->
  <rect width="1440" height="960" filter="url(#cloud)" mask="url(#galaxy)" opacity=".78"/>
</svg>
